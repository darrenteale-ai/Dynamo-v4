    </div>
  );
}

// Public, no-login vehicle daily inspection form (QR code in each vehicle).
function PublicVdi() {
  const [setup, setSetup] = useState(null);
  const [vehicleId, setVehicleId] = useState('');
  const [checkedBy, setCheckedBy] = useState('');
  const [mileage, setMileage] = useState('');
  const [answers, setAnswers] = useState({}); // item -> { ok, note }
  const [notes, setNotes] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(null);

  useEffect(() => {
    api.getVdiSetup().then((s) => {
      setSetup(s);
      const params = new URLSearchParams(window.location.search);
      const reg = (params.get('reg') || '').replace(/\s/g, '').toUpperCase();
      const match = reg && s.vehicles.find((v) => v.reg.replace(/\s/g, '').toUpperCase() === reg);
      if (match) setVehicleId(String(match.id));
    }).catch((err) => setError(err.message || 'Could not load the check form'));
  }, []);

  const allItems = setup ? setup.checklist.flatMap((s) => s.items) : [];
  const answered = allItems.filter((i) => answers[i]?.ok !== undefined).length;
  const failed = allItems.filter((i) => answers[i]?.ok === false);

  function answer(item, ok) {
    setAnswers((a) => ({ ...a, [item]: { ok, note: ok ? '' : (a[item]?.note || '') } }));
  }
  function setNote(item, note) {
    setAnswers((a) => ({ ...a, [item]: { ...(a[item] || { ok: false }), note } }));
  }
  function markRemainingOk() {
    setAnswers((a) => {
      const next = { ...a };
      allItems.forEach((i) => { if (next[i]?.ok === undefined) next[i] = { ok: true, note: '' }; });
      return next;
    });
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    if (answered < allItems.length) {
      setError(`Please answer every item (${allItems.length - answered} left).`);
      return;
    }
    setBusy(true);
    try {
      const results = allItems.map((item) => ({ item, ok: answers[item].ok, note: answers[item].note || null }));
      const res = await api.submitVdi({ vehicleId: Number(vehicleId), checkedBy, mileage, results, notes });
      setDone(res);
    } catch (err) {
      setError(err.message || 'Failed to submit the check');
    } finally {
      setBusy(false);
    }
  }

  function reset() {
    setVehicleId('');
    setMileage('');
    setAnswers({});
    setNotes('');
    setDone(null);
    setError('');
  }

  const brand = (
    <div className="public-report-brand">
      <div className="brand-icon brand-icon-light">
        <span className="brand-icon-letter">D</span>
        <span className="brand-icon-dot"></span>
      </div>
      DYNAMO
    </div>
  );

  if (done) {
    return (
      <div className="public-report-page">
        <div className="public-report-card">
          {brand}
          <h1>Check submitted</h1>
          {done.defectCount > 0 ? (
            <div className="warning-banner" style={{ marginTop: 10 }}>
              {done.defectCount} defect{done.defectCount === 1 ? ' has' : 's have'} been reported on {done.vehicleReg} and managers have been told.
              If the vehicle is not safe to use, do not drive it — contact the on-call manager now.
            </div>
          ) : (
            <div className="success-banner" style={{ marginTop: 10 }}>{done.vehicleReg} passed its daily check. Thank you.</div>
          )}
          <button type="button" className="btn btn-primary" onClick={reset}>Check another vehicle</button>
        </div>
      </div>
    );
  }

  return (
    <div className="public-report-page">
      <form className="public-report-card" onSubmit={handleSubmit}>
        {brand}
        <h1>Vehicle Daily Inspection</h1>
        <div className="page-sub">Complete at the start of every shift</div>

        {error && <div className="error-banner" style={{ marginTop: 10 }}>{error}</div>}

        {!setup ? (
          <div className="page-loading">Loading…</div>
        ) : setup.vehicles.length === 0 ? (
          <div className="warning-banner" style={{ marginTop: 10 }}>No vehicles have been set up yet. Please speak to a manager.</div>
        ) : (
          <>
            <div className="form-grid">
              <div className="form-field form-field-wide">
                <label>Vehicle</label>
                <select value={vehicleId} onChange={(e) => setVehicleId(e.target.value)} required>
                  <option value="" disabled>Choose the vehicle</option>
                  {setup.vehicles.map((v) => <option key={v.id} value={v.id}>{v.callSign ? `${v.callSign} — ${v.reg}` : v.reg}</option>)}
                </select>
              </div>
              <div className="form-field">
                <label>Your name</label>
                <input value={checkedBy} onChange={(e) => setCheckedBy(e.target.value)} placeholder="e.g. A. Smith" required />
              </div>
              <div className="form-field">
                <label>Mileage</label>
                <input type="number" inputMode="numeric" min="0" value={mileage} onChange={(e) => setMileage(e.target.value)} placeholder="e.g. 45210" required />
              </div>
            </div>

            <div style={{ marginTop: 18 }}>
              {setup.checklist.map((section, si) => (
                <div key={section.section} style={si > 0 ? { marginTop: 18 } : undefined}>
                  <div className="vdi-section-title">{section.section}</div>
                  {section.items.map((item) => {
                    const a = answers[item];
                    return (
                      <div key={item} style={{ padding: '8px 0', borderBottom: '1px solid var(--border)' }}>
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10 }}>
                          <span className="vdi-item-label">{item}</span>
                          <span style={{ display: 'flex', gap: 6, flexShrink: 0 }}>
                            <button
                              type="button"
                              className="btn btn-sm"
                              style={a?.ok === true ? { background: 'var(--green)', color: '#fff' } : { background: '#fff', border: '1px solid var(--border)' }}
                              onClick={() => answer(item, true)}
                            >
                              OK
                            </button>
                            <button
                              type="button"
                              className="btn btn-sm"
                              style={a?.ok === false ? { background: 'var(--red)', color: '#fff' } : { background: '#fff', border: '1px solid var(--border)' }}
                              onClick={() => answer(item, false)}
                            >
                              Defect
                            </button>
                          </span>
                        </div>
                        {a?.ok === false && (
                          <input
                            style={{ width: '100%', marginTop: 8 }}
                            value={a.note || ''}
                            onChange={(e) => setNote(item, e.target.value)}
                            placeholder="Describe the problem"
                            required
                          />
                        )}
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>

            {answered < allItems.length && (
              <button type="button" className="btn btn-ghost btn-sm" style={{ marginTop: 10, alignSelf: 'flex-start' }} onClick={markRemainingOk}>
                Mark the remaining {allItems.length - answered} item{allItems.length - answered === 1 ? '' : 's'} as OK
              </button>
            )}

            <div className="form-field form-field-wide" style={{ marginTop: 14 }}>
              <label>Anything else to report? (optional)</label>
              <textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={3} />
            </div>

            <div className="muted" style={{ fontSize: 13, margin: '10px 0' }}>
              {answered}/{allItems.length} items checked{failed.length ? ` · ${failed.length} defect${failed.length === 1 ? '' : 's'}` : ''}
            </div>

            <button type="submit" className="btn btn-primary" disabled={busy}>
              {busy ? 'Submitting…' : 'Submit check'}
            </button>
          </>
        )}
      </form>
    </div>
  );
}

function AdminRoute({ children }) {
  const { user } = useAuth();
  if (!isMgrOrAdmin(user?.role)) return <Navigate to="/incidents" replace />;
  return children;
}

function PrivateRoute({ children }) {
  const { user, loading } = useAuth();
  if (loading) return <div className="page-loading">Loading…</div>;
  if (!user) return <Navigate to="/login" replace />;
  return children;
}

function AppRoutes() {
  return (
    <Routes>
      <Route path="/login" element={<Login />} />
      <Route path="/report" element={<PublicReport />} />
      <Route path="/vdi" element={<PublicVdi />} />
      <Route
        path="/*"
        element={
          <PrivateRoute>
            <Layout>
              <Routes>
                <Route path="/" element={<Navigate to="/dashboard" replace />} />
                <Route path="/dashboard" element={<Dashboard />} />
                <Route path="/incidents" element={<Incidents />} />
                <Route path="/actions" element={<AdminRoute><Actions /></AdminRoute>} />
                <Route path="/safety-alerts" element={<SafetyAlerts />} />
                <Route path="/fleet" element={<AdminRoute><FleetManagement /></AdminRoute>} />
                <Route path="/assets" element={<AdminRoute><CompanyAssets /></AdminRoute>} />
                <Route path="/staff" element={<AdminRoute><Staff /></AdminRoute>} />
                <Route path="/case-notes" element={<AdminRoute><CaseNotes /></AdminRoute>} />
                <Route path="/settings" element={<Settings />} />
                <Route path="*" element={<Navigate to="/dashboard" replace />} />
              </Routes>
            </Layout>
          </PrivateRoute>
        }
      />
    </Routes>
  );
}

function App() {
  return (
    <AuthProvider>
      <AppRoutes />
    </AuthProvider>
  );
}



ReactDOM.createRoot(document.getElementById('root')).render(
  <React.StrictMode>
    <BrowserRouter>
      <App />
    </BrowserRouter>
  </React.StrictMode>
);

    </script>
  </body>
</html>
