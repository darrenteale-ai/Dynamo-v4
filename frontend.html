        </div>
      </div>

      {error && <div className="error-banner" style={{ marginBottom: 12 }}>{error}</div>}
      {notice && (
        <div className={notice.startsWith('⚠') ? 'warning-banner' : 'success-banner'} style={{ marginBottom: 12, display: 'flex', justifyContent: 'space-between', gap: 12 }}>
          <span>{notice}</span>
          <button type="button" className="btn btn-ghost btn-sm" onClick={() => setNotice('')}>Dismiss</button>
        </div>
      )}

      {summary && (
        <div className="kpi-grid">
          <div className="kpi-card kpi-card-green">
            <div className="kpi-value">{summary.available}/{summary.total}</div>
            <div className="kpi-label">Bags available</div>
            <div className="kpi-sub">Sealed and ready to sign out</div>
          </div>
          <div className="kpi-card">
            <div className="kpi-value">{summary.signedOut}</div>
            <div className="kpi-label">Signed out</div>
            <div className="kpi-sub">Currently with crews</div>
          </div>
          <div className={'kpi-card ' + (summary.restock ? 'kpi-card-amber' : 'kpi-card-green')}>
            <div className="kpi-value">{summary.restock}</div>
            <div className="kpi-label">Need restock / check</div>
            <div className="kpi-sub">Used, or seal broken or changed</div>
          </div>
          <div className={'kpi-card ' + (summary.expired ? 'kpi-card-red' : summary.expiringSoon ? 'kpi-card-amber' : 'kpi-card-green')}>
            <div className="kpi-value">{summary.expired}</div>
            <div className="kpi-label">Bags with expired items</div>
            <div className="kpi-sub">{summary.expiringSoon} with items expiring in the next 30 days</div>
          </div>
        </div>
      )}

      <div className="card" style={{ padding: '12px 16px', marginBottom: 14, display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' }}>
        <div style={{ flex: '1 1 320px', fontSize: 14 }}>
          <strong>Crew QR sign out / sign in:</strong> crews scan a QR code (no login) to sign a bag out or back in themselves at{' '}
          <a href="/drug-bag" target="_blank" rel="noopener">{window.location.origin}/drug-bag</a>.
          Print a code for each bag — scanning it opens the form with that bag already chosen.
        </div>
        <a className="btn btn-primary btn-sm" href="/medication/qr" target="_blank" rel="noopener" style={{ textDecoration: 'none' }}>Print QR codes</a>
      </div>

      <div className="tabs">
        <button className={'tab-btn' + (tab === 'bags' ? ' active' : '')} onClick={() => setTab('bags')}>Drug bags</button>
        <button className={'tab-btn' + (tab === 'out' ? ' active' : '')} onClick={() => setTab('out')}>
          Signed out{out.length ? ` (${out.length})` : ''}
        </button>
        <button className={'tab-btn' + (tab === 'history' ? ' active' : '')} onClick={() => setTab('history')}>Sign-out history</button>
      </div>

      {tab === 'bags' && (
        <div className="card table-card">
          <div style={{ padding: '10px 16px', display: 'flex', justifyContent: 'flex-end' }}>
            <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13 }}>
              <input type="checkbox" checked={showArchived} onChange={(e) => setShowArchived(e.target.checked)} />
              Show archived bags
            </label>
          </div>
          {bags.length === 0 ? (
            <div className="empty">No drug bags yet. Use “+ Add bag” to add your bag numbers.</div>
          ) : (
            <div style={{ overflowX: 'auto' }}>
              <table className="table">
                <thead>
                  <tr>
                    <th>Bag number</th>
                    <th>Status</th>
                    <th>Seal</th>
                    <th>Earliest expiry</th>
                    <th>With</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  {bags.map((b) => (
                    <tr key={b.id} className="row-clickable" onClick={() => setEditing(b)} style={b.active ? undefined : { opacity: 0.55 }}>
                      <td>
                        <div className="ref-link">{b.bagNumber}</div>
                        <div className="muted" style={{ fontSize: 12 }}>{b.bagType || '—'}{!b.active ? ' · archived' : ''}</div>
                      </td>
                      <td><span className={'badge ' + (DRUG_BAG_STATUS_BADGE[b.status] || 'badge-grey')}>{b.statusLabel}</span></td>
                      <td>{sealBadge(b.sealColour, b.sealNumber)}</td>
                      <td>{bagExpiryCell(b)}</td>
                      <td>
                        {b.current ? (
                          <>
                            <div>{b.current.signedOutTo}{b.current.secondCrew ? ` & ${b.current.secondCrew}` : ''}</div>
                            <div className="muted" style={{ fontSize: 12 }}>
                              {[deploymentText(b.current), b.current.vehicleReg, b.current.callSign].filter(Boolean).join(' · ') || '—'} · out {hoursSince(b.current.signedOutAt)}
                            </div>
                          </>
                        ) : <span className="muted">—</span>}
                      </td>
                      <td onClick={(e) => e.stopPropagation()} style={{ whiteSpace: 'nowrap', textAlign: 'right' }}>
                        {b.active && b.status === 'AVAILABLE' && b.expiryStatus !== 'OVERDUE' && (
                          <button className="btn btn-primary btn-sm" onClick={() => setSigningOut({ bagId: b.id })}>Sign out</button>
                        )}
                        {b.current && <button className="btn btn-primary btn-sm" onClick={() => setReturning(b)}>Sign in</button>}
                        {b.active && !b.current && (b.status === 'RESTOCK' || (b.status === 'AVAILABLE' && b.expiryStatus === 'OVERDUE')) && (
                          <button className="btn btn-ghost btn-sm" onClick={() => setRestocking(b)}>Restock</button>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {tab === 'out' && (
        <div className="card table-card">
          {out.length === 0 ? (
            <div className="empty">No bags are signed out.</div>
          ) : (
            <table className="table">
              <thead>
                <tr><th>Bag</th><th>Signed out to</th><th>For</th><th>Vehicle / call sign</th><th>Seal out</th><th>Signed out</th><th></th></tr>
              </thead>
              <tbody>
                {out.map((b) => (
                  <tr key={b.id}>
                    <td><span className="ref-link">{b.bagNumber}</span></td>
                    <td>{b.current.signedOutTo}{b.current.secondCrew ? <div className="muted" style={{ fontSize: 12 }}>& {b.current.secondCrew}</div> : null}</td>
                    <td>{deploymentText(b.current) || '—'}</td>
                    <td>{[b.current.vehicleReg, b.current.callSign].filter(Boolean).join(' · ') || '—'}</td>
                    <td>{sealBadge(b.current.sealColourOut, b.current.sealOut)}</td>
                    <td>
                      {fmtDate(b.current.signedOutAt)} {fmtTime(b.current.signedOutAt)}
                      <div className="muted" style={{ fontSize: 12 }}>{hoursSince(b.current.signedOutAt)} ago · by {b.current.issuedByName || 'QR form'}</div>
                    </td>
                    <td style={{ textAlign: 'right' }}><button className="btn btn-primary btn-sm" onClick={() => setReturning(b)}>Sign in</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}

      {tab === 'history' && (
        <div className="card table-card">
          {movements.length === 0 ? (
            <div className="empty">No bags have been signed out yet.</div>
          ) : (
            <div style={{ overflowX: 'auto' }}>
              <table className="table">
                <thead>
                  <tr><th>Bag</th><th>Signed out</th><th>To</th><th>For</th><th>Vehicle</th><th>Seal out / in</th><th>Returned</th><th>Result</th></tr>
                </thead>
                <tbody>
                  {movements.map((mv) => (
                    <tr key={mv.id}>
                      <td><span className="ref-link">{mv.bagNumber}</span></td>
                      <td>{fmtDate(mv.signedOutAt)} {fmtTime(mv.signedOutAt)}<div className="muted" style={{ fontSize: 12 }}>by {mv.issuedByName || 'QR form'}</div></td>
                      <td>{mv.signedOutTo}{mv.secondCrew ? <div className="muted" style={{ fontSize: 12 }}>& {mv.secondCrew}</div> : null}</td>
                      <td>{deploymentText(mv) || '—'}</td>
                      <td>{[mv.vehicleReg, mv.callSign].filter(Boolean).join(' · ') || '—'}</td>
                      <td style={{ whiteSpace: 'nowrap' }}>{sealBadge(mv.sealColourOut, mv.sealOut)} / {mv.returnedAt ? sealBadge(mv.sealColourIn, mv.sealIn) : '—'}</td>
                      <td>
                        {mv.returnedAt ? (
                          <>{fmtDate(mv.returnedAt)} {fmtTime(mv.returnedAt)}<div className="muted" style={{ fontSize: 12 }}>by {mv.returnedBy} · received by {mv.receivedByName || 'QR form'}</div></>
                        ) : <span className="badge badge-blue">Still out</span>}
                      </td>
                      <td>
                        {!mv.returnedAt ? '—'
                          : mv.sealIntact === false ? <span className="badge badge-red">Seal broken / changed</span>
                          : mv.drugsUsed ? <span className="badge badge-amber">Items used</span>
                          : <span className="badge badge-green">Intact</span>}
                        {mv.returnNotes && <div className="muted" style={{ fontSize: 12, maxWidth: 260 }}>{mv.returnNotes}</div>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {signingOut && (
        <SignOutBagModal
          bags={bags.filter((b) => b.active)}
          vehicles={vehicles}
          initialBagId={signingOut.bagId}
          onClose={() => setSigningOut(null)}
          onSaved={(bag) => done(`Bag ${bag.bagNumber} signed out to ${bag.current?.signedOutTo || ''}.`)}
        />
      )}
      {returning && (
        <ReturnBagModal
          bag={returning}
          onClose={() => setReturning(null)}
          onSaved={(bag) => done(
            bag.sealMismatch
              ? `⚠ Bag ${bag.bagNumber} signed in, but the seal number doesn't match the one it went out with. It has been marked “Needs restock / check”.`
              : `Bag ${bag.bagNumber} signed in — ${bag.status === 'AVAILABLE' ? 'available again' : 'needs restock / check'}.`
          )}
        />
      )}
      {restocking && (
        <RestockBagModal bag={restocking} onClose={() => setRestocking(null)} onSaved={(bag) => done(`Bag ${bag.bagNumber} restocked and available.`)} />
      )}
      {editing && (
        <DrugBagModal
          bag={editing === 'new' ? null : editing}
          onClose={() => setEditing(null)}
          onSaved={(bag, isNew) => done(isNew ? `Drug bag ${bag.bagNumber} added.` : `Drug bag ${bag.bagNumber} updated.`)}
          onSignOut={(b) => { setEditing(null); setSigningOut({ bagId: b.id }); }}
          onReturn={(b) => { setEditing(null); setReturning(b); }}
          onRestock={(b) => { setEditing(null); setRestocking(b); }}
        />
      )}
    </div>
  );
}

// Sign a bag out. The bag number dropdown lists bags that can go out, and
// its last option adds a new bag number on the spot.
function SignOutBagModal({ bags, vehicles, initialBagId, onClose, onSaved }) {
  const available = bags.filter((b) => b.status === 'AVAILABLE' && !b.current && b.expiryStatus !== 'OVERDUE');
  const [bagId, setBagId] = useState(initialBagId ? String(initialBagId) : (available[0] ? String(available[0].id) : NEW_BAG));
  const [newBagNumber, setNewBagNumber] = useState('');
  const [newBagType, setNewBagType] = useState(DRUG_BAG_TYPES[0]);
  const [newExpiry, setNewExpiry] = useState('');
  const selected = bags.find((b) => String(b.id) === bagId) || null;
  const [sealColour, setSealColour] = useState(selected?.sealColour || '');
  const [deployment, setDeployment] = useState('');
  const [eventName, setEventName] = useState('');
  const [signedOutTo, setSignedOutTo] = useState('');
  const [secondCrew, setSecondCrew] = useState('');
  const [vehicleId, setVehicleId] = useState('');
  const [callSign, setCallSign] = useState('');
  const [notes, setNotes] = useState('');
  const [confirmed, setConfirmed] = useState(false);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  function chooseBag(value) {
    setBagId(value);
    const b = bags.find((x) => String(x.id) === value);
    setSealColour(b?.sealColour || '');
  }

  function chooseVehicle(value) {
    setVehicleId(value);
    const v = vehicles.find((x) => String(x.id) === value);
    if (v?.callSign && !callSign) setCallSign(v.callSign);
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    setBusy(true);
    try {
      let id = bagId;
      if (bagId === NEW_BAG) {
        const created = await api.createDrugBag({ bagNumber: newBagNumber, bagType: newBagType, sealColour, expiryDate: newExpiry || null });
        id = created.id;
      }
      if (!sealColour) throw new Error('Choose the seal colour (green or yellow).');
      if (!deployment) throw new Error('Choose Events or Frontline.');
      const bag = await api.signOutDrugBag(id, { signedOutTo, secondCrew, vehicleId: vehicleId || null, callSign, sealColour, deployment, eventName, notes });
      onSaved(bag);
    } catch (err) {
      setError(err.message || 'Failed to sign out bag');
    } finally {
      setBusy(false);
    }
  }

  const blocked = selected && (selected.status !== 'AVAILABLE' || selected.current);
  const expired = selected && selected.expiryStatus === 'OVERDUE';

  return (
    <div className="modal-backdrop" onMouseDown={onClose}>
      <form className="modal" onMouseDown={(e) => e.stopPropagation()} onSubmit={handleSubmit} style={{ maxWidth: 620 }}>
        <div className="modal-header">
          <h2>Sign out a drug bag</h2>
          <button type="button" className="modal-close" onClick={onClose}>✕</button>
        </div>
        {error && <div className="error-banner">{error}</div>}
        <div className="form-grid">
          <div className="form-field" style={{ gridColumn: '1 / -1' }}>
            <label>Drug bag number <span style={{ color: 'var(--red)' }}>*</span></label>
            <select value={bagId} onChange={(e) => chooseBag(e.target.value)} required>
              {available.length === 0 && bagId !== NEW_BAG && <option value="" disabled>No bags available</option>}
              {available.map((b) => (
                <option key={b.id} value={b.id}>
                  {b.bagNumber}{b.bagType ? ` — ${b.bagType}` : ''}{SEAL_COLOURS[b.sealColour] ? ` (${SEAL_COLOURS[b.sealColour].label.toLowerCase()} seal)` : ''}
                </option>
              ))}
              {selected && blocked && (
                <option value={selected.id}>{selected.bagNumber} — {selected.statusLabel}</option>
              )}
              <option value={NEW_BAG}>+ Add a new bag number…</option>
            </select>
            {selected && blocked && (
              <div className="muted" style={{ fontSize: 13, marginTop: 4, color: 'var(--red)' }}>
                This bag is “{selected.statusLabel}” and can't be signed out.
              </div>
            )}
            {expired && (
              <div className="muted" style={{ fontSize: 13, marginTop: 4, color: 'var(--red)' }}>
                This bag has expired items (earliest expiry {fmtDate(selected.expiryDate)}). Restock it first.
              </div>
            )}
            {selected && !blocked && selected.expiryStatus === 'DUE_SOON' && (
              <div className="muted" style={{ fontSize: 13, marginTop: 4 }}>Note: items expire on {fmtDate(selected.expiryDate)}.</div>
            )}
          </div>
          {bagId === NEW_BAG && (
            <>
              <div className="form-field">
                <label>New bag number <span style={{ color: 'var(--red)' }}>*</span></label>
                <input value={newBagNumber} onChange={(e) => setNewBagNumber(e.target.value)} placeholder="e.g. DB-014" required autoFocus />
              </div>
              <div className="form-field">
                <label>Bag type</label>
                <select value={newBagType} onChange={(e) => setNewBagType(e.target.value)}>
                  {DRUG_BAG_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>
              <div className="form-field">
                <label>Earliest expiry date in the bag</label>
                <input type="date" value={newExpiry} onChange={(e) => setNewExpiry(e.target.value)} />
              </div>
            </>
          )}
          <div className="form-field" style={{ gridColumn: '1 / -1' }}>
            <SealColourPicker value={sealColour} onChange={setSealColour} />
          </div>
          <DeploymentPicker value={deployment} onChange={setDeployment} eventName={eventName} onEventName={setEventName} />
          <div className="form-field">
            <label>Signed out to (crew member) <span style={{ color: 'var(--red)' }}>*</span></label>
            <input value={signedOutTo} onChange={(e) => setSignedOutTo(e.target.value)} placeholder="Full name" required />
          </div>
          <div className="form-field">
            <label>Second crew member</label>
            <input value={secondCrew} onChange={(e) => setSecondCrew(e.target.value)} placeholder="Full name" />
          </div>
          <div className="form-field">
            <label>Vehicle</label>
            <select value={vehicleId} onChange={(e) => chooseVehicle(e.target.value)}>
              <option value="">Not assigned to a vehicle</option>
              {vehicles.map((v) => <option key={v.id} value={v.id}>{v.reg}{v.callSign ? ` — ${v.callSign}` : ''}</option>)}
            </select>
          </div>
          <div className="form-field">
            <label>Call sign</label>
            <input value={callSign} onChange={(e) => setCallSign(e.target.value)} />
          </div>
          <div className="form-field" style={{ gridColumn: '1 / -1' }}>
            <label>Notes</label>
            <textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={2} />
          </div>
          <div className="form-field" style={{ gridColumn: '1 / -1' }}>
            <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontWeight: 400 }}>
              <input type="checkbox" checked={confirmed} onChange={(e) => setConfirmed(e.target.checked)} required />
              I've checked the seal is intact.
            </label>
          </div>
        </div>
        <div className="modal-footer">
          <div />
          <div className="modal-footer-right">
            <button type="button" className="btn btn-ghost" onClick={onClose} disabled={busy}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={busy || (selected && (blocked || expired))}>{busy ? 'Saving…' : 'Sign out bag'}</button>
          </div>
        </div>
      </form>
    </div>
  );
}

function ReturnBagModal({ bag, onClose, onSaved }) {
  const [returnedBy, setReturnedBy] = useState(bag.current?.signedOutTo || '');
  const [sealColour, setSealColour] = useState('');
  const [sealIntact, setSealIntact] = useState('');
  const [drugsUsed, setDrugsUsed] = useState('');
  const [notes, setNotes] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const mismatch = !!sealColour && !!bag.current?.sealColourOut && sealColour !== bag.current.sealColourOut;

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    setBusy(true);
    try {
      if (!sealColour) throw new Error('Choose the seal colour on the bag now (green or yellow).');
      const saved = await api.returnDrugBag(bag.id, {
        returnedBy, sealColour, sealIntact: sealIntact === 'YES', drugsUsed: drugsUsed === 'YES', notes,
      });
      onSaved(saved);
    } catch (err) {
      setError(err.message || 'Failed to sign bag in');
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="modal-backdrop" onMouseDown={onClose}>
      <form className="modal" onMouseDown={(e) => e.stopPropagation()} onSubmit={handleSubmit} style={{ maxWidth: 560 }}>
        <div className="modal-header">
          <h2>Sign in drug bag {bag.bagNumber}</h2>
          <button type="button" className="modal-close" onClick={onClose}>✕</button>
        </div>
        {error && <div className="error-banner">{error}</div>}
        <div className="muted" style={{ fontSize: 13, marginBottom: 10 }}>
          Signed out to {bag.current?.signedOutTo}{bag.current?.secondCrew ? ` & ${bag.current.secondCrew}` : ''} on {fmtDate(bag.current?.signedOutAt)} {fmtTime(bag.current?.signedOutAt)}{deploymentText(bag.current) ? ` for ${deploymentText(bag.current).toLowerCase()}` : ''}, seal: <strong>{sealBadge(bag.current?.sealColourOut, bag.current?.sealOut)}</strong>.
        </div>
        <div className="form-grid">
          <div className="form-field">
            <label>Returned by <span style={{ color: 'var(--red)' }}>*</span></label>
            <input value={returnedBy} onChange={(e) => setReturnedBy(e.target.value)} required />
          </div>
          <div className="form-field" style={{ gridColumn: '1 / -1' }}>
            <SealColourPicker value={sealColour} onChange={setSealColour} label="Seal colour now on the bag" />
            {mismatch && <div style={{ fontSize: 13, marginTop: 4, color: 'var(--red)' }}>Different from the seal it went out with ({SEAL_COLOURS[bag.current.sealColourOut].label.toLowerCase()}).</div>}
          </div>
          <div className="form-field">
            <label>Is the seal intact? <span style={{ color: 'var(--red)' }}>*</span></label>
            <select value={sealIntact} onChange={(e) => setSealIntact(e.target.value)} required>
              <option value="" disabled>Select</option>
              <option value="YES">Yes — intact</option>
              <option value="NO">No — broken or missing</option>
            </select>
          </div>
          <div className="form-field">
            <label>Were any drugs or items used? <span style={{ color: 'var(--red)' }}>*</span></label>
            <select value={drugsUsed} onChange={(e) => setDrugsUsed(e.target.value)} required>
              <option value="" disabled>Select</option>
              <option value="NO">No</option>
              <option value="YES">Yes</option>
            </select>
          </div>
          <div className="form-field" style={{ gridColumn: '1 / -1' }}>
            <label>Notes{drugsUsed === 'YES' ? <span style={{ color: 'var(--red)' }}> *</span> : ''}</label>
            <textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={3} required={drugsUsed === 'YES'}
              placeholder={drugsUsed === 'YES' ? 'What was used, and the incident / patient record reference' : ''} />
          </div>
        </div>
        {(sealIntact === 'NO' || drugsUsed === 'YES' || mismatch) && (
          <div className="warning-banner" style={{ marginTop: 8 }}>The bag will be marked “Needs restock / check” and can't be signed out again until it's restocked and resealed.</div>
        )}
        <div className="modal-footer">
          <div />
          <div className="modal-footer-right">
            <button type="button" className="btn btn-ghost" onClick={onClose} disabled={busy}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>{busy ? 'Saving…' : 'Sign bag in'}</button>
          </div>
        </div>
      </form>
    </div>
  );
}

function RestockBagModal({ bag, onClose, onSaved }) {
  const [sealColour, setSealColour] = useState('');
  const [expiryDate, setExpiryDate] = useState('');
  const [notes, setNotes] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    setBusy(true);
    try {
      if (!sealColour) throw new Error('Choose the new seal colour (green or yellow).');
      onSaved(await api.restockDrugBag(bag.id, { sealColour, expiryDate, notes }));
    } catch (err) {
      setError(err.message || 'Failed to restock bag');
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="modal-backdrop" onMouseDown={onClose}>
      <form className="modal" onMouseDown={(e) => e.stopPropagation()} onSubmit={handleSubmit} style={{ maxWidth: 520 }}>
        <div className="modal-header">
          <h2>Restock and reseal {bag.bagNumber}</h2>
          <button type="button" className="modal-close" onClick={onClose}>✕</button>
        </div>
        {error && <div className="error-banner">{error}</div>}
        <div className="form-grid">
          <div className="form-field" style={{ gridColumn: '1 / -1' }}>
            <SealColourPicker value={sealColour} onChange={setSealColour} label="New seal colour" />
          </div>
          <div className="form-field">
            <label>Earliest expiry date in the bag <span style={{ color: 'var(--red)' }}>*</span></label>
            <input type="date" value={expiryDate} onChange={(e) => setExpiryDate(e.target.value)} required />
          </div>
          <div className="form-field" style={{ gridColumn: '1 / -1' }}>
            <label>What was replaced</label>
            <textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={3} />
          </div>
        </div>
        <div className="modal-footer">
          <div />
          <div className="modal-footer-right">
            <button type="button" className="btn btn-ghost" onClick={onClose} disabled={busy}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>{busy ? 'Saving…' : 'Mark restocked'}</button>
          </div>
        </div>
      </form>
    </div>
  );
}

// Add a bag, or view / edit one with its full history.
function DrugBagModal({ bag, onClose, onSaved, onSignOut, onReturn, onRestock }) {
  const isNew = !bag;
  const [bagNumber, setBagNumber] = useState(bag?.bagNumber || '');
  const [bagType, setBagType] = useState(bag?.bagType || DRUG_BAG_TYPES[0]);
  const [sealColour, setSealColour] = useState(bag?.sealColour || '');
  const [expiryDate, setExpiryDate] = useState(bag?.expiryDate || '');
  const [status, setStatus] = useState(bag?.status || 'AVAILABLE');
  const [notes, setNotes] = useState(bag?.notes || '');
  const [history, setHistory] = useState(null);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    if (bag) api.getDrugBagHistory(bag.id).then(setHistory).catch(() => setHistory({ movements: [], events: [] }));
  }, [bag]);

  async function save(extra = {}) {
    setError('');
    setBusy(true);
    try {
      const data = { bagNumber, bagType, sealColour: sealColour || null, expiryDate: expiryDate || null, notes, status, ...extra };
      const saved = isNew ? await api.createDrugBag(data) : await api.updateDrugBag(bag.id, data);
      onSaved(saved, isNew);
    } catch (err) {
      setError(err.message || 'Failed to save bag');
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="modal-backdrop" onMouseDown={onClose}>
      <form className="modal" onMouseDown={(e) => e.stopPropagation()} onSubmit={(e) => { e.preventDefault(); save(); }} style={{ maxWidth: 720 }}>
        <div className="modal-header">
          <h2>{isNew ? 'Add a drug bag' : `Drug bag ${bag.bagNumber}`}</h2>
          <button type="button" className="modal-close" onClick={onClose}>✕</button>
        </div>
        {error && <div className="error-banner">{error}</div>}
        {!isNew && (
          <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 12, flexWrap: 'wrap' }}>
            <span className={'badge ' + (DRUG_BAG_STATUS_BADGE[bag.status] || 'badge-grey')}>{bag.statusLabel}</span>
            {bag.current && <span className="muted" style={{ fontSize: 13 }}>With {bag.current.signedOutTo} since {fmtDate(bag.current.signedOutAt)} {fmtTime(bag.current.signedOutAt)}</span>}
            <div style={{ marginLeft: 'auto', display: 'flex', gap: 8 }}>
              {bag.active && bag.status === 'AVAILABLE' && bag.expiryStatus !== 'OVERDUE' && <button type="button" className="btn btn-primary btn-sm" onClick={() => onSignOut(bag)}>Sign out</button>}
              {bag.current && <button type="button" className="btn btn-primary btn-sm" onClick={() => onReturn(bag)}>Sign in</button>}
              {bag.active && !bag.current && (bag.status === 'RESTOCK' || (bag.status === 'AVAILABLE' && bag.expiryStatus === 'OVERDUE')) && <button type="button" className="btn btn-ghost btn-sm" onClick={() => onRestock(bag)}>Restock</button>}
            </div>
          </div>
        )}
        <div className="form-grid">
          <div className="form-field">
            <label>Bag number <span style={{ color: 'var(--red)' }}>*</span></label>
            <input value={bagNumber} onChange={(e) => setBagNumber(e.target.value)} placeholder="e.g. DB-014" required autoFocus={isNew} />
          </div>
          <div className="form-field">
            <label>Bag type</label>
            <select value={DRUG_BAG_TYPES.includes(bagType) ? bagType : 'Other'} onChange={(e) => setBagType(e.target.value)}>
              {DRUG_BAG_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <div className="form-field">
            <label>Current seal colour</label>
            <select value={sealColour} onChange={(e) => setSealColour(e.target.value)}>
              <option value="">Not recorded</option>
              {Object.entries(SEAL_COLOURS).map(([k, c]) => <option key={k} value={k}>{c.label}</option>)}
            </select>
          </div>
          <div className="form-field">
            <label>Earliest expiry date in the bag</label>
            <input type="date" value={expiryDate} onChange={(e) => setExpiryDate(e.target.value)} />
          </div>
          {!isNew && !bag.current && (
            <div className="form-field">
              <label>Status</label>
              <select value={status} onChange={(e) => setStatus(e.target.value)}>
                <option value="AVAILABLE">Available</option>
                <option value="RESTOCK">Needs restock / check</option>
                <option value="OUT_OF_SERVICE">Out of service</option>
              </select>
            </div>
          )}
          <div className="form-field" style={{ gridColumn: '1 / -1' }}>
            <label>Notes</label>
            <textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={2} />
          </div>
        </div>

        {!isNew && (
          <>
            <div className="settings-section-title settings-section-spaced">History</div>
            {!history ? <div className="muted">Loading…</div> : history.events.length === 0 ? (
              <div className="muted">No history yet.</div>
            ) : (
              <div className="kpi-list" style={{ maxHeight: 260, overflowY: 'auto' }}>
                {history.events.map((e) => (
                  <div key={e.id} className="kpi-list-row" style={{ alignItems: 'flex-start' }}>
                    <div>
                      <div style={{ fontWeight: 600, fontSize: 13 }}>{e.action.replace(/_/g, ' ')}</div>
                      <div style={{ fontSize: 13 }}>{e.details}</div>
                    </div>
                    <div className="muted" style={{ fontSize: 12, whiteSpace: 'nowrap' }}>{fmtDate(e.createdAt)} {fmtTime(e.createdAt)}</div>
                  </div>
                ))}
              </div>
            )}
          </>
        )}

        <div className="modal-footer">
          <div>
            {!isNew && bag.active && !bag.current && (
              <button type="button" className="btn btn-ghost" disabled={busy}
                onClick={() => { if (confirm(`Archive drug bag ${bag.bagNumber}? It will be hidden from the list and can't be signed out. Its history is kept.`)) save({ active: false }); }}>
                Archive
              </button>
            )}
            {!isNew && !bag.active && (
              <button type="button" className="btn btn-ghost" disabled={busy} onClick={() => save({ active: true })}>Restore</button>
            )}
          </div>
          <div className="modal-footer-right">
            <button type="button" className="btn btn-ghost" onClick={onClose} disabled={busy}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>{busy ? 'Saving…' : isNew ? 'Add bag' : 'Save changes'}</button>
          </div>
        </div>
      </form>
    </div>
  );
}

// =====================================================================
// Medication store: stock levels, batches with expiry dates, minimums.
// =====================================================================

const MED_FORMS = ['Tablet', 'Capsule', 'Ampoule', 'Vial', 'Pre-filled syringe', 'Nebule', 'Inhaler', 'Oral solution', 'Suppository', 'Gel', 'Spray', 'Infusion bag', 'Other'];
const MED_ISSUE_REASONS = ['Drug bag restock', 'Used on patient', 'Transferred to another site', 'Other'];
const MED_DISPOSE_REASONS = ['Expired', 'Damaged', 'Contaminated / opened', 'Recalled', 'Other'];

// Short dd/mm/yyyy dates keep the stock tables compact.
function fmtShort(d) {
  if (!d) return '';
  const x = new Date(d);
  return isNaN(x.getTime()) ? '' : x.toLocaleDateString('en-GB');
}

function medLabel(i) {
  return [i.name, i.strength, i.form].filter(Boolean).join(' ');
}

function expiryBadge(date, status) {
  if (!date) return <span className="muted">—</span>;
  const cls = status === 'OVERDUE' ? 'badge-red' : status === 'DUE_SOON' ? 'badge-amber' : null;
  return cls
    ? <span className={'badge ' + cls} style={{ whiteSpace: 'nowrap' }}>{fmtShort(date)}{status === 'OVERDUE' ? ' — expired' : ''}</span>
    : <span style={{ whiteSpace: 'nowrap' }}>{fmtShort(date)}</span>;
}

function stockBadge(i) {
  if (i.stockStatus === 'OUT') return <span className="badge badge-red">Out of stock</span>;
  if (i.stockStatus === 'LOW') return <span className="badge badge-amber">Below minimum</span>;
  return <span className="badge badge-green">OK</span>;
}

function MedicationStore() {
  const [tab, setTab] = useState('stock');
  const [summary, setSummary] = useState(null);
  const [items, setItems] = useState([]);
  const [movements, setMovements] = useState([]);
  const [bags, setBags] = useState([]);
  const [q, setQ] = useState('');
  const [onlyAttention, setOnlyAttention] = useState(false);
  const [showArchived, setShowArchived] = useState(false);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [notice, setNotice] = useState('');
  const [editing, setEditing] = useState(null); // item | 'new'
  const [viewing, setViewing] = useState(null);
  const [receiving, setReceiving] = useState(null);
  const [issuing, setIssuing] = useState(null);

  function loadAll() {
    setError('');
    return Promise.all([
      api.getMedStoreSummary().then(setSummary),
      api.listMedItems(showArchived).then((rows) => {
        setItems(rows);
        setViewing((v) => (v ? rows.find((r) => r.id === v.id) || null : v));
      }),
      api.listMedMovements().then(setMovements),
      api.listDrugBags(false).then(setBags).catch(() => {}),
    ])
      .catch((err) => setError(err.message || 'Failed to load the medication store'))
      .finally(() => setLoading(false));
  }

  useEffect(() => {
    loadAll();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [showArchived]);

  function done(message, keepViewing) {
    setEditing(null); setReceiving(null); setIssuing(null);
    if (!keepViewing) setViewing(null);
    if (message) setNotice(message);
    loadAll();
  }

  if (loading) return <div className="page-loading">Loading…</div>;

  const needle = q.trim().toLowerCase();
  const shown = items.filter((i) => {
    if (needle && !medLabel(i).toLowerCase().includes(needle) && !(i.location || '').toLowerCase().includes(needle)) return false;
    if (onlyAttention && i.stockStatus === 'OK' && !['OVERDUE', 'DUE_SOON'].includes(i.expiryStatus)) return false;
    return true;
  });

  return (
    <div>
      <div className="page-header">
        <div>
          <h1>Medication Store</h1>
          <div className="page-sub">Stock held, expiry dates by batch, and minimum stock levels</div>
        </div>
        <div className="page-header-actions">
          <button className="btn btn-primary" onClick={() => setEditing('new')}>+ Add medicine</button>
        </div>
      </div>

      {error && <div className="error-banner" style={{ marginBottom: 12 }}>{error}</div>}
      {notice && (
        <div className="success-banner" style={{ marginBottom: 12, display: 'flex', justifyContent: 'space-between', gap: 12 }}>
          <span>{notice}</span>
          <button type="button" className="btn btn-ghost btn-sm" onClick={() => setNotice('')}>Dismiss</button>
        </div>
      )}

      {summary && (
        <div className="kpi-grid">
          <div className="kpi-card">
            <div className="kpi-value">{summary.items}</div>
            <div className="kpi-label">Medicines stocked</div>
            <div className="kpi-sub">Lines in the store</div>
          </div>
          <div className={'kpi-card ' + (summary.lowStock || summary.outOfStock ? 'kpi-card-amber' : 'kpi-card-green')}>
            <div className="kpi-value">{summary.lowStock + summary.outOfStock}</div>
            <div className="kpi-label">Below minimum</div>
            <div className="kpi-sub">{summary.outOfStock} out of stock</div>
          </div>
          <div className={'kpi-card ' + (summary.expiredBatches ? 'kpi-card-red' : 'kpi-card-green')}>
            <div className="kpi-value">{summary.expiredBatches}</div>
            <div className="kpi-label">Expired batches</div>
            <div className="kpi-sub">Remove and dispose of</div>
          </div>
          <div className={'kpi-card ' + (summary.expiringSoonBatches ? 'kpi-card-amber' : 'kpi-card-green')}>
            <div className="kpi-value">{summary.expiringSoonBatches}</div>
            <div className="kpi-label">Expiring in 30 days</div>
            <div className="kpi-sub">Use these first</div>
          </div>
        </div>
      )}

      <div className="tabs">
        <button className={'tab-btn' + (tab === 'stock' ? ' active' : '')} onClick={() => setTab('stock')}>Stock</button>
        <button className={'tab-btn' + (tab === 'history' ? ' active' : '')} onClick={() => setTab('history')}>Stock movements</button>
      </div>

      {tab === 'stock' && (
        <div className="card table-card">
          <div style={{ padding: '10px 16px', display: 'flex', gap: 14, alignItems: 'center', flexWrap: 'wrap' }}>
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search medicine or location…" style={{ maxWidth: 280 }} />
            <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13 }}>
              <input type="checkbox" checked={onlyAttention} onChange={(e) => setOnlyAttention(e.target.checked)} />
              Needs attention only (low stock or expiring)
            </label>
            <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13, marginLeft: 'auto' }}>
              <input type="checkbox" checked={showArchived} onChange={(e) => setShowArchived(e.target.checked)} />
              Show archived
            </label>
          </div>
          {shown.length === 0 ? (
            <div className="empty">{items.length ? 'No medicines match.' : 'No medicines yet. Use “+ Add medicine” to start your stock list.'}</div>
          ) : (
            <div style={{ overflowX: 'auto' }}>
              <table className="table">
                <thead>
                  <tr><th>Medicine</th><th>In stock</th><th>Min qty</th><th>Earliest expiry</th><th>Status</th><th></th></tr>
                </thead>
                <tbody>
                  {shown.map((i) => (
                    <tr key={i.id} className="row-clickable" onClick={() => setViewing(i)} style={i.active ? undefined : { opacity: 0.55 }}>
                      <td>
                        <div className="ref-link">{i.name}{i.strength ? ` ${i.strength}` : ''}</div>
                        <div className="muted" style={{ fontSize: 12 }}>{[i.form, i.location].filter(Boolean).join(' · ') || '—'}{!i.active ? ' · archived' : ''}</div>
                      </td>
                      <td>
                        <strong>{i.usableQty}</strong> {i.unit}
                        {i.expiredQty > 0 && <div style={{ fontSize: 12, color: 'var(--red)' }}>+ {i.expiredQty} expired</div>}
                        {i.batches.length > 1 && <div className="muted" style={{ fontSize: 12 }}>{i.batches.length} batches</div>}
                      </td>
                      <td>{i.minQty}</td>
                      <td>{expiryBadge(i.earliestExpiry, i.expiryStatus)}</td>
                      <td>{stockBadge(i)}</td>
                      <td onClick={(e) => e.stopPropagation()} style={{ whiteSpace: 'nowrap', textAlign: 'right' }}>
                        {i.active && <button className="btn btn-ghost btn-sm" onClick={() => setReceiving(i)}>Receive</button>}{' '}
                        {i.active && <button className="btn btn-primary btn-sm" onClick={() => setIssuing(i)} disabled={!i.usableQty}>Issue</button>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {tab === 'history' && <MedMovementsTable movements={movements} showItem />}

      {editing && (
        <MedItemModal item={editing === 'new' ? null : editing} onClose={() => setEditing(null)}
          onSaved={(it, isNew) => done(isNew ? `${medLabel(it)} added to the store.` : `${medLabel(it)} updated.`)} />
      )}
      {viewing && !editing && !receiving && !issuing && (
        <MedItemDetailModal item={viewing} onClose={() => setViewing(null)}
          onEdit={() => setEditing(viewing)} onReceive={() => setReceiving(viewing)} onIssue={() => setIssuing(viewing)}
          onChanged={(msg) => done(msg, true)} />
      )}
      {receiving && (
        <ReceiveMedModal item={receiving} onClose={() => setReceiving(null)}
          onSaved={(it, qty) => done(`Received ${qty} ${it.unit} of ${medLabel(it)}. Now ${it.usableQty} in stock.`, true)} />
      )}
      {issuing && (
        <IssueMedModal item={issuing} bags={bags} onClose={() => setIssuing(null)}
          onSaved={(it, qty) => done(`Issued ${qty} ${it.unit} of ${medLabel(it)}. ${it.usableQty} left${it.stockStatus !== 'OK' ? ' — below minimum' : ''}.`, true)} />
      )}
    </div>
  );
}

function MedMovementsTable({ movements, showItem }) {
  if (!movements.length) return <div className="card"><div className="empty">No stock movements yet.</div></div>;
  return (
    <div className="card table-card">
      <div style={{ overflowX: 'auto' }}>
        <table className="table">
          <thead>
            <tr><th>Date</th>{showItem && <th>Medicine</th>}<th>Movement</th><th>Qty</th><th>Batch / expiry</th><th>Balance</th><th>Reason / reference</th><th>By</th></tr>
          </thead>
          <tbody>
            {movements.map((m) => (
              <tr key={m.id}>
                <td style={{ whiteSpace: 'nowrap' }}>{fmtShort(m.createdAt)} {fmtTime(m.createdAt)}</td>
                {showItem && <td>{m.itemName}{m.itemStrength ? ` ${m.itemStrength}` : ''}</td>}
                <td>{m.typeLabel}</td>
                <td style={{ fontWeight: 600, color: m.quantity < 0 ? 'var(--red)' : 'var(--green, #15803d)' }}>{m.quantity > 0 ? '+' : ''}{m.quantity}</td>
                <td>{m.batchNumber || '—'}{m.expiryDate ? <div className="muted" style={{ fontSize: 12, whiteSpace: 'nowrap' }}>exp {fmtShort(m.expiryDate)}</div> : null}</td>
                <td>{m.balanceAfter} {m.unit}</td>
                <td>{m.reason || '—'}{m.reference ? <div className="muted" style={{ fontSize: 12 }}>{m.reference}</div> : null}</td>
                <td>{m.actorName || '—'}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function MedItemModal({ item, onClose, onSaved }) {
  const isNew = !item;
  const [name, setName] = useState(item?.name || '');
  const [strength, setStrength] = useState(item?.strength || '');
  const [form, setForm] = useState(item?.form || '');
  const [unit, setUnit] = useState(item?.unit || 'units');
  const [minQty, setMinQty] = useState(item ? String(item.minQty) : '0');
  const [location, setLocation] = useState(item?.location || '');
  const [notes, setNotes] = useState(item?.notes || '');
  const [initialQty, setInitialQty] = useState('');
  const [initialExpiry, setInitialExpiry] = useState('');
  const [initialBatch, setInitialBatch] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  async function save(extra = {}) {
    setError('');
    setBusy(true);
    try {
      const data = { name, strength, form, unit, minQty, location, notes, ...extra };
      const saved = isNew
        ? await api.createMedItem({ ...data, initialQty, initialExpiry: initialExpiry || null, initialBatch })
        : await api.updateMedItem(item.id, data);
      onSaved(saved, isNew);
    } catch (err) {
      setError(err.message || 'Failed to save');
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="modal-backdrop" onMouseDown={onClose}>
      <form className="modal" onMouseDown={(e) => e.stopPropagation()} onSubmit={(e) => { e.preventDefault(); save(); }} style={{ maxWidth: 620 }}>
        <div className="modal-header">
          <h2>{isNew ? 'Add a medicine' : `Edit ${medLabel(item)}`}</h2>
          <button type="button" className="modal-close" onClick={onClose}>✕</button>
        </div>
        {error && <div className="error-banner">{error}</div>}
        <div className="form-grid">
          <div className="form-field">
            <label>Medicine name <span style={{ color: 'var(--red)' }}>*</span></label>
            <input value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Paracetamol" required autoFocus />
          </div>
          <div className="form-field">
            <label>Strength</label>
            <input value={strength} onChange={(e) => setStrength(e.target.value)} placeholder="e.g. 500mg, 1mg/10ml" />
          </div>
          <div className="form-field">
            <label>Form</label>
            <select value={form} onChange={(e) => setForm(e.target.value)}>
              <option value="">—</option>
              {MED_FORMS.map((f) => <option key={f} value={f}>{f}</option>)}
            </select>
          </div>
          <div className="form-field">
            <label>Counted in</label>
            <input value={unit} onChange={(e) => setUnit(e.target.value)} placeholder="e.g. tablets, ampoules, packs" />
          </div>
          <div className="form-field">
            <label>Minimum quantity <span style={{ color: 'var(--red)' }}>*</span></label>
            <input type="number" min="0" value={minQty} onChange={(e) => setMinQty(e.target.value)} required />
          </div>
          <div className="form-field">
            <label>Location</label>
            <input value={location} onChange={(e) => setLocation(e.target.value)} placeholder="e.g. Luton Base, cabinet 2" />
          </div>
          {isNew && (
            <>
              <div className="form-field" style={{ gridColumn: '1 / -1' }}>
                <div className="settings-section-title" style={{ marginTop: 6 }}>Opening stock (optional)</div>
              </div>
              <div className="form-field">
                <label>Quantity in stock now</label>
                <input type="number" min="0" value={initialQty} onChange={(e) => setInitialQty(e.target.value)} />
              </div>
              <div className="form-field">
                <label>Expiry date{Number(initialQty) > 0 ? <span style={{ color: 'var(--red)' }}> *</span> : ''}</label>
                <input type="date" value={initialExpiry} onChange={(e) => setInitialExpiry(e.target.value)} required={Number(initialQty) > 0} />
              </div>
              <div className="form-field">
                <label>Batch number</label>
                <input value={initialBatch} onChange={(e) => setInitialBatch(e.target.value)} />
              </div>
            </>
          )}
          <div className="form-field" style={{ gridColumn: '1 / -1' }}>
            <label>Notes</label>
            <textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={2} />
          </div>
        </div>
        <div className="modal-footer">
          <div>
            {!isNew && item.active && (
              <button type="button" className="btn btn-ghost" disabled={busy}
                onClick={() => { if (confirm(`Archive ${medLabel(item)}? It will be hidden from the stock list. Its history is kept.`)) save({ active: false }); }}>Archive</button>
            )}
            {!isNew && !item.active && <button type="button" className="btn btn-ghost" disabled={busy} onClick={() => save({ active: true })}>Restore</button>}
          </div>
          <div className="modal-footer-right">
            <button type="button" className="btn btn-ghost" onClick={onClose} disabled={busy}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>{busy ? 'Saving…' : isNew ? 'Add medicine' : 'Save changes'}</button>
          </div>
        </div>
      </form>
    </div>
  );
}

function MedItemDetailModal({ item, onClose, onEdit, onReceive, onIssue, onChanged }) {
  const [movements, setMovements] = useState(null);
  const [batchAction, setBatchAction] = useState(null); // { batch, op: 'dispose' | 'count' }

  useEffect(() => {
    api.listMedItemMovements(item.id).then(setMovements).catch(() => setMovements([]));
  }, [item]);

  return (
    <div className="modal-backdrop" onMouseDown={onClose}>
      <div className="modal" onMouseDown={(e) => e.stopPropagation()} style={{ maxWidth: 'none', width: 'min(1000px, 95vw)' }}>
        <div className="modal-header">
          <h2>{medLabel(item)}</h2>
          <button type="button" className="modal-close" onClick={onClose}>✕</button>

        <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap', marginBottom: 12 }}>
          {stockBadge(item)}
          <span><strong>{item.usableQty}</strong> {item.unit} in date · minimum {item.minQty}</span>
          {item.expiredQty > 0 && <span style={{ color: 'var(--red)' }}>{item.expiredQty} expired — dispose of</span>}
          {item.location && <span className="muted">· {item.location}</span>}
          <div style={{ marginLeft: 'auto', display: 'flex', gap: 8 }}>

            <tbody>
              {item.batches.map((b) => (
                <tr key={b.id}>
                  <td>{b.batchNumber || <span className="muted">—</span>}</td>
                  <td>{expiryBadge(b.expiryDate, b.expiryStatus)}</td>
                  <td>{b.quantity} {item.unit}</td>
                  <td style={{ whiteSpace: 'nowrap' }}>{fmtShort(b.receivedAt)}</td>
                  <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>

                    <button className={'btn btn-sm ' + (b.expiryStatus === 'OVERDUE' ? 'btn-danger' : 'btn-ghost')} onClick={() => setBatchAction({ batch: b, op: 'dispose' })}>Dispose</button>

        <div className="settings-section-title">Movements</div>

        )}

        {batchAction && (
          <MedBatchActionModal item={item} batch={batchAction.batch} op={batchAction.op}
            onClose={() => setBatchAction(null)}

      </div>
    </div>
  );
}

function ReceiveMedModal({ item, onClose, onSaved }) {
  const [quantity, setQuantity] = useState('');
  const [expiryDate, setExpiryDate] = useState('');
  const [batchNumber, setBatchNumber] = useState('');
  const [reference, setReference] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    setBusy(true);
    try {
      onSaved(await api.receiveMedStock(item.id, { quantity, expiryDate, batchNumber, reference }), quantity);
    } catch (err) {
      setError(err.message || 'Failed to receive stock');
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="modal-backdrop" onMouseDown={onClose}>
      <form className="modal" onMouseDown={(e) => e.stopPropagation()} onSubmit={handleSubmit} style={{ maxWidth: 520 }}>
        <div className="modal-header">
          <h2>Receive stock — {medLabel(item)}</h2>
          <button type="button" className="modal-close" onClick={onClose}>✕</button>
        </div>
        {error && <div className="error-banner">{error}</div>}
        <div className="form-grid">
          <div className="form-field">
            <label>Quantity received ({item.unit}) <span style={{ color: 'var(--red)' }}>*</span></label>
            <input type="number" min="1" value={quantity} onChange={(e) => setQuantity(e.target.value)} required autoFocus />
          </div>
          <div className="form-field">
            <label>Expiry date <span style={{ color: 'var(--red)' }}>*</span></label>
            <input type="date" value={expiryDate} onChange={(e) => setExpiryDate(e.target.value)} required />
          </div>
          <div className="form-field">
            <label>Batch number</label>
            <input value={batchNumber} onChange={(e) => setBatchNumber(e.target.value)} />
          </div>
          <div className="form-field">
            <label>Supplier / order reference</label>
            <input value={reference} onChange={(e) => setReference(e.target.value)} />
          </div>
        </div>
        <div className="modal-footer">
          <div />
          <div className="modal-footer-right">
            <button type="button" className="btn btn-ghost" onClick={onClose} disabled={busy}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>{busy ? 'Saving…' : 'Receive stock'}</button>
          </div>
        </div>
      </form>
    </div>
  );
}

function IssueMedModal({ item, bags, onClose, onSaved }) {
  const [quantity, setQuantity] = useState('');
  const [reason, setReason] = useState(MED_ISSUE_REASONS[0]);
  const [bagNumber, setBagNumber] = useState('');
  const [reference, setReference] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const after = item.usableQty - (Number(quantity) || 0);

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    setBusy(true);
    try {
      const ref = [reason === 'Drug bag restock' && bagNumber ? `Drug bag ${bagNumber}` : null, reference].filter(Boolean).join(' — ');
      onSaved(await api.issueMedStock(item.id, { quantity, reason, reference: ref }), quantity);
    } catch (err) {
      setError(err.message || 'Failed to issue stock');
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="modal-backdrop" onMouseDown={onClose}>
      <form className="modal" onMouseDown={(e) => e.stopPropagation()} onSubmit={handleSubmit} style={{ maxWidth: 540 }}>
        <div className="modal-header">
          <h2>Issue stock — {medLabel(item)}</h2>
          <button type="button" className="modal-close" onClick={onClose}>✕</button>
        </div>
        {error && <div className="error-banner">{error}</div>}
        <div className="muted" style={{ fontSize: 13, marginBottom: 8 }}>
          {item.usableQty} {item.unit} in date. Stock is taken from the batch with the earliest expiry first; expired stock is never issued.
        </div>
        <div className="form-grid">
          <div className="form-field">
            <label>Quantity ({item.unit}) <span style={{ color: 'var(--red)' }}>*</span></label>
            <input type="number" min="1" max={item.usableQty} value={quantity} onChange={(e) => setQuantity(e.target.value)} required autoFocus />
          </div>
          <div className="form-field">
            <label>For <span style={{ color: 'var(--red)' }}>*</span></label>
            <select value={reason} onChange={(e) => setReason(e.target.value)}>
              {MED_ISSUE_REASONS.map((r) => <option key={r} value={r}>{r}</option>)}
            </select>
          </div>
          {reason === 'Drug bag restock' && (
            <div className="form-field">
              <label>Drug bag</label>
              <select value={bagNumber} onChange={(e) => setBagNumber(e.target.value)}>
                <option value="">—</option>
                {bags.map((b) => <option key={b.id} value={b.bagNumber}>{b.bagNumber}</option>)}
              </select>
            </div>
          )}
          <div className="form-field">
            <label>{reason === 'Used on patient' ? 'Incident / patient record reference' : 'Reference / notes'}</label>
            <input value={reference} onChange={(e) => setReference(e.target.value)} />
          </div>
        </div>
        {quantity && after >= 0 && after < item.minQty && (
          <div className="warning-banner" style={{ marginTop: 8 }}>This leaves {after} {item.unit} — below the minimum of {item.minQty}. Reorder soon.</div>
        )}
        <div className="modal-footer">
          <div />
          <div className="modal-footer-right">
            <button type="button" className="btn btn-ghost" onClick={onClose} disabled={busy}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>{busy ? 'Saving…' : 'Issue stock'}</button>
          </div>
        </div>
      </form>
    </div>
  );
}

function MedBatchActionModal({ item, batch, op, onClose, onSaved }) {
  const [quantity, setQuantity] = useState(op === 'dispose' ? String(batch.quantity) : '');
  const [reason, setReason] = useState(op === 'dispose' ? (batch.expiryStatus === 'OVERDUE' ? 'Expired' : MED_DISPOSE_REASONS[0]) : '');
  const [reference, setReference] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    setBusy(true);
    try {
      if (op === 'dispose') {
        await api.disposeMedBatch(batch.id, { quantity, reason, reference });
        onSaved(`Disposed of ${quantity} ${item.unit} of ${medLabel(item)}.`);
      } else {
        await api.countMedBatch(batch.id, { countedQty: quantity, reason });
        onSaved(`Stock count recorded for ${medLabel(item)}.`);
      }
    } catch (err) {
      setError(err.message || 'Failed to save');
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="modal-backdrop" onMouseDown={onClose} style={{ zIndex: 1100 }}>
      <form className="modal" onMouseDown={(e) => e.stopPropagation()} onSubmit={handleSubmit} style={{ maxWidth: 500 }}>
        <div className="modal-header">
          <h2>{op === 'dispose' ? 'Dispose of stock' : 'Stock count'} — {medLabel(item)}</h2>
          <button type="button" className="modal-close" onClick={onClose}>✕</button>
        </div>
        {error && <div className="error-banner">{error}</div>}
        <div className="muted" style={{ fontSize: 13, marginBottom: 8 }}>
          Batch {batch.batchNumber || '(no number)'}, expiry {fmtShort(batch.expiryDate)} — system shows {batch.quantity} {item.unit}.
        </div>
        <div className="form-grid">
          <div className="form-field">
            <label>{op === 'dispose' ? `Quantity to dispose of (${item.unit})` : `Quantity counted (${item.unit})`} <span style={{ color: 'var(--red)' }}>*</span></label>
            <input type="number" min={op === 'dispose' ? 1 : 0} max={op === 'dispose' ? batch.quantity : undefined} value={quantity} onChange={(e) => setQuantity(e.target.value)} required autoFocus />
          </div>
          {op === 'dispose' ? (
            <div className="form-field">
              <label>Reason <span style={{ color: 'var(--red)' }}>*</span></label>
              <select value={reason} onChange={(e) => setReason(e.target.value)}>
                {MED_DISPOSE_REASONS.map((r) => <option key={r} value={r}>{r}</option>)}
              </select>
            </div>
          ) : (
            <div className="form-field">
              <label>Reason for the difference <span style={{ color: 'var(--red)' }}>*</span></label>
              <input value={reason} onChange={(e) => setReason(e.target.value)} required />
            </div>
          )}
          {op === 'dispose' && (
            <div className="form-field" style={{ gridColumn: '1 / -1' }}>
              <label>Disposal reference / witness</label>
              <input value={reference} onChange={(e) => setReference(e.target.value)} placeholder="e.g. pharmaceutical waste bin, witnessed by…" />
            </div>
          )}
        </div>
        <div className="modal-footer">
          <div />
          <div className="modal-footer-right">
            <button type="button" className="btn btn-ghost" onClick={onClose} disabled={busy}>Cancel</button>
            <button type="submit" className={'btn ' + (op === 'dispose' ? 'btn-danger' : 'btn-primary')} disabled={busy}>{busy ? 'Saving…' : op === 'dispose' ? 'Dispose' : 'Record count'}</button>
          </div>
        </div>
      </form>
    </div>
  );
}

function MedActionList({ rows, empty, render }) {

  return (
    <div className="kpi-list" style={{ maxHeight: 260, overflowY: 'auto' }}>
      {rows.map((r, i) => <div key={i} className="kpi-list-row">{render(r)}</div>)}
    </div>
  );
}
