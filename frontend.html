<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DYNAMO — Incident Reporting</title>
    <style>
:root {
  --navy: #0b1f3a;
  --navy-dark: #081627;
  --blue: #2563eb;
  --blue-dark: #1d4ed8;
  --green: #16a34a;
  --red: #dc2626;
  --grey: #6b7280;
  --border: #e5e7eb;
  --bg: #f3f4f6;
  --text: #111827;
  --text-muted: #6b7280;
}

* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.app-shell { display: flex; min-height: 100vh; }

.sidebar {
  width: 220px;
  background: var(--navy);
  color: #cbd5e1;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.brand { padding: 20px 18px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.brand-logo { display: flex; align-items: center; gap: 10px; }
.brand-name { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
.brand-sub { font-size: 9px; color: #93c5fd; letter-spacing: 1px; margin-top: 2px; }

.brand-icon {
  width: 32px; height: 32px; border-radius: 9px; position: relative; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.brand-icon-letter { font-size: 17px; font-weight: 800; line-height: 1; }
.brand-icon-dot {
  position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--blue);
}
.brand-icon-dark { background: #fff; }
.brand-icon-dark .brand-icon-letter { color: var(--navy); }
.brand-icon-dark .brand-icon-dot { border: 2px solid var(--navy); }
.brand-icon-light { background: var(--navy); }
.brand-icon-light .brand-icon-letter { color: #fff; }
.brand-icon-light .brand-icon-dot { border: 2px solid #fff; }

.nav { flex: 1; padding: 12px 0; }
.nav-group { margin-bottom: 18px; }
.nav-section { font-size: 11px; font-weight: 700; color: #64748b; padding: 6px 18px; letter-spacing: 0.5px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 18px; color: #cbd5e1; text-decoration: none; font-size: 14px;
}
.nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
.nav-item.active { background: var(--blue); color: #fff; }
.nav-icon { font-size: 15px; }
.sidebar-footer { padding: 14px 18px; font-size: 11px; color: #64748b; border-top: 1px solid rgba(255,255,255,0.08); }

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  height: 64px; background: #fff; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
}
.topbar-title { font-size: 18px; font-weight: 700; }
.topbar-user { display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 34px; height: 34px; border-radius: 50%; background: var(--navy); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
}
.user-info { line-height: 1.2; }
.user-name { font-size: 13px; font-weight: 600; }
.user-role { font-size: 11px; color: var(--text-muted); }

.content { padding: 24px; flex: 1; overflow: auto; }

.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.page-header h1 { font-size: 22px; margin: 0; }
.page-header-actions { display: flex; align-items: center; gap: 12px; }
.view-toggle { display: flex; gap: 4px; background: #f3f4f6; border-radius: 8px; padding: 3px; }
.view-toggle .btn { padding: 6px 14px; }

.calendar-card { padding: 18px; }
.calendar-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.calendar-weekday { background: #fafafa; padding: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); text-align: center; }
.calendar-cell { background: #fff; min-height: 108px; padding: 6px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
.calendar-cell:hover { background: #f9fafb; }
.calendar-cell.other-month { background: #fafafa; }
.calendar-cell.other-month .calendar-date { color: var(--text-muted); }
.calendar-date { font-size: 12px; font-weight: 600; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.calendar-date.today { color: #fff; background: var(--blue); }
.shift-chip {
  background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; font-size: 11px; padding: 2px 6px;
  border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.shift-chip:hover { background: #dbeafe; }
.calendar-more { font-size: 11px; color: var(--text-muted); }

.rota-card { padding: 18px; overflow-x: auto; }
.rota-table-wrap { overflow-x: auto; }
.rota-table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 820px; table-layout: fixed; }
.rota-table th, .rota-table td { border: 1px solid var(--border); }
.rota-label-col { width: 150px; min-width: 150px; }
.rota-day-header {
  background: #fff; padding: 6px 4px; text-align: center; font-size: 13px; font-weight: 700;
}
.rota-day-header.today { background: #eff6ff; color: var(--blue-dark); }
.rota-day-name { font-weight: 700; }
.rota-day-date { font-size: 11px; color: var(--text-muted); font-weight: 500; }
.rota-header-row td { height: 12px; }
.rota-header-row:not(:first-child) td { border-top: 3px solid transparent; }
.rota-vehicle-cell {
  background: #fff; font-size: 12px; font-weight: 700; text-align: center; padding: 5px 4px;
  cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rota-vehicle-cell:hover { background: #f9fafb; }
.rota-label-col-cell {
  font-size: 12px; font-weight: 600; color: var(--text); padding: 6px 8px; background: #fafafa;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rota-cell { height: 30px; padding: 4px 6px; font-size: 12px; cursor: pointer; vertical-align: middle; }
.rota-cell:hover { filter: brightness(0.97); }
.rota-cell-day { background: #cfe8fb; }
.rota-cell-night { background: #cdeed4; }
.rota-cell-radio { background: #fde8cf; font-style: italic; }
.rota-cell-empty { background: #fff; cursor: pointer; }
.rota-cell-empty:hover { background: #f9fafb; }

.card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
.table-card { padding: 0; }

.case-notes-list { display: flex; flex-direction: column; gap: 12px; }
.case-note-card { margin-bottom: 0; }
.case-note-header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.case-note-header h3 { margin: 0; }
.case-note-meta { font-style: normal; white-space: nowrap; }
.case-note-body { margin: 0; white-space: pre-wrap; line-height: 1.5; }

.case-note-entries { display: flex; flex-direction: column; gap: 14px; }
.case-note-entry { padding-top: 12px; border-top: 1px solid var(--border); }
.case-note-entry:first-child { padding-top: 0; border-top: none; }
.case-note-entry .case-note-meta { display: block; margin-bottom: 4px; }

.filters-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
.form-field { display: flex; flex-direction: column; gap: 6px; min-width: 150px; }
.form-field-wide { min-width: 100%; }
.form-field-btn { min-width: auto; }
.form-field label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
input, select, textarea {
  border: 1px solid var(--border); border-radius: 6px; padding: 9px 10px; font-size: 14px;
  font-family: inherit; background: #fff; color: var(--text);
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }

.week-nav { display: flex; align-items: center; gap: 8px; }
.week-label { font-size: 14px; font-weight: 600; white-space: nowrap; }

.btn {
  border: none; border-radius: 6px; padding: 9px 16px; font-size: 14px; font-weight: 600;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-dark); }
.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn-ghost:hover { background: #f9fafb; }
.btn-danger { background: #fff; color: var(--red); border: 1px solid #fecaca; }
.btn-danger:hover { background: #fef2f2; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }

.table { width: 100%; border-collapse: collapse; }
.table th {
  text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px;
  color: var(--text-muted); padding: 12px 16px; border-bottom: 1px solid var(--border); background: #fafafa;
}
.table td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: top; }
.row-clickable { cursor: pointer; }
.row-clickable:hover { background: #f9fafb; }
.ref-link { color: var(--blue); font-weight: 600; }
.actions-cell { text-align: right; }

.crew-cell { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.crew-cell:last-child { margin-bottom: 0; }
.crew-num {
  width: 18px; height: 18px; border-radius: 50%; background: var(--navy); color: #fff;
  font-size: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.muted { color: var(--text-muted); font-style: italic; }

.badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
.badge-blue { background: #dbeafe; color: #1e40af; }
.badge-green { background: #dcfce7; color: #166534; }
.badge-grey { background: #f3f4f6; color: #4b5563; }
.badge-red { background: #fee2e2; color: #991b1b; }
.badge-amber { background: #fef3c7; color: #92400e; }

.pagination { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; font-size: 13px; color: var(--text-muted); }
.pagination-controls { display: flex; align-items: center; gap: 10px; }

.empty { padding: 40px; text-align: center; color: var(--text-muted); }

.tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
.tab-btn {
  background: none; border: none; padding: 10px 16px; font-size: 14px; font-weight: 600;
  color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
.file-cell { display: flex; align-items: center; gap: 8px; }
.file-icon { font-size: 16px; }
.page-loading { padding: 60px; text-align: center; color: var(--text-muted); }

.error-banner { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; }
.success-banner { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; }
.warning-banner { background: #fff7e6; color: #92400e; border: 1px solid #fcd34d; padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; }

.settings-section-title { font-size: 13px; font-weight: 700; margin-bottom: 12px; color: var(--text); }
.settings-section-spaced { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
.table code { background: #f1f5f9; border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; font-size: 13px; font-family: 'SFMono-Regular', Consolas, monospace; }
.settings-footer { display: flex; justify-content: flex-end; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }

.policy-body { white-space: pre-wrap; font-size: 14px; line-height: 1.6; color: var(--text); background: #fafafa; border: 1px solid var(--border); border-radius: 8px; padding: 16px; max-height: 360px; overflow: auto; margin-bottom: 14px; }
.ack-list { margin-top: 16px; }
.ack-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.ack-row:last-child { border-bottom: none; }

/* Public incident report (QR code form, no login) */
.public-report-page {
  min-height: 100vh; display: flex; align-items: flex-start; justify-content: center;
  background: var(--bg); padding: 32px 16px;
}
.public-report-card {
  background: #fff; border-radius: 12px; padding: 28px; width: 640px; max-width: 100%;
  box-shadow: 0 12px 32px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 4px;
}
.public-report-brand { font-size: 22px; font-weight: 800; color: var(--navy); display: flex; align-items: center; gap: 10px; }
.public-report-sub { font-size: 10px; color: var(--blue); letter-spacing: 1px; margin-bottom: 8px; }
.public-report-card h1 { font-size: 20px; margin: 8px 0 0; }
.public-report-card .form-grid { margin-top: 16px; }
.public-report-ref {
  font-size: 20px; font-weight: 800; color: var(--navy); background: #f0fdf4; border: 1px solid #bbf7d0;
  border-radius: 8px; padding: 12px 16px; margin: 10px 0;
}

/* Risk assessment matrix (public incident report) */
.risk-section { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 14px 0; margin: 4px 0; }
.risk-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 4px; }
.risk-matrix-wrap { overflow-x: auto; }
.risk-matrix { border-collapse: collapse; width: 100%; min-width: 480px; }
.risk-matrix th, .risk-matrix td {
  border: 1px solid #fff; text-align: center; font-size: 12px; padding: 7px 4px; white-space: nowrap;
}
.risk-matrix-corner { background: #fff; border: none; }
.risk-matrix-impact-header { background: #f3f4f6; color: var(--text); font-weight: 700; font-size: 12px; }
.risk-matrix-row-header {
  background: #f3f4f6; color: var(--text); font-weight: 700; font-size: 12px;
  writing-mode: vertical-rl; transform: rotate(180deg);
}
.risk-matrix-col-label, .risk-matrix-row-label { background: #e5e7eb; color: var(--text); font-weight: 600; }
.risk-matrix-active { background: #cbd5e1; }
.risk-cell { color: #fff; font-weight: 700; }
.risk-cell-low { background: #f5b301; }
.risk-cell-medium { background: #e07b1a; }
.risk-cell-high { background: #e8291a; }
.risk-cell-selected { outline: 3px solid var(--navy); outline-offset: -3px; }
@media (max-width: 640px) {
  .risk-controls { grid-template-columns: 1fr; }
}

/* Login */
.login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--navy); }
.login-card { background: #fff; border-radius: 12px; padding: 32px; width: 360px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.25); }
.login-brand { font-size: 24px; font-weight: 800; color: var(--navy); display: flex; align-items: center; gap: 10px; }
.login-sub { font-size: 10px; color: var(--blue); letter-spacing: 1px; margin-top: -8px; }
.login-card h1 { font-size: 18px; margin: 8px 0 4px; }
.login-card label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-top: 4px; }

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center;
  z-index: 50; padding: 20px;
}
.modal {
  background: #fff; border-radius: 12px; padding: 24px; width: 640px; max-width: 100%; max-height: 90vh; overflow: auto;
  display: flex; flex-direction: column; gap: 16px;
}
.modal-header { display: flex; align-items: center; justify-content: space-between; }
.modal-header h2 { font-size: 18px; margin: 0; }
.modal-close { background: none; border: none; font-size: 16px; cursor: pointer; color: var(--text-muted); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pattern-section { border-top: 1px solid var(--border); padding-top: 14px; }
.pattern-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
.pattern-toggle input { width: auto; }
.pattern-body { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
.pattern-presets { display: flex; flex-wrap: wrap; gap: 6px; }
.pattern-preview { font-size: 12px; color: var(--text-muted); background: #f9fafb; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }

.crew-section { border-top: 1px solid var(--border); padding-top: 14px; }
.crew-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
.crew-row { display: grid; grid-template-columns: 24px 1fr 140px; gap: 10px; align-items: center; margin-bottom: 8px; }
.crew-position {
  width: 22px; height: 22px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 11px;
  display: flex; align-items: center; justify-content: center;
}
.modal-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 14px; }
.modal-footer-right { display: flex; gap: 10px; margin-left: auto; }

.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.kpi-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 18px; border-left: 4px solid var(--border); }
.kpi-card-green { border-left-color: #16a34a; }
.kpi-card-amber { border-left-color: #d97706; }
.kpi-card-red { border-left-color: #dc2626; }
.kpi-value { font-size: 26px; font-weight: 800; color: var(--navy); }
.kpi-label { font-size: 13px; font-weight: 600; margin-top: 4px; }
.kpi-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.kpi-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.kpi-panel { padding: 18px; }
.kpi-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.kpi-panel-title { font-size: 14px; font-weight: 700; }
.kpi-list { display: flex; flex-direction: column; gap: 8px; }
.kpi-list-row {
  display: grid; grid-template-columns: 1fr auto auto auto; gap: 10px; align-items: center;
  font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--border);
}
.kpi-list-row:last-child { border-bottom: none; }
@media (max-width: 1100px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .kpi-panels { grid-template-columns: 1fr; }
}

.profile-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.profile-card { padding: 20px; }
.profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
.profile-avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.profile-avatar {
  width: 72px; height: 72px; border-radius: 50%; object-fit: cover;
  display: flex; align-items: center; justify-content: center;
  background: var(--navy); color: #fff; font-size: 22px; font-weight: 700;
}
.profile-avatar-placeholder { display: flex; align-items: center; justify-content: center; }
.profile-avatar-upload {
  font-size: 11px; color: var(--blue); cursor: pointer; font-weight: 600; text-align: center;
}
.profile-avatar-upload:hover { text-decoration: underline; }
.compliance-row input[type="date"] { padding: 4px 8px; font-size: 12px; }
.checklist { display: flex; flex-direction: column; gap: 6px; }
.checklist-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px;
}
.checklist-row:last-child { border-bottom: none; }
.checklist-label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.checklist-label input[type="checkbox"] { width: 16px; height: 16px; }
.checklist-optional { font-style: italic; margin-left: 4px; }
.checklist-row input[type="date"] { padding: 4px 8px; font-size: 12px; }
@media (max-width: 1100px) {
  .profile-layout { grid-template-columns: 1fr; }
}

.status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
.status-dot-green { background: var(--green); }
.status-dot-amber { background: #d97706; }
.status-dot-red { background: var(--red); }

.vdi-item-row { display: grid; grid-template-columns: 1fr 130px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.vdi-item-row:last-child { border-bottom: none; }
.vdi-item-label { font-size: 13px; font-weight: 600; }
.vdi-section-title { font-size: 13px; font-weight: 700; margin: 18px 0 4px; }
.vdi-section-title:first-child { margin-top: 0; }

.page-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.tabs.no-border { border-bottom: none; }

.modal-wide { width: 820px; }
.modal-xwide { width: 960px; max-height: 92vh; }

.event-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }

.event-card {
  background: #fff; border-radius: 12px; border: 1px solid var(--border); border-left-width: 4px; border-left-style: solid;
  padding: 18px; display: flex; flex-direction: column; gap: 10px;
}

import React from 'react';

const TOKEN_KEY = 'dynamo_token';

function getToken() {
  return localStorage.getItem(TOKEN_KEY);
}

function setToken(token) {
  if (token) localStorage.setItem(TOKEN_KEY, token);
  else localStorage.removeItem(TOKEN_KEY);
}

async function request(path, { method = 'GET', body, params } = {}) {
  let url = `/api${path}`;
  if (params) {
    const qs = new URLSearchParams(
      Object.entries(params).filter(([, v]) => v !== undefined && v !== null && v !== '')
    ).toString();
    if (qs) url += `?${qs}`;
  }
  const headers = { 'Content-Type': 'application/json' };
  const token = getToken();
  if (token) headers.Authorization = `Bearer ${token}`;

  const res = await fetch(url, {
    method,
    headers,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });

  if (res.status === 401) {
    setToken(null);
    if (!window.location.pathname.startsWith('/login')) {
      window.location.href = '/login';
    }
  }

  if (!res.ok) {
    let message = `Request failed (${res.status})`;
    try {
      const data = await res.json();
      if (data?.error) message = data.error;
    } catch (_) {}
    throw new Error(message);
  }

  if (res.status === 204) return null;
  return res.json();
}

async function downloadBlob(path) {
  const headers = {};
  const token = getToken();
  if (token) headers.Authorization = `Bearer ${token}`;

  const res = await fetch(`/api${path}`, { method: 'GET', headers });

  if (res.status === 401) {
    setToken(null);
    if (!window.location.pathname.startsWith('/login')) {
      window.location.href = '/login';
    }
  }

  if (!res.ok) {
    let message = `Request failed (${res.status})`;
    try {
      const data = await res.json();
      if (data?.error) message = data.error;
    } catch (_) {}
    throw new Error(message);
  }

  const blob = await res.blob();
  let fileName = 'download';
  const disposition = res.headers.get('Content-Disposition') || '';
  const match = disposition.match(/filename="?([^"]+)"?/);
  if (match) fileName = match[1];

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function uploadRequest(path, formData) {
  const headers = {};
  const token = getToken();
  if (token) headers.Authorization = `Bearer ${token}`;

  const res = await fetch(`/api${path}`, { method: 'POST', headers, body: formData });

  if (res.status === 401) {
    setToken(null);
    if (!window.location.pathname.startsWith('/login')) {

    try {
      const data = await res.json();
      if (data?.error) message = data.error;
    } catch (_) {}
    throw new Error(message);
  }

  return res.json();
}



const AuthContext = createContext(null);

function AuthProvider({ children }) {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const token = getToken();
    if (!token) {
      setLoading(false);
      return;
    }
    api
      .me()
      .then(setUser)
      .catch(() => setToken(null))
      .finally(() => setLoading(false));
  }, []);

  async function login(email, password) {
    const { token, user } = await api.login(email, password);
    setToken(token);
    setUser(user);
    return user;
  }

  function logout() {
    setToken(null);
    setUser(null);
  }

  async function refreshUser() {
    const fresh = await api.me();
    setUser(fresh);
    return fresh;
  }

  return (
    <AuthContext.Provider value={{ user, loading, login, logout, refreshUser }}>
      {children}
    </AuthContext.Provider>
  );
}

function useAuth() {
  return useContext(AuthContext);
}

  const [password, setPassword] = useState('');
  const [error, setError] = useState('');

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    setBusy(true);

        crewNames,
        notifiedBy,
        onCallManagerInformed: onCallManagerInformed === 'YES',
        onCallManagerName,
        onCallManagerCalledAt,
      });
      onSaved();
    } catch (err) {
      setError(err.message || 'Failed to submit incident report');
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="modal-backdrop" onMouseDown={onClose}>
      <form className="modal modal-xwide" onMouseDown={(e) => e.stopPropagation()} onSubmit={handleSubmit}>
        <div className="modal-header">
          <h2>Report an incident</h2>
          <button type="button" className="modal-close" onClick={onClose}>✕</button>
        </div>

        {error && <div className="error-banner">{error}</div>}

        <div className="form-grid">
          <div className="form-field">
            <label>Date</label>
            <input type="date" value={occurredDate} onChange={(e) => setOccurredDate(e.target.value)} required />
          </div>
          <div className="form-field">
            <label>Time</label>
            <input type="time" value={occurredTime} onChange={(e) => setOccurredTime(e.target.value)} required />
          </div>

          <div className="form-field">
            <label>Location</label>
            <input value={location} onChange={(e) => setLocation(e.target.value)} placeholder="e.g. Luton depot" />
          </div>
          <div className="form-field">
            <label>Severity</label>
            <select value={severity} onChange={(e) => setSeverity(e.target.value)}>
              {INCIDENT_SEVERITIES.map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>

          <div className="form-field">
            <label>Category</label>
            <select value={category} onChange={(e) => setCategory(e.target.value)} required>
              {INCIDENT_CATEGORIES.map((c) => <option key={c} value={c}>{CATEGORY_LABELS[c] || c}</option>)}
            </select>
          </div>

          <div className="form-field">
            <label>CAD Ref (optional)</label>
            <input value={cadRef} onChange={(e) => setCadRef(e.target.value)} placeholder="e.g. 1234" />
          </div>
          <div className="form-field">
            <label>Call sign (optional)</label>
            <input value={callSign} onChange={(e) => setCallSign(e.target.value)} placeholder="e.g. PUM101" />
          </div>

          <div className="form-field form-field-wide">
            <label>Crew names and grade (optional)</label>
            <input value={crewNames} onChange={(e) => setCrewNames(e.target.value)} placeholder="e.g. A. Smith (PARA), B. Jones (ECA)" />
          </div>
          <div className="form-field">
            <label>Was the on-call manager informed?</label>
            <select value={onCallManagerInformed} onChange={(e) => setOnCallManagerInformed(e.target.value)}>
              <option value="">Not specified</option>
              <option value="YES">Yes</option>
              <option value="NO">No</option>
            </select>
          </div>
          <div className="form-field">
            <label>On-call manager name</label>
            <input value={onCallManagerName} onChange={(e) => setOnCallManagerName(e.target.value)} placeholder="e.g. Jordan Lee" />
          </div>
          <div className="form-field">
            <label>Time called</label>
            <input type="time" value={onCallManagerCalledAt} onChange={(e) => setOnCallManagerCalledAt(e.target.value)} />
          </div>

          <div className="form-field form-field-wide">
            <label>What happened?</label>
            <textarea value={description} onChange={(e) => setDescription(e.target.value)} rows={9} required />
          </div>
          <div className="form-field form-field-wide">
            <label>People involved (optional)</label>
            <textarea value={peopleInvolved} onChange={(e) => setPeopleInvolved(e.target.value)} rows={3} />
          </div>
        </div>

        <div className="modal-footer">
          <div />
          <div className="modal-footer-right">
            <button type="button" className="btn btn-ghost" onClick={onClose} disabled={busy}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>
              {busy ? 'Submitting…' : 'Submit report'}
            </button>
          </div>
        </div>
      </form>
    </div>
  );
}



function toIncidentDateInput(value) {
  if (!value) return '';
  const d = new Date(value);
  if (isNaN(d.getTime())) return '';
  return d.toISOString().slice(0, 10);
}

function IncidentDetailModal({ incident, onClose, onSaved }) {
  const { user } = useAuth();
  const isAdmin = isMgrOrAdmin(user?.role);
  const [full, setFull] = useState(incident);
  const [status, setStatus] = useState(incident.status);
  const [severity, setSeverity] = useState(incident.severity || 'LOW');
  const [likelihood, setLikelihood] = useState(incident.likelihood || '');
  const [impact, setImpact] = useState(incident.impact || '');
  const [severityTouched, setSeverityTouched] = useState(false);
  const [adminNotes, setAdminNotes] = useState(incident.adminNotes || '');
  const [cadRef, setCadRef] = useState(incident.cadRef || '');
  const [callSign, setCallSign] = useState(incident.callSign || '');
  const [crewNames, setCrewNames] = useState(incident.crewNames || '');
  const [notifiedBy, setNotifiedBy] = useState(incident.notifiedBy || '');
  const [dateSentToManager, setDateSentToManager] = useState(toIncidentDateInput(incident.dateSentToManager));
  const [infoRequestBy, setInfoRequestBy] = useState(toIncidentDateInput(incident.infoRequestBy));
  const [completedResponseDate, setCompletedResponseDate] = useState(toIncidentDateInput(incident.completedResponseDate));
  const [outcome, setOutcome] = useState(incident.outcome || '');
  const [recommendations, setRecommendations] = useState(incident.recommendations || '');
  const [lessonsLearnt, setLessonsLearnt] = useState(incident.lessonsLearnt || '');
  const [signatureName, setSignatureName] = useState(incident.signatureName || '');
  const [investigatorName, setInvestigatorName] = useState(incident.investigatorName || '');
  const [designation, setDesignation] = useState(incident.designation || '');
  const [signOffDate, setSignOffDate] = useState(toIncidentDateInput(incident.signOffDate));
  const [responsibleManagerId, setResponsibleManagerId] = useState(incident.responsibleManagerId || '');
  const [onCallManagerInformed, setOnCallManagerInformed] = useState(
    incident.onCallManagerInformed === true ? 'YES' : incident.onCallManagerInformed === false ? 'NO' : ''
  );
  const [onCallManagerName, setOnCallManagerName] = useState(incident.onCallManagerName || '');
  const [onCallManagerCalledAt, setOnCallManagerCalledAt] = useState(incident.onCallManagerCalledAt || '');
  const [riddorReportable, setRiddorReportable] = useState(incident.riddorReportable === true);
  const [cqcNotifiable, setCqcNotifiable] = useState(incident.cqcNotifiable === true);
  const [relatedIncidentId, setRelatedIncidentId] = useState(incident.relatedIncidentId || '');
  const [managers, setManagers] = useState([]);
  const [allIncidents, setAllIncidents] = useState([]);
  const [auditTrail, setAuditTrail] = useState([]);
  const [actions, setActions] = useState([]);
  const [newActionDesc, setNewActionDesc] = useState('');
  const [newActionOwner, setNewActionOwner] = useState('');
  const [newActionDue, setNewActionDue] = useState('');
  const [addingAction, setAddingAction] = useState(false);
  const [showAlertForm, setShowAlertForm] = useState(false);
  const [alertTitle, setAlertTitle] = useState('');
  const [alertBody, setAlertBody] = useState('');
  const [raisingAlert, setRaisingAlert] = useState(false);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const [exporting, setExporting] = useState(false);
  const [uploading, setUploading] = useState('');
  const [renamingId, setRenamingId] = useState(null);
  const [renameValue, setRenameValue] = useState('');
  const [renameBusy, setRenameBusy] = useState(false);

  const isClosed = full.status === 'CLOSED';
  const canEdit = isAdmin && !isClosed;
  const canUpload = (isAdmin || incident.reportedBy === user?.id) && !isClosed;

  function applyFull(data) {
    setFull(data);
    setStatus(data.status);
    setSeverity(data.severity || 'LOW');
    setLikelihood(data.likelihood || '');
    setImpact(data.impact || '');
    setSeverityTouched(false);
    setAdminNotes(data.adminNotes || '');
    setCadRef(data.cadRef || '');
    setCallSign(data.callSign || '');
    setCrewNames(data.crewNames || '');
    setNotifiedBy(data.notifiedBy || '');
    setDateSentToManager(toIncidentDateInput(data.dateSentToManager));
    setInfoRequestBy(toIncidentDateInput(data.infoRequestBy));
    setCompletedResponseDate(toIncidentDateInput(data.completedResponseDate));
    setOutcome(data.outcome || '');
    setRecommendations(data.recommendations || '');
    setLessonsLearnt(data.lessonsLearnt || '');
    setSignatureName(data.signatureName || '');
    setInvestigatorName(data.investigatorName || '');
    setDesignation(data.designation || '');
    setSignOffDate(toIncidentDateInput(data.signOffDate));
    setResponsibleManagerId(data.responsibleManagerId || '');
    setOnCallManagerInformed(data.onCallManagerInformed === true ? 'YES' : data.onCallManagerInformed === false ? 'NO' : '');
    setOnCallManagerName(data.onCallManagerName || '');
    setOnCallManagerCalledAt(data.onCallManagerCalledAt || '');
    setRiddorReportable(data.riddorReportable === true);
    setCqcNotifiable(data.cqcNotifiable === true);
    setRelatedIncidentId(data.relatedIncidentId || '');
  }

  // The matrix only suggests a severity — once the admin has touched the
  // Severity dropdown directly, stop overwriting their choice when they
  // keep exploring the Likelihood/Impact dropdowns.
  function applyLikelihood(value) {
    setLikelihood(value);
    const suggested = riskLevelFor(value, impact);
    if (suggested && !severityTouched) setSeverity(suggested);
  }
  function applyImpact(value) {
    setImpact(value);
    const suggested = riskLevelFor(likelihood, value);
    if (suggested && !severityTouched) setSeverity(suggested);
  }
  function applySeverity(value) {
    setSeverity(value);
    setSeverityTouched(true);
  }

  function reload() {
    return api.getIncident(incident.id).then(applyFull);
  }

  function reloadAudit() {
    return api.getIncidentAudit(incident.id).then(setAuditTrail).catch(() => {});
  }

  function reloadActions() {
    return api.listIncidentActions(incident.id).then(setActions).catch(() => {});
  }

  useEffect(() => {
    reload();
    reloadAudit();
    reloadActions();
    if (isAdmin) {
      api.listStaff().then((rows) => setManagers(rows.filter((s) => s.role === 'ADMIN' || s.role === 'MANAGER'))).catch(() => {});
      api.listIncidents().then((rows) => setAllIncidents(rows.filter((i) => i.id !== incident.id))).catch(() => {});
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [incident.id]);

  async function handleAddAction(e) {
    e.preventDefault();
    if (!newActionDesc.trim()) return;
    setAddingAction(true);
    setError('');
    try {
      await api.createIncidentAction(incident.id, {
        description: newActionDesc,
        ownerId: newActionOwner || null,
        dueDate: newActionDue || null,
      });
      setNewActionDesc('');
      setNewActionOwner('');
      setNewActionDue('');
      await reloadActions();
      await reloadAudit();
    } catch (err) {
      setError(err.message || 'Failed to add corrective action');
    } finally {
      setAddingAction(false);
    }
  }

  async function handleActionStatus(action, status) {
    setError('');
    try {
      await api.updateAction(action.id, { status });
      await reloadActions();
      await reloadAudit();
    } catch (err) {
      setError(err.message || 'Failed to update action');
    }
  }

  async function handleDeleteAction(action) {
    setError('');
    try {
      await api.deleteAction(action.id);
      await reloadActions();
    } catch (err) {
      setError(err.message || 'Failed to delete action');
    }
  }

  async function handleRaiseAlert(e) {
    e.preventDefault();
    if (!alertTitle.trim() || !alertBody.trim()) return;
    setRaisingAlert(true);
    setError('');
    try {
      await api.createSafetyAlert({ title: alertTitle, body: alertBody, incidentId: incident.id });
      setAlertTitle('');
      setAlertBody('');
      setShowAlertForm(false);
      await reloadAudit();
    } catch (err) {
      setError(err.message || 'Failed to raise safety alert');
    } finally {
      setRaisingAlert(false);
    }
  }

  async function handleSave(e) {
    e.preventDefault();
    setError('');
    setBusy(true);
    try {
      await api.updateIncident(incident.id, {
        status,
        severity,
        likelihood: likelihood || null,
        impact: impact || null,
        adminNotes,
        cadRef,
        callSign,
        crewNames,
        notifiedBy,
        dateSentToManager: dateSentToManager || null,
        infoRequestBy: infoRequestBy || null,
        completedResponseDate: completedResponseDate || null,
        outcome,
        recommendations,
        lessonsLearnt,
        signatureName,
        investigatorName,
        designation,
        signOffDate: signOffDate || null,
        responsibleManagerId: responsibleManagerId || null,
        onCallManagerInformed: onCallManagerInformed === 'YES',
        onCallManagerName,
        onCallManagerCalledAt,
        riddorReportable,
        cqcNotifiable,
        relatedIncidentId: relatedIncidentId || null,
      });
      await reloadAudit();
      onSaved();
    } catch (err) {
      setError(err.message || 'Failed to update incident');
    } finally {
      setBusy(false);
    }
  }

  async function handleUpload(kind, e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setError('');
    setUploading(kind);
    try {
      const formData = new FormData();
      formData.append('kind', kind);
      formData.append('file', file);
      await api.uploadIncidentAttachment(incident.id, formData);
      await reload();
    } catch (err) {
      setError(err.message || 'Failed to upload file');
    } finally {
      setUploading('');
    }
  }

  async function handleDownload(attachment) {
    try {
      const { url } = await api.getIncidentAttachmentDownloadUrl(incident.id, attachment.id);
      window.open(url, '_blank');
    } catch (err) {
      setError(err.message || 'Failed to get download link');
    }
  }

  function startRename(attachment, e) {
    e.stopPropagation();
    setError('');
    setRenamingId(attachment.id);
    setRenameValue(attachment.fileName);
  }

  function cancelRename(e) {
    if (e) e.stopPropagation();
    setRenamingId(null);
    setRenameValue('');
  }

  async function confirmRename(attachment, e) {
    if (e) e.stopPropagation();
    const nextName = renameValue.trim();
    if (!nextName || nextName === attachment.fileName) {
      cancelRename();
      return;
    }
    setError('');
    setRenameBusy(true);
    try {
      const updated = await api.renameIncidentAttachment(incident.id, attachment.id, nextName);
      setFull((prev) => ({
        ...prev,
        attachments: (prev.attachments || []).map((a) => (a.id === attachment.id ? updated : a)),
      }));
      setRenamingId(null);
      setRenameValue('');
    } catch (err) {
      setError(err.message || 'Failed to rename file');
    } finally {
      setRenameBusy(false);
    }
  }

  async function handleExport() {
    setError('');
    setExporting(true);
    try {
      await api.exportIncidentDocx(incident.id);
      await reloadAudit();
    } catch (err) {
      setError(err.message || 'Failed to export incident report');
    } finally {
      setExporting(false);
    }
  }

  function fmtAuditTimestamp(value) {
    if (!value) return '—';
    const d = new Date(value);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('en-GB') + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }

  return (
    <div className="modal-backdrop" onMouseDown={onClose}>
      <div className="modal" onMouseDown={(e) => e.stopPropagation()}>
        <div className="modal-header">
          <h2>Incident {incident.ref}</h2>
          <button type="button" className="modal-close" onClick={onClose}>✕</button>
        </div>

        {error && <div className="error-banner">{error}</div>}

        {isClosed && (
          <div className="success-banner" style={{ marginBottom: 10 }}>
            This incident is closed and is now read-only.
          </div>
        )}

        {full.escalatedAt && (
          <div className="error-banner" style={{ marginBottom: 10 }}>
            This incident breached its response deadline and was auto-escalated to admins on {fmtDate(full.escalatedAt)}.
          </div>
        )}

        {full.allocationStatus === 'RED' && (
          <div className="error-banner" style={{ marginBottom: 10 }}>
            No responsible manager has been allocated and the allocation deadline has passed. Please assign a
            responsible manager below.
          </div>
        )}
        {full.allocationStatus === 'AMBER' && (
          <div className="warning-banner" style={{ marginBottom: 10 }}>
            This incident still needs a responsible manager allocated — the allocation deadline is due soon.
          </div>
        )}

        <div style={{ marginBottom: 10 }}>
          <button type="button" className="btn btn-ghost btn-sm" onClick={handleExport} disabled={exporting}>
            {exporting ? 'Preparing…' : 'Download as Word (Investigation form)'}
          </button>
        </div>

        <div className="form-grid">
          <div className="form-field">
            <label>Occurred</label>
            <div>{fmtDate(full.occurredAt)} {fmtTime(full.occurredAt)}</div>
          </div>
          <div className="form-field">
            <label>Severity</label>
            <div><span className={'badge ' + severityBadgeClass(full.severity)}>{full.severity}</span></div>
          </div>

          <div className="form-field">
            <label>Category</label>
            <div>{CATEGORY_LABELS[full.category] || '—'}</div>
          </div>
          <div className="form-field">
            <label>Response</label>
            <div>{responseStatusBadge(full.responseStatus)}</div>
          </div>

          <div className="form-field">
            <label>Location</label>
            <div>{full.location || '—'}</div>
          </div>
          <div className="form-field">
            <label>Reported by</label>
            <div>{full.reporterName || full.notifiedBy || '—'}</div>
          </div>
          <div className="form-field">
            <label>Responsible manager</label>
            <div>
              {full.responsibleManagerName || 'Unassigned'}
              {full.allocationStatus && <> {allocationStatusBadge(full.allocationStatus)}</>}
            </div>
          </div>

          {full.vehicleReg && (
            <div className="form-field">
              <label>Vehicle registration</label>
              <div>{full.vehicleReg}</div>
            </div>
          )}
          {full.reporterEmail && (
            <div className="form-field">
              <label>Reporter email</label>
              <div>{full.reporterEmail}</div>
            </div>
          )}
          {full.cadRef && (
            <div className="form-field">
              <label>CAD Ref</label>
              <div>{full.cadRef}</div>
            </div>
          )}
          {full.callSign && (
            <div className="form-field">
              <label>Call sign</label>
              <div>{full.callSign}</div>
            </div>
          )}
          {full.crewNames && (
            <div className="form-field form-field-wide">
              <label>Crew names and grade</label>
              <div>{full.crewNames}</div>
            </div>
          )}
          {full.onCallManagerInformed !== null && full.onCallManagerInformed !== undefined && (
            <div className="form-field">
              <label>On-call manager informed?</label>
              <div>
                {full.onCallManagerInformed ? 'Yes' : 'No'}
                {full.onCallManagerInformed && full.onCallManagerName ? ` — ${full.onCallManagerName}` : ''}
                {full.onCallManagerInformed && full.onCallManagerCalledAt ? ` at ${full.onCallManagerCalledAt}` : ''}
              </div>
            </div>
          )}
          {(full.riddorReportable || full.cqcNotifiable) && (
            <div className="form-field">
              <label>Regulatory flags</label>
              <div>
                {full.riddorReportable && <span className="badge badge-red" style={{ marginRight: 6 }}>RIDDOR</span>}
                {full.cqcNotifiable && <span className="badge badge-amber">CQC notifiable</span>}
              </div>
            </div>
          )}
          {full.relatedIncidentRef && (
            <div className="form-field">
              <label>Related incident</label>
              <div>{full.relatedIncidentRef}</div>
            </div>
          )}

          <div className="form-field form-field-wide">
            <label>What happened</label>
            <div className="policy-body">{full.description}</div>
          </div>

          {full.peopleInvolved && (
            <div className="form-field form-field-wide">
              <label>People involved</label>
              <div className="policy-body">{full.peopleInvolved}</div>
            </div>
          )}
        </div>

        {canUpload && (
          <div>
            <div className="settings-section-title settings-section-spaced">Photos &amp; statements</div>
            <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
              <label className="btn btn-ghost btn-sm" style={{ cursor: 'pointer' }}>
                {uploading === 'PHOTO' ? 'Uploading…' : 'Upload photo'}
                <input
                  type="file"
                  accept="image/*"
                  style={{ display: 'none' }}
                  disabled={!!uploading}
                  onChange={(e) => handleUpload('PHOTO', e)}
                />
              </label>
              <label className="btn btn-ghost btn-sm" style={{ cursor: 'pointer' }}>
                {uploading === 'STATEMENT' ? 'Uploading…' : 'Upload statement'}
                <input
                  type="file"
                  style={{ display: 'none' }}
                  disabled={!!uploading}
                  onChange={(e) => handleUpload('STATEMENT', e)}
                />
              </label>
            </div>
            {(full.attachments || []).length > 0 && (
              <div className="kpi-list" style={{ marginBottom: 10 }}>
                {full.attachments.map((a) => (
                  <div
                    key={a.id}
                    className={renamingId === a.id ? 'kpi-list-row' : 'kpi-list-row row-clickable'}
                    onClick={renamingId === a.id ? undefined : () => handleDownload(a)}
                  >
                    {renamingId === a.id ? (
                      <span className="file-cell" onClick={(e) => e.stopPropagation()}>
                        <span className="file-icon">{a.kind === 'PHOTO' ? '📷' : '📄'}</span>
                        <input
                          type="text"
                          autoFocus
                          value={renameValue}
                          disabled={renameBusy}
                          onChange={(e) => setRenameValue(e.target.value)}
                          onKeyDown={(e) => {
                            if (e.key === 'Enter') confirmRename(a, e);
                            if (e.key === 'Escape') cancelRename(e);
                          }}
                          style={{ fontSize: 13, padding: '2px 6px', width: 200 }}
                        />
                        <button
                          type="button"
                          className="btn btn-primary btn-sm"
                          disabled={renameBusy}
                          onClick={(e) => confirmRename(a, e)}
                        >
                          Save
                        </button>
                        <button type="button" className="btn btn-ghost btn-sm" disabled={renameBusy} onClick={cancelRename}>
                          Cancel
                        </button>
                      </span>
                    ) : (
                      <span className="file-cell">
                        <span className="file-icon">{a.kind === 'PHOTO' ? '📷' : '📄'}</span>
                        {a.fileName}
                      </span>
                    )}
                    <span className="muted">{a.uploadedByName || '—'}</span>
                    <span className="muted">{fmtDate(a.createdAt)}</span>
                    {renamingId !== a.id && canUpload && (
                      <button
                        type="button"
                        className="btn btn-ghost btn-sm"
                        onClick={(e) => startRename(a, e)}
                        title="Rename file"
                      >
                        Rename
                      </button>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        <div>
          <div className="settings-section-title settings-section-spaced">Corrective actions</div>
          {actions.length > 0 ? (
            <div className="kpi-list" style={{ marginBottom: 10 }}>
              {actions.map((a) => (
                <div key={a.id} className="kpi-list-row">
                  <span>{a.description}</span>

                  </span>
                  {isAdmin && !isClosed ? (
                    <span style={{ display: 'flex', gap: 6 }}>
                      <select value={a.status} onChange={(e) => handleActionStatus(a, e.target.value)}>

                        <option value="IN_PROGRESS">In progress</option>

                      </select>
                      <button type="button" className="btn btn-ghost btn-sm" onClick={() => handleDeleteAction(a)}>Delete</button>

                    <span className={'badge ' + (a.status === 'DONE' ? 'badge-green' : a.status === 'IN_PROGRESS' ? 'badge-amber' : 'badge-red')}>

                  <input type="date" value={completedResponseDate} onChange={(e) => setCompletedResponseDate(e.target.value)} />

              <div className="settings-section-title settings-section-spaced">Sign-off</div>

                <div className="form-grid">

                    </div>

                  {full.recommendations && (
                    <div className="form-field form-field-wide">

                      <div className="policy-body">{full.recommendations}</div>

                  {full.lessonsLearnt && (
                    <div className="form-field form-field-wide">

          {auditTrail.length > 0 && (
            <>
              <div className="settings-section-title settings-section-spaced">Audit trail</div>
              <div className="kpi-list" style={{ marginBottom: 10 }}>
                {auditTrail.map((e) => (

  );
}



function Login() {
  const { user, login, loading } = useAuth();
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const navigate = useNavigate();

  if (!loading && user) return <Navigate to="/dashboard" replace />;

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    setBusy(true);
    try {
      await login(email, password);
      navigate('/dashboard');
    } catch (err) {
      setError(err.message || 'Login failed');
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="login-page">
      <form className="login-card" onSubmit={handleSubmit}>
        <div className="login-brand">
          <div className="brand-icon brand-icon-light">
            <span className="brand-icon-letter">D</span>
            <span className="brand-icon-dot"></span>
          </div>
          DYNAMO
        </div>
        <h1>Sign in</h1>
        {error && <div className="error-banner">{error}</div>}
        <label>Email</label>
        <input
          type="email"
          value={email}
          onChange={(e) => setEmail(e.target.value)}
          required
          autoFocus
        />
        <label>Password</label>
        <input
          type="password"
          value={password}
          onChange={(e) => setPassword(e.target.value)}
          required
        />
        <button className="btn btn-primary" type="submit" disabled={busy}>
          {busy ? 'Signing in…' : 'Sign in'}
        </button>
      </form>
    </div>
  );
}



function Staff() {
  const [staff, setStaff] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(null); // staff object, 'new', or null

  function load() {
    setLoading(true);
    return api.listStaff().then(setStaff).finally(() => setLoading(false));
  }

  useEffect(() => {
    load();
  }, []);

  async function handleDelete(e, s) {
    e.stopPropagation();
    if (!confirm(`Remove ${s.name}? They will no longer be able to log in.`)) return;
    try {
      await api.deleteStaff(s.id);
      load();
    } catch (err) {
      alert(err.message || 'Failed to remove staff member');
    }
  }

  return (
    <div>
      <div className="page-header">
        <h1>Staff</h1>
        <button className="btn btn-primary" onClick={() => setEditing('new')}>+ Add staff</button>
      </div>

      <div className="card table-card">
        {loading ? (
          <div className="empty">Loading…</div>
        ) : staff.length === 0 ? (
          <div className="empty">No staff added yet.</div>
        ) : (
          <table className="table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Role</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {staff.map((s) => (
                <tr key={s.id} className="row-clickable" onClick={() => setEditing(s)}>
                  <td>{s.name}</td>
                  <td>{s.email}</td>
                  <td>{s.phone || '—'}</td>
                  <td>{s.role}</td>
                  <td>
                    <span className={'badge ' + (s.active ? 'badge-green' : 'badge-grey')}>
                      {s.active ? 'Active' : 'Inactive'}
                    </span>
                  </td>
                  <td className="actions-cell">
                    <button
                      type="button"
                      className="btn btn-ghost btn-sm"
                      onClick={(e) => handleDelete(e, s)}
                    >
                      Remove
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {editing && (
        <StaffModal
          staff={editing === 'new' ? null : editing}
          onClose={() => setEditing(null)}
          onSaved={() => { setEditing(null); load(); }}
        />
      )}
    </div>
  );
}



function Settings() {
  const { user, refreshUser } = useAuth();
  const isAdmin = isMgrOrAdmin(user?.role);
  const [name, setName] = useState(user?.name || '');
  const [email, setEmail] = useState(user?.email || '');
  const [phone, setPhone] = useState(user?.phone || '');
  const [currentPassword, setCurrentPassword] = useState('');
  const [newPassword, setNewPassword] = useState('');
  const [confirmPassword, setConfirmPassword] = useState('');
  const [error, setError] = useState('');
  const [success, setSuccess] = useState('');
  const [busy, setBusy] = useState(false);

  const [daysToRespond, setDaysToRespond] = useState(5);
  const [hoursToAllocate, setHoursToAllocate] = useState(24);
  const [slaError, setSlaError] = useState('');
  const [slaSuccess, setSlaSuccess] = useState('');
  const [slaBusy, setSlaBusy] = useState(false);

  const [staffList, setStaffList] = useState([]);
  const [selectedStaffIds, setSelectedStaffIds] = useState([]);
  const [resetError, setResetError] = useState('');
  const [resetBusy, setResetBusy] = useState(false);
  const [resetResults, setResetResults] = useState(null);

  const [digestBusy, setDigestBusy] = useState(false);
  const [digestResult, setDigestResult] = useState(null);
  const [digestError, setDigestError] = useState('');

  useEffect(() => {
    if (isAdmin) {
      api.getSettings().then((s) => {
        setDaysToRespond(s.daysToRespond);
        setHoursToAllocate(s.hoursToAllocate);
      }).catch(() => {});
      api.listStaff().then(setStaffList).catch(() => {});
    }
  }, [isAdmin]);

  function toggleStaffSelected(id) {
    setSelectedStaffIds((prev) =>
      prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]
    );
  }

  async function handleResetPasswords(e) {
    e.preventDefault();
    setResetError('');
    setResetResults(null);
    if (selectedStaffIds.length === 0) {
      setResetError('Select at least one staff member');
      return;
    }
    if (!confirm(`Reset the password for ${selectedStaffIds.length} selected staff member${selectedStaffIds.length === 1 ? '' : 's'}? Their current password will stop working immediately.`)) {
      return;
    }
    setResetBusy(true);
    try {
      const { results } = await api.resetStaffPasswords(selectedStaffIds);
      setResetResults(results);
      setSelectedStaffIds([]);
    } catch (err) {
      setResetError(err.message || 'Failed to reset passwords');
    } finally {
      setResetBusy(false);
    }
  }

  async function handleSlaSubmit(e) {
    e.preventDefault();
    setSlaError('');
    setSlaSuccess('');
    setSlaBusy(true);
    try {
      const saved = await api.updateSettings({ daysToRespond: Number(daysToRespond), hoursToAllocate: Number(hoursToAllocate) });
      setDaysToRespond(saved.daysToRespond);
      setHoursToAllocate(saved.hoursToAllocate);
      setSlaSuccess('Incident response setting saved.');
    } catch (err) {
      setSlaError(err.message || 'Failed to save setting');
    } finally {
      setSlaBusy(false);
    }
  }

  async function handleSendDigest() {
    setDigestError('');
    setDigestResult(null);
    setDigestBusy(true);
    try {
      const result = await api.runDigest();
      setDigestResult(result);
    } catch (err) {
      setDigestError(err.message || 'Failed to send digest');
    } finally {
      setDigestBusy(false);
    }
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    setSuccess('');

    if (newPassword && newPassword !== confirmPassword) {
      setError('New password and confirmation do not match');
      return;
    }
    if (newPassword && !currentPassword) {
      setError('Enter your current password to set a new one');
      return;
    }

    setBusy(true);
    try {
      const payload = { name, email, phone };
      if (newPassword) {
        payload.currentPassword = currentPassword;
        payload.newPassword = newPassword;
      }
      await api.updateMe(payload);
      await refreshUser();
      setCurrentPassword('');
      setNewPassword('');
      setConfirmPassword('');
      setSuccess('Your details have been saved.');
    } catch (err) {
      setError(err.message || 'Failed to save changes');
    } finally {
      setBusy(false);
    }
  }

  return (
    <div>
      <div className="page-header">
        <h1>Settings</h1>
      </div>

      <div className="card" style={{ maxWidth: 560 }}>
        <form onSubmit={handleSubmit}>
          {error && <div className="error-banner">{error}</div>}
          {success && <div className="success-banner">{success}</div>}

          <div className="settings-section-title">My details</div>
          <div className="form-grid">
            <div className="form-field">
              <label>Full name</label>
              <input value={name} onChange={(e) => setName(e.target.value)} required />
            </div>
            <div className="form-field">
              <label>Email</label>
              <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required />
            </div>
            <div className="form-field form-field-wide">
              <label>Phone</label>
              <input value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="e.g. 07700 900000" />
            </div>
          </div>

          <div className="settings-section-title settings-section-spaced">Change password</div>
          <div className="form-grid">
            <div className="form-field form-field-wide">
              <label>Current password</label>
              <input
                type="password"
                value={currentPassword}
                onChange={(e) => setCurrentPassword(e.target.value)}
                placeholder="Required to set a new password"
              />
            </div>
            <div className="form-field">
              <label>New password</label>
              <input type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} placeholder="Leave blank to keep current" />
            </div>
            <div className="form-field">
              <label>Confirm new password</label>

const INCIDENT_SEVERITIES = ['LOW', 'MEDIUM', 'HIGH', 'CRITICAL'];
const INCIDENT_STATUSES = ['OPEN', 'INVESTIGATING', 'CLOSED'];
const INCIDENT_CATEGORIES = [
  'CLINICAL',
  'MEDICATION',
  'VEHICLE_DAMAGE',
  'SAFEGUARDING',
  'COMPLAINT',
  'NEAR_MISS',
  'VIOLENCE',
  'INFECTION_CONTROL',
];
const CATEGORY_LABELS = {
  CLINICAL: 'Clinical',
  MEDICATION: 'Medication',
  VEHICLE_DAMAGE: 'Vehicle Damage',
  SAFEGUARDING: 'Safeguarding',
  COMPLAINT: 'Complaint',
  NEAR_MISS: 'Near Miss',
  VIOLENCE: 'Violence',
  INFECTION_CONTROL: 'Infection Control',
};

function severityBadgeClass(severity) {
  if (severity === 'CRITICAL' || severity === 'HIGH') return 'badge-red';
  if (severity === 'MEDIUM') return 'badge-amber';
  return 'badge-grey';
}

// Risk matrix — Probability x Impact, used by admins when reviewing an
// incident (see IncidentDetailModal.jsx). Picking a likelihood and an
// impact suggests a severity; the admin can still override the Severity
// dropdown directly if their judgement differs from the matrix.
const RISK_LIKELIHOODS = ['RARE', 'UNLIKELY', 'MODERATE', 'LIKELY', 'VERY_LIKELY'];
const RISK_LIKELIHOOD_LABELS = {
  RARE: 'Rare',
  UNLIKELY: 'Unlikely',
  MODERATE: 'Moderate',
  LIKELY: 'Likely',
  VERY_LIKELY: 'Very likely',
};
const RISK_IMPACTS = ['TRIVIAL', 'MINOR', 'MODERATE', 'MAJOR', 'EXTREME'];
const RISK_IMPACT_LABELS = {
  TRIVIAL: 'Trivial',
  MINOR: 'Minor',
  MODERATE: 'Moderate',
  MAJOR: 'Major',
  EXTREME: 'Extreme',
};
// One row per likelihood (in RISK_LIKELIHOODS order), one value per impact
// (in RISK_IMPACTS order) — matches the organisation's reference 5x5 risk table.
const RISK_MATRIX = {
  RARE: ['LOW', 'LOW', 'LOW', 'MEDIUM', 'MEDIUM'],
  UNLIKELY: ['LOW', 'LOW', 'MEDIUM', 'MEDIUM', 'MEDIUM'],
  MODERATE: ['LOW', 'MEDIUM', 'MEDIUM', 'MEDIUM', 'HIGH'],
  LIKELY: ['MEDIUM', 'MEDIUM', 'MEDIUM', 'HIGH', 'HIGH'],
  VERY_LIKELY: ['MEDIUM', 'MEDIUM', 'HIGH', 'HIGH', 'HIGH'],
};
const RISK_LEVEL_CLASS = { LOW: 'risk-cell-low', MEDIUM: 'risk-cell-medium', HIGH: 'risk-cell-high' };

function riskLevelFor(likelihood, impact) {
  if (!likelihood || !impact) return null;
  const row = RISK_MATRIX[likelihood];
  const col = RISK_IMPACTS.indexOf(impact);
  if (!row || col < 0) return null;
  return row[col];
}

function RiskMatrix({ likelihood, impact }) {
  return (
    <div className="risk-matrix-wrap">
      <table className="risk-matrix">
        <thead>
          <tr>
            <th className="risk-matrix-corner" colSpan={2} rowSpan={2}></th>
            <th className="risk-matrix-impact-header" colSpan={RISK_IMPACTS.length}>Impact</th>
          </tr>
          <tr>
            {RISK_IMPACTS.map((imp) => (
              <th key={imp} className={'risk-matrix-col-label' + (imp === impact ? ' risk-matrix-active' : '')}>
                {RISK_IMPACT_LABELS[imp]}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {RISK_LIKELIHOODS.map((lik, rowIdx) => (
            <tr key={lik}>
              {rowIdx === 0 && (
                <th className="risk-matrix-row-header" rowSpan={RISK_LIKELIHOODS.length}>Probability</th>
              )}
              <th className={'risk-matrix-row-label' + (lik === likelihood ? ' risk-matrix-active' : '')}>
                {RISK_LIKELIHOOD_LABELS[lik]}
              </th>
              {RISK_MATRIX[lik].map((level, colIdx) => {
                const imp = RISK_IMPACTS[colIdx];
                const isSelected = lik === likelihood && imp === impact;
                return (
                  <td
                    key={imp}
                    className={'risk-cell ' + RISK_LEVEL_CLASS[level] + (isSelected ? ' risk-cell-selected' : '')}
                  >
                    {level.charAt(0) + level.slice(1).toLowerCase()}
                  </td>
                );
              })}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function statusBadgeClass(status) {
  if (status === 'OPEN') return 'badge-red';
  if (status === 'INVESTIGATING') return 'badge-amber';
  return 'badge-green';
}

function responseStatusBadge(responseStatus) {
  if (!responseStatus) return <span className="muted">—</span>;
  const cls = responseStatus === 'RED' ? 'status-dot-red' : responseStatus === 'AMBER' ? 'status-dot-amber' : 'status-dot-green';
  const label = responseStatus === 'RED' ? 'Overdue' : responseStatus === 'AMBER' ? 'Due soon' : 'On track';
  return (
    <span className="status-dot-wrap">
      <span className={'status-dot ' + cls}></span> {label}
    </span>
  );
}

// Flags incidents that still have no responsible manager assigned, within
// the "hours to allocate" SLA set on the Settings page (see allocationStatus
// in live_backend.tsx). Once a manager is allocated this returns null from
// the backend, so the badge disappears and only the response SLA matters.
function allocationStatusBadge(allocationStatus) {
  if (!allocationStatus) return <span className="muted">—</span>;
  const cls = allocationStatus === 'RED' ? 'status-dot-red' : allocationStatus === 'AMBER' ? 'status-dot-amber' : 'status-dot-green';
  const label = allocationStatus === 'RED' ? 'Unallocated — overdue' : allocationStatus === 'AMBER' ? 'Allocate soon' : 'On track';
  return (
    <span className="status-dot-wrap">
      <span className={'status-dot ' + cls}></span> {label}
    </span>
  );
}
