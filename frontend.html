          {d.wasteByReason.length === 0 ? <div className="empty">No stock disposed of in the last 90 days.</div>
            : d.wasteByReason.map((r) => <DashBarRow key={r.label} label={r.label} count={r.count} max={maxOf(d.wasteByReason)} color="#b45309" />)}
          {d.wasteByItem.length > 0 && (
            <div className="muted" style={{ fontSize: 12, marginTop: 8 }}>
              Most wasted: {d.wasteByItem.slice(0, 3).map((w) => `${w.label} (${w.count} ${w.unit})`).join(', ')}
            </div>
          )}
        </MedPanel>
        <MedPanel title="Expiry outlook" sub="Batches in stock by expiry month">
          <DashBarRow label="Already expired" count={d.expiryOutlook.expiredBatches} max={outlookMax} color="#dc2626" />
          {d.expiryOutlook.months.map((m) => (
            <DashBarRow key={m.key} label={m.label} count={m.batches} max={outlookMax} color="#64748b" />
          ))}
          <div className="muted" style={{ fontSize: 12, marginTop: 8 }}>Number of batches; plan stock rotation for busy months.</div>
        </MedPanel>
      </div>
    </div>
  );
}

// =====================================================================
// Managers' meetings: daily and weekly.
// =====================================================================

const MEETING_LABEL = { daily: 'Daily Meeting', weekly: 'Weekly Meeting' };

function meetingDateLabel(d) {
  if (!d) return '';
  return new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function MeetingsList() {
  const { type } = useParams();
  const navigate = useNavigate();
  const t = type === 'weekly' ? 'WEEKLY' : 'DAILY';
  const [data, setData] = useState(null);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const [date, setDate] = useState(new Date().toISOString().slice(0, 10));

  useEffect(() => {
    setData(null);
    setError('');
    api.listMeetings(t).then(setData).catch((err) => setError(err.message || 'Failed to load meetings'));
  }, [t]);

  async function start() {
    setError('');
    setBusy(true);
    try {
      const m = await api.createMeeting({ type: t, meetingDate: date });
      navigate(`/meetings/${type}/${m.id}`);
    } catch (err) {
      if (err.data?.existingId) { navigate(`/meetings/${type}/${err.data.existingId}`); return; }
      setError(err.message || 'Could not start the meeting');
    } finally {
      setBusy(false);
    }
  }

  if (error && !data) return <div className="error-banner">{error}</div>;
  if (!data) return <div className="page-loading">Loading…</div>;
  const today = new Date().toISOString().slice(0, 10);
  const todays = data.meetings.find((m) => m.meetingDate === date);

  return (
    <div>
      <div className="page-header">
        <div>
          <h1>{MEETING_LABEL[type] || 'Meetings'}</h1>
          <div className="page-sub">
            {t === 'DAILY'
              ? 'Short daily huddle: staffing, vehicles, last 24 hours of incidents, drug bags and safety'
              : 'Weekly managers’ meeting: actions, incidents, regulatory, corrective actions, fleet, medication and staffing'}
          </div>
        </div>
        <div className="page-header-actions" style={{ alignItems: 'center' }}>
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={{ width: 160 }} />
          {todays
            ? <button className="btn btn-primary" onClick={() => navigate(`/meetings/${type}/${todays.id}`)}>Open {date === today ? "today's" : 'this'} meeting</button>
            : <button className="btn btn-primary" onClick={start} disabled={busy}>{busy ? 'Starting…' : `Start ${date === today ? "today's" : 'a'} meeting`}</button>}
        </div>
      </div>
      {error && <div className="error-banner" style={{ marginBottom: 12 }}>{error}</div>}

      {data.openActions.length > 0 && (
        <div className="card" style={{ marginBottom: 16 }}>
          <div className="kpi-panel-header">
            <div className="kpi-panel-title">Open actions ({data.openActions.length})</div>
            <div className="muted">From earlier {t === 'DAILY' ? 'daily' : 'weekly'} meetings</div>
          </div>
          <div className="kpi-list">
            {data.openActions.map((a) => (
              <div key={a.id} className="kpi-list-row">
                <div>
                  <div style={{ fontWeight: 600 }}>{a.description}</div>
                  <div className="muted" style={{ fontSize: 12 }}>Raised {fmtDate(a.meetingDate)} · {a.ownerName || 'No owner'}</div>
                </div>
                <div>{a.dueDate ? <span className={'badge ' + (a.overdue ? 'badge-red' : 'badge-grey')}>Due {new Date(a.dueDate).toLocaleDateString('en-GB')}</span> : <span className="muted">No due date</span>}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="card table-card">
        {data.meetings.length === 0 ? (
          <div className="empty">No {t === 'DAILY' ? 'daily' : 'weekly'} meetings yet. Use “Start today's meeting” to begin.</div>
        ) : (
          <table className="table">
            <thead><tr><th>Date</th><th>Chair</th><th>Attendees</th><th>Actions</th><th>Status</th></tr></thead>
            <tbody>
              {data.meetings.map((m) => (
                <tr key={m.id} className="row-clickable" onClick={() => navigate(`/meetings/${type}/${m.id}`)}>
                  <td><span className="ref-link">{meetingDateLabel(m.meetingDate)}</span></td>
                  <td>{m.chair || '—'}</td>
                  <td style={{ maxWidth: 360 }}>{m.attendees || '—'}</td>
                  <td>{m.totalActions ? `${m.totalActions} (${m.openActions} open)` : '—'}</td>
                  <td>{m.status === 'FINAL' ? <span className="badge badge-green">Finalised</span> : <span className="badge badge-amber">Draft</span>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

// Live Dynamo figures for one agenda item.
function MeetingFigures({ k, snap }) {
  if (!snap) return null;
  const list = (rows, render) => rows.length ? <ul style={{ margin: '4px 0 0', paddingLeft: 18 }}>{rows.map((r, i) => <li key={i}>{render(r)}</li>)}</ul> : null;
  const inc = (r) => `${r.ref} — ${r.category}, ${r.severity}${r.status ? `, ${r.status.toLowerCase()}` : ''}`;
  const period = snap.periodHours <= 24 ? 'last 24 hours' : 'last 7 days';
  let body = null;
  if (k === 'incidents') {
    const s = snap.incidents;
    body = (
      <>
        <div><strong>{s.newCount}</strong> new in the {period} · <strong>{s.open}</strong> open · <strong>{s.overdueResponse.length}</strong> overdue response · <strong>{s.unallocated.length}</strong> unallocated (overdue)</div>
        {s.newCount > 0 && <div style={{ marginTop: 4 }}>New:{list(s.newList, inc)}</div>}
        {s.highOpen.length > 0 && <div style={{ marginTop: 4 }}>High / critical open:{list(s.highOpen, inc)}</div>}
        {s.overdueResponse.length > 0 && <div style={{ marginTop: 4 }}>Overdue response:{list(s.overdueResponse, inc)}</div>}
      </>
    );
  } else if (k === 'regulatory' || (k === 'incidents' && false)) {
    const r = snap.regulatory;
    const stateText = { RED: 'overdue', AMBER: 'due soon', GREEN: 'in progress', DECISION_NEEDED: 'decision needed', AWAITING_FINDINGS: 'findings to share' };
    body = (r.candour.length + r.riddor.length + r.cqc.length) === 0 ? <div>Nothing outstanding.</div> : (
      <>
        {r.candour.length > 0 && <div>Duty of candour:{list(r.candour, (x) => `${x.ref} — ${stateText[x.state] || x.state}`)}</div>}
        {r.riddor.length > 0 && <div style={{ marginTop: 4 }}>RIDDOR:{list(r.riddor, (x) => `${x.ref} — ${stateText[x.state] || x.state}, due ${new Date(x.dueAt).toLocaleDateString('en-GB')}`)}</div>}
        {r.cqc.length > 0 && <div style={{ marginTop: 4 }}>CQC notifications:{list(r.cqc, (x) => `${x.ref} — ${stateText[x.state] || x.state}`)}</div>}
      </>
    );
  } else if (k === 'capa') {
    const c = snap.capa;
    body = (
      <>
        <div><strong>{c.overdue.length}</strong> overdue · <strong>{c.completed}</strong> completed in the {period}</div>
        {list(c.overdue, (a) => `${a.ref}: ${a.description} — ${a.owner || 'no owner'}, due ${a.dueDate ? new Date(a.dueDate).toLocaleDateString('en-GB') : '—'}`)}
      </>
    );
  } else if (k === 'fleet') {
    const f = snap.fleet;
    body = (
      <>
        <div><strong>{f.offRoad.length}</strong> of {f.vehicles} off road · <strong>{f.openDefects}</strong> open defects{snap.periodHours <= 24 ? <> · <strong>{f.notChecked.length}</strong> not checked today</> : null}</div>
        {list(f.offRoad, (v) => `${v.callSign ? v.callSign + ' — ' : ''}${v.reg}: ${v.status.replace('_', ' ').toLowerCase()}`)}
        {snap.periodHours <= 24 && f.notChecked.length > 0 && <div style={{ marginTop: 4 }}>No daily check yet: {f.notChecked.join(', ')}</div>}
        {snap.periodHours > 24 && f.due.length > 0 && <div style={{ marginTop: 4 }}>Due / overdue:{list(f.due, (x) => x)}</div>}
      </>
    );
  } else if (k === 'medication') {
    const m = snap.medication;
    body = (
      <>
        <div><strong>{m.bagsOut.length}</strong> bags out · <strong>{m.bagsRestock.length}</strong> to restock · <strong>{m.lowStock.length}</strong> medicines below minimum · <strong>{m.expiredBatches}</strong> expired batches</div>
        {m.bagsOut.length > 0 && <div style={{ marginTop: 4 }}>Bags out:{list(m.bagsOut, (b) => `${b.bagNumber} — ${b.to}${b.for ? `, ${b.for}` : ''} (${b.hours}h)`)}</div>}
        {m.bagsRestock.length > 0 && <div style={{ marginTop: 4 }}>To restock: {m.bagsRestock.join(', ')}</div>}
        {m.bagsExpired.length > 0 && <div style={{ marginTop: 4 }}>Bags with expired items: {m.bagsExpired.join(', ')}</div>}
        {m.lowStock.length > 0 && <div style={{ marginTop: 4 }}>Below minimum:{list(m.lowStock, (x) => `${x.item} — ${x.qty} ${x.unit} (min ${x.min})`)}</div>}
      </>
    );
  } else if (k === 'safety') {
    body = <div><strong>{snap.safety.activeAlerts}</strong> active safety alert{snap.safety.activeAlerts === 1 ? '' : 's'}</div>;
  }
  if (!body) return null;
  return (
    <div style={{ background: 'var(--bg, #f8fafc)', border: '1px solid var(--border)', borderRadius: 8, padding: '8px 12px', fontSize: 13, marginBottom: 8 }}>
      <div className="muted" style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: '.04em', marginBottom: 2 }}>From Dynamo</div>
      {body}
    </div>
  );
}

function MeetingEditor() {
  const { type, id } = useParams();
  const navigate = useNavigate();
  const [m, setM] = useState(null);
  const [staff, setStaff] = useState([]);
  const [form, setForm] = useState(null);
  const [dirty, setDirty] = useState(false);
  const [saving, setSaving] = useState(false);
  const [savedAt, setSavedAt] = useState(null);
  const [error, setError] = useState('');
  const [newAction, setNewAction] = useState({ description: '', ownerId: '', dueDate: '' });

  function load() {
    return api.getMeeting(id).then((data) => {
      setM(data);
      setForm({ chair: data.chair || '', attendees: data.attendees || '', apologies: data.apologies || '', notes: { ...data.notes } });
      setDirty(false);
    }).catch((err) => setError(err.message || 'Failed to load the meeting'));
  }
  useEffect(() => {
    load();
    api.listStaff().then((rows) => setStaff(rows.filter((s) => s.active !== false))).catch(() => {});
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [id]);

  // Autosave notes a moment after typing stops.
  useEffect(() => {
    if (!dirty || !m || m.status === 'FINAL') return;
    const t = setTimeout(() => save(), 1500);
    return () => clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [form, dirty]);

  async function save() {
    setSaving(true);
    setError('');
    try {
      await api.updateMeeting(id, form);
      setDirty(false);
      setSavedAt(new Date());
    } catch (err) {
      setError(err.message || 'Failed to save');
    } finally {
      setSaving(false);
    }
  }

  function setField(k, v) { setForm((f) => ({ ...f, [k]: v })); setDirty(true); }
  function setNote(k, v) { setForm((f) => ({ ...f, notes: { ...f.notes, [k]: v } })); setDirty(true); }

  async function refresh() {
    try { await api.refreshMeeting(id); await load(); } catch (err) { setError(err.message); }
  }
  async function finalise() {
    if (dirty) await save();
    if (!confirm('Finalise these minutes? They will be locked and can no longer be edited. Open actions still carry forward.')) return;
    try { await api.finaliseMeeting(id); await load(); } catch (err) { setError(err.message); }
  }
  async function remove() {
    if (!confirm('Delete this draft meeting and its actions?')) return;
    try { await api.deleteMeeting(id); navigate(`/meetings/${type}`); } catch (err) { setError(err.message); }
  }
  async function addAction(e) {
    e.preventDefault();
    setError('');
    try {
      await api.addMeetingAction(id, newAction);
      setNewAction({ description: '', ownerId: '', dueDate: '' });
      await load();
    } catch (err) { setError(err.message); }
  }
  async function toggleAction(a) {
    try { await api.updateMeetingAction(a.id, { status: a.status === 'DONE' ? 'OPEN' : 'DONE' }); await load(); } catch (err) { setError(err.message); }
  }
  async function deleteAction(a) {
    if (!confirm('Delete this action?')) return;
    try { await api.deleteMeetingAction(a.id); await load(); } catch (err) { setError(err.message); }
  }

  if (error && !m) return <div className="error-banner">{error}</div>;
  if (!m || !form) return <div className="page-loading">Loading…</div>;
  const final = m.status === 'FINAL';
  const snap = m.snapshot;

  const actionRow = (a, showMeeting) => (
    <div key={a.id} className="kpi-list-row" style={{ alignItems: 'flex-start' }}>
      <label style={{ display: 'flex', gap: 10, alignItems: 'flex-start', fontWeight: 400, flex: 1 }}>
        <input type="checkbox" checked={a.status === 'DONE'} onChange={() => toggleAction(a)} style={{ marginTop: 3 }} />
        <span>
          <span style={{ textDecoration: a.status === 'DONE' ? 'line-through' : 'none' }}>{a.description}</span>
          <div className="muted" style={{ fontSize: 12 }}>
            {a.ownerName || 'No owner'}
            {a.dueDate ? ` · due ${new Date(a.dueDate).toLocaleDateString('en-GB')}` : ''}
            {showMeeting ? ` · raised ${new Date(a.meetingDate).toLocaleDateString('en-GB')}` : ''}
            {a.status === 'DONE' && a.completedAt ? ` · done ${new Date(a.completedAt).toLocaleDateString('en-GB')}${a.completedByName ? ' by ' + a.completedByName : ''}` : ''}
          </div>
        </span>
      </label>
      <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
        {a.overdue && <span className="badge badge-red">Overdue</span>}
        {!final && !showMeeting && <button type="button" className="btn btn-ghost btn-sm" onClick={() => deleteAction(a)}>Delete</button>}
      </div>
    </div>
  );

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="muted" style={{ fontSize: 13 }}><a href={`/meetings/${type}`} onClick={(e) => { e.preventDefault(); navigate(`/meetings/${type}`); }}>← All {type} meetings</a></div>
          <h1>{m.typeLabel} — {meetingDateLabel(m.meetingDate)}</h1>
          <div className="page-sub">
            {final
              ? <>Finalised by {m.finalisedByName} on {fmtDate(m.finalisedAt)} {fmtTime(m.finalisedAt)} · read-only</>
              : <>Draft · {saving ? 'Saving…' : dirty ? 'Unsaved changes' : savedAt ? `Saved ${fmtTime(savedAt)}` : 'Changes save automatically'}</>}
          </div>
        </div>
        <div className="page-header-actions">
          {!final && <button className="btn btn-ghost" onClick={remove}>Delete draft</button>}
          {!final && <button className="btn btn-ghost" onClick={refresh}>Refresh figures</button>}
          {!final && <button className="btn btn-primary" onClick={finalise}>Finalise minutes</button>}
          {final && <span className="badge badge-green" style={{ alignSelf: 'center' }}>Finalised</span>}
        </div>
      </div>
      {error && <div className="error-banner" style={{ marginBottom: 12, whiteSpace: 'pre-line' }}>{error}</div>}

      <div className="card" style={{ marginBottom: 16 }}>
        <div className="form-grid">
          <div className="form-field">
            <label>Chair</label>
            <input value={form.chair} onChange={(e) => setField('chair', e.target.value)} disabled={final} />
          </div>
          <div className="form-field">
            <label>Apologies</label>
            <input value={form.apologies} onChange={(e) => setField('apologies', e.target.value)} disabled={final} placeholder="Who couldn't attend" />
          </div>
          <div className="form-field" style={{ gridColumn: '1 / -1' }}>
            <label>Attendees</label>
            <input value={form.attendees} onChange={(e) => setField('attendees', e.target.value)} disabled={final} placeholder="Names, separated by commas" />
            {!final && staff.length > 0 && (
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginTop: 6 }}>
                {staff.filter((p) => !form.attendees.toLowerCase().split(',').map((x) => x.trim()).includes(p.name.toLowerCase())).slice(0, 12).map((p) => (
                  <button type="button" key={p.id} className="btn btn-ghost btn-sm"
                    onClick={() => setField('attendees', [form.attendees.trim(), p.name].filter(Boolean).join(', '))}>+ {p.name}</button>
                ))}
              </div>
            )}
          </div>
        </div>
        {snap && <div className="muted" style={{ fontSize: 12, marginTop: 4 }}>Figures from Dynamo taken {fmtDate(snap.takenAt)} {fmtTime(snap.takenAt)}{!final ? ' — use “Refresh figures” to update them' : ''}.</div>}
      </div>

      {m.carriedActions.length > 0 && (
        <div className="card" style={{ marginBottom: 16 }}>
          <div className="kpi-panel-header">
            <div className="kpi-panel-title">Actions from previous meetings</div>
            <div className="muted">Tick when done</div>
          </div>
          <div className="kpi-list">{m.carriedActions.map((a) => actionRow(a, true))}</div>
        </div>
      )}

      {m.agenda.map((sec, i) => (
        <div key={sec.key} className="card" style={{ marginBottom: 12 }}>
          <div className="kpi-panel-header">
            <div className="kpi-panel-title">{i + 1}. {sec.title}</div>
          </div>
          <MeetingFigures k={sec.key === 'safety' || sec.key === 'aob' ? sec.key : sec.key} snap={snap} />
          {final ? (
            <div className="policy-body" style={{ whiteSpace: 'pre-wrap' }}>{form.notes[sec.key] || <span className="muted">No notes.</span>}</div>
          ) : (
            <textarea value={form.notes[sec.key] || ''} onChange={(e) => setNote(sec.key, e.target.value)} rows={3}
              placeholder={sec.hint ? `Notes — ${sec.hint.toLowerCase()}` : 'Notes'} style={{ width: '100%' }} />
          )}
        </div>
      ))}

      <div className="card" style={{ marginBottom: 16 }}>
        <div className="kpi-panel-header">
          <div className="kpi-panel-title">Actions from this meeting</div>
          <div className="muted">Open actions carry forward to the next {type} meeting</div>
        </div>
        {m.actions.length === 0 ? <div className="muted" style={{ marginBottom: 8 }}>No actions yet.</div>
          : <div className="kpi-list" style={{ marginBottom: 10 }}>{m.actions.map((a) => actionRow(a, false))}</div>}
        {!final && (
          <form onSubmit={addAction} className="form-grid" style={{ alignItems: 'end' }}>
            <div className="form-field" style={{ gridColumn: '1 / -1' }}>
              <label>New action</label>
              <input value={newAction.description} onChange={(e) => setNewAction({ ...newAction, description: e.target.value })} placeholder="What needs doing" required />
            </div>
            <div className="form-field">
              <label>Owner</label>
              <select value={newAction.ownerId} onChange={(e) => setNewAction({ ...newAction, ownerId: e.target.value })}>
                <option value="">No owner</option>
                {staff.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </div>
            <div className="form-field">
              <label>Due date</label>
              <input type="date" value={newAction.dueDate} onChange={(e) => setNewAction({ ...newAction, dueDate: e.target.value })} />
            </div>
            <div className="form-field">
              <button type="submit" className="btn btn-primary">Add action</button>
            </div>
          </form>
        )}
      </div>
    </div>
  );
}

function FleetManagement() {

  const [summary, setSummary] = useState(null);
  const [vehicles, setVehicles] = useState([]);
  const [checks, setChecks] = useState([]);
  const [defects, setDefects] = useState([]);
  const [showArchived, setShowArchived] = useState(false);
  const [defectFilter, setDefectFilter] = useState('OPEN');
  const [checkVehicle, setCheckVehicle] = useState('');
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [editing, setEditing] = useState(null); // vehicle object, or 'new'
  const [viewingCheck, setViewingCheck] = useState(null);
  const [resolving, setResolving] = useState(null);
  const [addingDefect, setAddingDefect] = useState(false);
  const [copied, setCopied] = useState(false);

  const checkFormUrl = `${window.location.origin}/vdi`;

  function loadAll() {
    setError('');
    return Promise.all([
      api.getFleetSummary().then(setSummary),
      api.listVehicles(showArchived).then(setVehicles),
      api.listVdiChecks(checkVehicle || undefined).then(setChecks),
      api.listDefects(defectFilter || undefined).then(setDefects),
    ])
      .catch((err) => setError(err.message || 'Failed to load fleet data'))
      .finally(() => setLoading(false));
  }

  useEffect(() => {
    loadAll();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [showArchived, defectFilter, checkVehicle]);

  async function reopenDefect(d) {
    try {
      await api.updateDefect(d.id, { status: 'OPEN' });
      await loadAll();
    } catch (err) {
      setError(err.message || 'Failed to reopen defect');
    }
  }

  function copyLink() {
    navigator.clipboard?.writeText(checkFormUrl).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });
  }

  if (loading) return <div className="page-loading">Loading…</div>;

  const activeVehicles = vehicles.filter((v) => v.active);

  return (
    <div>
      <div className="page-header">
        <div>
          <h1>Fleet Management</h1>
          <div className="page-sub">Vehicles, key dates and crew daily inspections</div>
        </div>
        <div className="page-header-actions">
          <button className="btn btn-ghost" onClick={() => setAddingDefect(true)} disabled={!activeVehicles.length}>Report defect</button>
          <button className="btn btn-primary" onClick={() => setEditing('new')}>+ Add vehicle</button>
        </div>
      </div>

      {error && <div className="error-banner" style={{ marginBottom: 12 }}>{error}</div>}

      {summary && (
        <div className="kpi-grid">
          <div className={'kpi-card ' + (summary.offRoad ? 'kpi-card-amber' : 'kpi-card-green')}>
            <div className="kpi-value">{summary.available}/{summary.vehicles}</div>
            <div className="kpi-label">Vehicles available</div>
            <div className="kpi-sub">{summary.offRoad} off road or in maintenance</div>
          </div>
          <div className={'kpi-card ' + (summary.openDefects ? 'kpi-card-red' : 'kpi-card-green')}>
            <div className="kpi-value">{summary.openDefects}</div>
            <div className="kpi-label">Open defects</div>
            <div className="kpi-sub">Reported on checks or by managers</div>
          </div>
          <div className={'kpi-card ' + (summary.notCheckedToday ? 'kpi-card-amber' : 'kpi-card-green')}>
            <div className="kpi-value">{summary.checksToday}</div>
            <div className="kpi-label">Daily checks today</div>
            <div className="kpi-sub">{summary.notCheckedToday} available vehicle{summary.notCheckedToday === 1 ? '' : 's'} not yet checked</div>
          </div>
          <div className={'kpi-card ' + (summary.overdueItems ? 'kpi-card-red' : summary.dueSoonItems ? 'kpi-card-amber' : 'kpi-card-green')}>
            <div className="kpi-value">{summary.overdueItems}</div>
            <div className="kpi-label">Overdue MOT / service / insurance / tax</div>
            <div className="kpi-sub">{summary.dueSoonItems} due in the next 30 days</div>
          </div>
        </div>

      <div className="card" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap' }}>
        <div>
          <div style={{ fontWeight: 700 }}>Crew daily check form</div>
          <div className="muted" style={{ fontStyle: 'normal', fontSize: 13 }}>
            Crews open this link (no login) to complete a vehicle daily inspection. Use Print QR codes to make a code for each vehicle; scanning it opens the form with that vehicle already selected.
          </div>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <code style={{ background: '#f1f5f9', border: '1px solid var(--border)', borderRadius: 4, padding: '4px 8px', fontSize: 13 }}>{checkFormUrl}</code>
          <button type="button" className="btn btn-ghost btn-sm" onClick={copyLink}>{copied ? 'Copied' : 'Copy link'}</button>
          <a className="btn btn-ghost btn-sm" href="/vdi" target="_blank" rel="noopener" style={{ textDecoration: 'none' }}>Open</a>
          <a className="btn btn-primary btn-sm" href="/fleet/qr" target="_blank" rel="noopener" style={{ textDecoration: 'none' }}>Print QR codes</a>
        </div>
      </div>

      <div className="tabs">
        <button className={'tab-btn' + (tab === 'vehicles' ? ' active' : '')} onClick={() => setTab('vehicles')}>Vehicles</button>
        <button className={'tab-btn' + (tab === 'checks' ? ' active' : '')} onClick={() => setTab('checks')}>Daily checks</button>
        <button className={'tab-btn' + (tab === 'defects' ? ' active' : '')} onClick={() => setTab('defects')}>
          Defects{summary?.openDefects ? ` (${summary.openDefects})` : ''}
        </button>
      </div>

      {tab === 'vehicles' && (
        <div className="card table-card">
          <div style={{ padding: '10px 16px', display: 'flex', justifyContent: 'flex-end' }}>
            <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13 }}>
              <input type="checkbox" checked={showArchived} onChange={(e) => setShowArchived(e.target.checked)} />
              Show archived vehicles
            </label>
          </div>
          {vehicles.length === 0 ? (
            <div className="empty">No vehicles yet. Use “+ Add vehicle” to add your fleet.</div>
          ) : (
            <div style={{ overflowX: 'auto' }}>
              <table className="table">
                <thead>
                  <tr>
                    <th>Vehicle</th>
                    <th>Status</th>
                    <th>Last daily check</th>
                    <th>Open defects</th>
                    {DUE_FIELDS.map((f) => <th key={f.key}>{f.label}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {vehicles.map((v) => (
                    <tr key={v.id} className="row-clickable" onClick={() => setEditing(v)} style={v.active ? undefined : { opacity: 0.55 }}>
                      <td>
                        <div className="ref-link">{v.reg}</div>
                        <div className="muted" style={{ fontSize: 12 }}>
                          {[v.callSign, v.vehicleType, v.makeModel].filter(Boolean).join(' · ') || '—'}
                          {!v.active ? ' · archived' : ''}
                        </div>
                      </td>
                      <td><span className={'badge ' + (VEHICLE_STATUS_BADGE[v.status] || 'badge-grey')}>{VEHICLE_STATUS_LABELS[v.status] || v.status}</span></td>
                      <td>{lastCheckLabel(v)}</td>
                      <td>{v.openDefects ? <span className="badge badge-red">{v.openDefects}</span> : <span className="muted">None</span>}</td>
                      {DUE_FIELDS.map((f) => <td key={f.key}><DueCell date={v[f.key]} status={v[f.status]} /></td>)}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {tab === 'checks' && (
        <div className="card table-card">
          <div style={{ padding: '10px 16px', display: 'flex', justifyContent: 'flex-end' }}>
            <select value={checkVehicle} onChange={(e) => setCheckVehicle(e.target.value)}>
              <option value="">All vehicles</option>
              {vehicles.map((v) => <option key={v.id} value={v.id}>{v.reg}{v.callSign ? ` — ${v.callSign}` : ''}</option>)}
            </select>
          </div>
          {checks.length === 0 ? (
            <div className="empty">No daily checks submitted yet.</div>
          ) : (
            <table className="table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Vehicle</th>
                  <th>Checked by</th>
                  <th>Mileage</th>
                  <th>Result</th>
                </tr>
              </thead>
              <tbody>
                {checks.map((c) => (
                  <tr key={c.id} className="row-clickable" onClick={() => setViewingCheck(c)}>
                    <td>{fmtDate(c.createdAt)} {fmtTime(c.createdAt)}</td>
                    <td><span className="ref-link">{c.vehicleReg}</span>{c.callSign ? <span className="muted"> · {c.callSign}</span> : null}</td>
                    <td>{c.checkedBy || '—'}</td>
                    <td>{c.mileage != null ? Number(c.mileage).toLocaleString('en-GB') : '—'}</td>
                    <td>
                      {c.defectCount > 0
                        ? <span className="badge badge-red">{c.defectCount} defect{c.defectCount === 1 ? '' : 's'}</span>
                        : <span className="badge badge-green">Passed</span>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}

      {tab === 'defects' && (
        <div className="card table-card">
          <div style={{ padding: '10px 16px', display: 'flex', justifyContent: 'flex-end' }}>
            <select value={defectFilter} onChange={(e) => setDefectFilter(e.target.value)}>
              <option value="OPEN">Open defects</option>
              <option value="RESOLVED">Resolved defects</option>
              <option value="">All defects</option>
            </select>
          </div>
          {defects.length === 0 ? (
            <div className="empty">{defectFilter === 'OPEN' ? 'No open defects.' : 'No defects to show.'}</div>
          ) : (
            <table className="table">
              <thead>
                <tr>
                  <th>Reported</th>
                  <th>Vehicle</th>
                  <th>Defect</th>
                  <th>Status</th>
                  <th className="actions-cell"></th>
                </tr>
              </thead>
              <tbody>
                {defects.map((d) => (
                  <tr key={d.id}>
                    <td>
                      {shortDateStr(d.reportedAt)}
                      <div className="muted" style={{ fontSize: 12 }}>{d.reportedBy || ''}</div>
                    </td>
                    <td><span className="ref-link">{d.vehicleReg}</span>{d.callSign ? <span className="muted"> · {d.callSign}</span> : null}</td>
                    <td>
                      <div style={{ fontWeight: 600 }}>{d.item}</div>
                      {d.description && <div style={{ fontSize: 13, marginTop: 2 }}>{d.description}</div>}
                      {d.status === 'RESOLVED' && (
                        <div className="muted" style={{ fontSize: 12, marginTop: 4 }}>
                          Resolved {shortDateStr(d.resolvedAt)}{d.resolvedByName ? ` by ${d.resolvedByName}` : ''}{d.resolutionNotes ? ` — ${d.resolutionNotes}` : ''}
                        </div>
                      )}
                    </td>
                    <td><span className={'badge ' + (d.status === 'OPEN' ? 'badge-red' : 'badge-green')}>{d.status === 'OPEN' ? 'Open' : 'Resolved'}</span></td>
                    <td className="actions-cell">
                      {d.status === 'OPEN'
                        ? <button type="button" className="btn btn-primary btn-sm" onClick={() => setResolving(d)}>Resolve</button>
                        : <button type="button" className="btn btn-ghost btn-sm" onClick={() => reopenDefect(d)}>Reopen</button>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}

      {editing && (
        <VehicleModal
          vehicle={editing === 'new' ? null : editing}
          onClose={() => setEditing(null)}
          onSaved={() => { setEditing(null); loadAll(); }}
        />
      )}
      {viewingCheck && <CheckDetailModal check={viewingCheck} onClose={() => setViewingCheck(null)} />}
      {resolving && (
        <ResolveDefectModal
          defect={resolving}
          onClose={() => setResolving(null)}
          onSaved={() => { setResolving(null); loadAll(); }}
        />
      )}
      {addingDefect && (
        <AddDefectModal
          vehicles={activeVehicles}
          onClose={() => setAddingDefect(false)}
          onSaved={() => { setAddingDefect(false); setTab('defects'); setDefectFilter('OPEN'); loadAll(); }}
        />
      )}
    </div>
  );
}

// Public, no-login vehicle daily inspection form (QR code in each vehicle).
function PublicVdi() {
  const [setup, setSetup] = useState(null);
  const [vehicleId, setVehicleId] = useState('');
  const [checkedBy, setCheckedBy] = useState('');
  const [mileage, setMileage] = useState('');
  const [answers, setAnswers] = useState({}); // item -> { ok, note }
  const [notes, setNotes] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(null);

  useEffect(() => {
    api.getVdiSetup().then((s) => {
      setSetup(s);
      const params = new URLSearchParams(window.location.search);
      const reg = (params.get('reg') || '').replace(/\s/g, '').toUpperCase();
      const match = reg && s.vehicles.find((v) => v.reg.replace(/\s/g, '').toUpperCase() === reg);
      if (match) setVehicleId(String(match.id));
    }).catch((err) => setError(err.message || 'Could not load the check form'));
  }, []);

  const allItems = setup ? setup.checklist.flatMap((s) => s.items) : [];
  const answered = allItems.filter((i) => answers[i]?.ok !== undefined).length;
  const failed = allItems.filter((i) => answers[i]?.ok === false);

  function answer(item, ok) {
    setAnswers((a) => ({ ...a, [item]: { ok, note: ok ? '' : (a[item]?.note || '') } }));
  }
  function setNote(item, note) {
    setAnswers((a) => ({ ...a, [item]: { ...(a[item] || { ok: false }), note } }));
  }
  function markRemainingOk() {
    setAnswers((a) => {
      const next = { ...a };
      allItems.forEach((i) => { if (next[i]?.ok === undefined) next[i] = { ok: true, note: '' }; });
      return next;
    });
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    if (answered < allItems.length) {
      setError(`Please answer every item (${allItems.length - answered} left).`);
      return;
    }
    setBusy(true);
    try {
      const results = allItems.map((item) => ({ item, ok: answers[item].ok, note: answers[item].note || null }));
      const res = await api.submitVdi({ vehicleId: Number(vehicleId), checkedBy, mileage, results, notes });
      setDone(res);
    } catch (err) {
      setError(err.message || 'Failed to submit the check');
    } finally {
      setBusy(false);
    }
  }

  function reset() {
    setVehicleId('');
    setMileage('');
    setAnswers({});
    setNotes('');
    setDone(null);
    setError('');
  }

  const brand = (
    <div className="public-report-brand">
      <div className="brand-icon brand-icon-light">
        <span className="brand-icon-letter">D</span>
        <span className="brand-icon-dot"></span>
      </div>
      DYNAMO
    </div>
  );

  if (done) {
    return (
      <div className="public-report-page">
        <div className="public-report-card">
          {brand}
          <h1>Check submitted</h1>
          {done.defectCount > 0 ? (
            <div className="warning-banner" style={{ marginTop: 10 }}>
              {done.defectCount} defect{done.defectCount === 1 ? ' has' : 's have'} been reported on {done.vehicleReg} and managers have been told.
              If the vehicle is not safe to use, do not drive it — contact the on-call manager now.
            </div>
          ) : (
            <div className="success-banner" style={{ marginTop: 10 }}>{done.vehicleReg} passed its daily check. Thank you.</div>
          )}
          <button type="button" className="btn btn-primary" onClick={reset}>Check another vehicle</button>
        </div>
      </div>
    );
  }

  return (
    <div className="public-report-page">
      <form className="public-report-card" onSubmit={handleSubmit}>
        {brand}
        <h1>Vehicle Daily Inspection</h1>
        <div className="page-sub">Complete at the start of every shift</div>

        {error && <div className="error-banner" style={{ marginTop: 10 }}>{error}</div>}

        {!setup ? (
          <div className="page-loading">Loading…</div>
        ) : setup.vehicles.length === 0 ? (
          <div className="warning-banner" style={{ marginTop: 10 }}>No vehicles have been set up yet. Please speak to a manager.</div>
        ) : (
          <>
            <div className="form-grid">
              <div className="form-field form-field-wide">
                <label>Vehicle</label>
                <select value={vehicleId} onChange={(e) => setVehicleId(e.target.value)} required>
                  <option value="" disabled>Choose the vehicle</option>
                  {setup.vehicles.map((v) => <option key={v.id} value={v.id}>{v.callSign ? `${v.callSign} — ${v.reg}` : v.reg}</option>)}
                </select>
              </div>
              <div className="form-field">
                <label>Your name</label>
                <input value={checkedBy} onChange={(e) => setCheckedBy(e.target.value)} placeholder="e.g. A. Smith" required />
              </div>
              <div className="form-field">
                <label>Mileage</label>
                <input type="number" inputMode="numeric" min="0" value={mileage} onChange={(e) => setMileage(e.target.value)} placeholder="e.g. 45210" required />
              </div>
            </div>

            <div style={{ marginTop: 18 }}>
              {setup.checklist.map((section, si) => (
                <div key={section.section} style={si > 0 ? { marginTop: 18 } : undefined}>
                  <div className="vdi-section-title">{section.section}</div>
                  {section.items.map((item) => {
                    const a = answers[item];
                    return (
                      <div key={item} style={{ padding: '8px 0', borderBottom: '1px solid var(--border)' }}>
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10 }}>
                          <span className="vdi-item-label">{item}</span>
                          <span style={{ display: 'flex', gap: 6, flexShrink: 0 }}>
                            <button
                              type="button"
                              className="btn btn-sm"
                              style={a?.ok === true ? { background: 'var(--green)', color: '#fff' } : { background: '#fff', border: '1px solid var(--border)' }}
                              onClick={() => answer(item, true)}
                            >
                              OK
                            </button>
                            <button
                              type="button"
                              className="btn btn-sm"
                              style={a?.ok === false ? { background: 'var(--red)', color: '#fff' } : { background: '#fff', border: '1px solid var(--border)' }}
                              onClick={() => answer(item, false)}
                            >
                              Defect
                            </button>
                          </span>
                        </div>
                        {a?.ok === false && (
                          <input
                            style={{ width: '100%', marginTop: 8 }}
                            value={a.note || ''}
                            onChange={(e) => setNote(item, e.target.value)}
                            placeholder="Describe the problem"
                            required
                          />
                        )}
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>

            {answered < allItems.length && (
              <button type="button" className="btn btn-ghost btn-sm" style={{ marginTop: 10, alignSelf: 'flex-start' }} onClick={markRemainingOk}>
                Mark the remaining {allItems.length - answered} item{allItems.length - answered === 1 ? '' : 's'} as OK
              </button>
            )}

            <div className="form-field form-field-wide" style={{ marginTop: 14 }}>
              <label>Anything else to report? (optional)</label>
              <textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={3} />
            </div>

            <div className="muted" style={{ fontSize: 13, margin: '10px 0' }}>
              {answered}/{allItems.length} items checked{failed.length ? ` · ${failed.length} defect${failed.length === 1 ? '' : 's'}` : ''}
            </div>

            <button type="submit" className="btn btn-primary" disabled={busy}>
              {busy ? 'Submitting…' : 'Submit check'}
            </button>
          </>
        )}
      </form>
    </div>
  );
}

// Crew drug bag sign out / sign in (QR code, no login).
function PublicDrugBag() {
  const [setup, setSetup] = useState(null);
  const [mode, setMode] = useState('out'); // 'out' | 'in'
  const [bagId, setBagId] = useState('');
  const [name, setName] = useState('');
  const [secondCrew, setSecondCrew] = useState('');
  const [vehicleId, setVehicleId] = useState('');
  const [callSign, setCallSign] = useState('');
  const [sealColour, setSealColour] = useState('');
  const [deployment, setDeployment] = useState('');
  const [eventName, setEventName] = useState('');
  const [sealIntact, setSealIntact] = useState('');
  const [drugsUsed, setDrugsUsed] = useState('');
  const [notes, setNotes] = useState('');
  const [confirmed, setConfirmed] = useState(false);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(null);

  function load(preselect) {
    return api.getPublicBagSetup().then((s) => {
      setSetup(s);
      if (preselect) {
        const params = new URLSearchParams(window.location.search);
        const key = (params.get('bag') || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
        const match = key && s.bags.find((b) => b.bagNumber.replace(/[^A-Za-z0-9]/g, '').toUpperCase() === key);
        if (match) {
          setBagId(String(match.id));
          if (match.state === 'SIGNED_OUT') setMode('in');
        }
      }
    }).catch((err) => setError(err.message || 'Could not load the form'));
  }
  useEffect(() => { load(true); }, []);

  const bags = setup ? setup.bags : [];
  const selected = bags.find((b) => String(b.id) === bagId) || null;
  const choices = bags.filter((b) => (mode === 'out' ? b.state === 'AVAILABLE' : b.state === 'SIGNED_OUT'));

  function switchMode(m) {
    setMode(m);
    setError('');
    if (selected && ((m === 'out' && selected.state !== 'AVAILABLE') || (m === 'in' && selected.state !== 'SIGNED_OUT'))) setBagId('');
  }

  function chooseVehicle(value) {
    setVehicleId(value);
    const v = setup.vehicles.find((x) => String(x.id) === value);
    if (v?.callSign && !callSign) setCallSign(v.callSign);
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    setBusy(true);
    try {
      if (!sealColour) throw new Error('Choose the seal colour (green or yellow).');
      if (mode === 'out' && !deployment) throw new Error('Choose Events or Frontline.');
      const res = mode === 'out'
        ? await api.publicBagSignOut({ bagId: Number(bagId), signedOutTo: name, secondCrew, vehicleId: vehicleId || null, callSign, sealColour, deployment, eventName })
        : await api.publicBagSignIn({ bagId: Number(bagId), returnedBy: name, sealColour, sealIntact: sealIntact === 'YES', drugsUsed: drugsUsed === 'YES', notes });
      setDone(res);
    } catch (err) {
      setError(err.message || 'Something went wrong — please try again');
    } finally {
      setBusy(false);
    }
  }

  function reset() {
    setBagId(''); setSealColour(''); setDeployment(''); setEventName(''); setSealIntact(''); setDrugsUsed(''); setNotes(''); setConfirmed(false);
    setVehicleId(''); setCallSign(''); setSecondCrew(''); setDone(null); setError('');
    load(false);
  }

  const brand = (
    <div className="public-report-brand">
      <div className="brand-icon brand-icon-light">
        <span className="brand-icon-letter">D</span>
        <span className="brand-icon-dot"></span>
      </div>
      DYNAMO
    </div>
  );

  if (done) {
    return (
      <div className="public-report-page">
        <div className="public-report-card">
          {brand}
          <h1>{done.action === 'SIGNED_OUT' ? 'Bag signed out' : 'Bag signed in'}</h1>
          {done.action === 'SIGNED_OUT' && (
            <div className="success-banner" style={{ marginTop: 10 }}>Drug bag {done.bagNumber} is signed out to you. Sign it back in with this form when you return it.</div>
          )}
          {done.action === 'RETURNED' && !done.needsRestock && (
            <div className="success-banner" style={{ marginTop: 10 }}>Drug bag {done.bagNumber} is signed back in. Thank you.</div>
          )}
          {done.action === 'RETURNED' && done.needsRestock && (
            <div className="warning-banner" style={{ marginTop: 10 }}>
              Drug bag {done.bagNumber} is signed back in and marked for restock / check. Managers have been told.
              {done.sealMismatch ? ' The seal colour is different from the one it went out with.' : ''} Hand it to a manager or put it in the restock area.
            </div>
          )}
          <button type="button" className="btn btn-primary" onClick={reset}>Done — another bag</button>
        </div>
      </div>
    );
  }

  return (
    <div className="public-report-page">
      <form className="public-report-card" onSubmit={handleSubmit}>
        {brand}
        <h1>Drug bag sign out / sign in</h1>
        <div className="page-sub">Record every drug bag you take or return</div>

        <div style={{ display: 'flex', gap: 8, marginTop: 14 }}>
          <button type="button" className={'btn ' + (mode === 'out' ? 'btn-primary' : 'btn-ghost')} style={{ flex: 1 }} onClick={() => switchMode('out')}>Sign out a bag</button>
          <button type="button" className={'btn ' + (mode === 'in' ? 'btn-primary' : 'btn-ghost')} style={{ flex: 1 }} onClick={() => switchMode('in')}>Sign in (return) a bag</button>
        </div>

        {error && <div className="error-banner" style={{ marginTop: 10 }}>{error}</div>}

        {!setup ? <div className="page-loading">Loading…</div> : (
          <div className="form-grid" style={{ marginTop: 12 }}>
            <div className="form-field form-field-wide" style={{ gridColumn: '1 / -1' }}>
              <label>Drug bag number</label>
              <select value={bagId} onChange={(e) => setBagId(e.target.value)} required>
                <option value="" disabled>{choices.length ? 'Choose the bag' : mode === 'out' ? 'No bags available to sign out' : 'No bags are signed out'}</option>
                {choices.map((b) => <option key={b.id} value={b.id}>{b.bagNumber}{b.bagType ? ` — ${b.bagType}` : ''}</option>)}
              </select>
              {selected && selected.state === 'UNAVAILABLE' && (
                <div style={{ fontSize: 13, marginTop: 4, color: 'var(--red)' }}>Bag {selected.bagNumber} can't be used: {selected.unavailableReason}. Speak to a manager.</div>
              )}
            </div>
            <div className="form-field">
              <label>Your name</label>
              <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Full name" required />
            </div>
            {mode === 'out' && (
              <div className="form-field">
                <label>Crew mate (optional)</label>
                <input value={secondCrew} onChange={(e) => setSecondCrew(e.target.value)} placeholder="Full name" />
              </div>
            )}
            {mode === 'out' && (
              <div className="form-field">
                <label>Vehicle</label>
                <select value={vehicleId} onChange={(e) => chooseVehicle(e.target.value)}>
                  <option value="">Not on a vehicle</option>
                  {setup.vehicles.map((v) => <option key={v.id} value={v.id}>{v.callSign ? `${v.callSign} — ${v.reg}` : v.reg}</option>)}
                </select>
              </div>
            )}
            {mode === 'out' && (
              <div className="form-field">
                <label>Call sign</label>
                <input value={callSign} onChange={(e) => setCallSign(e.target.value)} />
              </div>
            )}
            {mode === 'out' && (
              <DeploymentPicker value={deployment} onChange={setDeployment} eventName={eventName} onEventName={setEventName} />
            )}
            <div className="form-field" style={{ gridColumn: '1 / -1' }}>
              <SealColourPicker value={sealColour} onChange={setSealColour} label="Seal colour on the bag" />
            </div>
            {mode === 'in' && (
              <>
                <div className="form-field">
                  <label>Is the seal intact?</label>
                  <select value={sealIntact} onChange={(e) => setSealIntact(e.target.value)} required>
                    <option value="" disabled>Select</option>
                    <option value="YES">Yes — intact</option>
                    <option value="NO">No — broken or missing</option>
                  </select>
                </div>
                <div className="form-field">
                  <label>Did you use anything from the bag?</label>
                  <select value={drugsUsed} onChange={(e) => setDrugsUsed(e.target.value)} required>
                    <option value="" disabled>Select</option>
                    <option value="NO">No</option>
                    <option value="YES">Yes</option>
                  </select>
                </div>
                <div className="form-field form-field-wide" style={{ gridColumn: '1 / -1' }}>
                  <label>{drugsUsed === 'YES' ? 'What was used, and the incident / patient record reference' : 'Notes (optional)'}</label>
                  <textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={3} required={drugsUsed === 'YES'} />
                </div>
              </>
            )}
            {mode === 'out' && (
              <div className="form-field form-field-wide" style={{ gridColumn: '1 / -1' }}>
                <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontWeight: 400 }}>
                  <input type="checkbox" checked={confirmed} onChange={(e) => setConfirmed(e.target.checked)} required />
                  I've checked the seal is intact.
                </label>
              </div>
            )}
          </div>
        )}

        {setup && (
          <button type="submit" className="btn btn-primary" disabled={busy || !bagId} style={{ marginTop: 12 }}>
            {busy ? 'Saving…' : mode === 'out' ? 'Sign out bag' : 'Sign in bag'}
          </button>
        )}
        <div className="muted" style={{ fontSize: 12, marginTop: 10 }}>
          Your name and what you record are kept with the bag's history. See the <a href="/privacy" target="_blank" rel="noopener">privacy notice</a>.
        </div>
      </form>
    </div>
  );
}

function AdminRoute({ children }) {
  const { user } = useAuth();
  if (!isMgrOrAdmin(user?.role)) return <Navigate to="/incidents" replace />;
  return children;
}

function PrivateRoute({ children }) {
  const { user, loading } = useAuth();
  if (loading) return <div className="page-loading">Loading…</div>;
  if (!user) return <Navigate to="/login" replace />;
  return children;
}

function AppRoutes() {
  return (
    <Routes>
      <Route path="/login" element={<Login />} />
      <Route path="/report" element={<PublicReport />} />
      <Route path="/vdi" element={<PublicVdi />} />
      <Route path="/drug-bag" element={<PublicDrugBag />} />
      <Route
        path="/*"
        element={
          <PrivateRoute>
            <Layout>
              <Routes>
                <Route path="/" element={<Navigate to="/dashboard" replace />} />
                <Route path="/dashboard" element={<Dashboard />} />
                <Route path="/incidents" element={<Incidents />} />
                <Route path="/actions" element={<AdminRoute><Actions /></AdminRoute>} />
                <Route path="/safety-alerts" element={<SafetyAlerts />} />
                <Route path="/fleet" element={<AdminRoute><FleetManagement /></AdminRoute>} />
                <Route path="/medication" element={<AdminRoute><Medication /></AdminRoute>} />
                <Route path="/medication-store" element={<AdminRoute><MedicationStore /></AdminRoute>} />
                <Route path="/medication-dashboard" element={<AdminRoute><MedicationDashboard /></AdminRoute>} />
                <Route path="/meetings/:type" element={<AdminRoute><MeetingsList /></AdminRoute>} />
                <Route path="/meetings/:type/:id" element={<AdminRoute><MeetingEditor /></AdminRoute>} />
                <Route path="/staff" element={<AdminRoute><Staff /></AdminRoute>} />
                <Route path="/case-notes" element={<AdminRoute><CaseNotes /></AdminRoute>} />
                <Route path="/datix" element={<AdminRoute><DatixDocuments /></AdminRoute>} />
                <Route path="/datix-dashboard" element={<AdminRoute><DatixDashboard /></AdminRoute>} />
                <Route path="/settings" element={<Settings />} />
                <Route path="*" element={<Navigate to="/dashboard" replace />} />
              </Routes>
            </Layout>
          </PrivateRoute>
        }
      />
    </Routes>
  );
}

function App() {
  return (
    <AuthProvider>
      <AppRoutes />
    </AuthProvider>
  );
}



ReactDOM.createRoot(document.getElementById('root')).render(
  <React.StrictMode>
    <BrowserRouter>
      <App />
    </BrowserRouter>
  </React.StrictMode>
);

    </script>
  </body>
</html>
