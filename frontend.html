const MAX_PHOTOS = 6;
const MAX_PHOTO_SIZE = 20 * 1024 * 1024; // 20MB, matches the server-side limit

// Crews often submit from a moving vehicle or a weak-signal scene, and a raw
// phone photo can be 10-20MB. Uploading several of those over a slow mobile
// connection was timing out mid-request ("Failed to fetch") before the
// upload ever finished. Shrinking each photo in the browser first — down to
// a max dimension and a JPEG quality that still shows the damage/scene
// clearly — cuts a typical photo to under ~1-2MB, so the whole submission
// finishes in a few seconds even on a poor connection.
const MAX_PHOTO_DIMENSION = 1600;
const PHOTO_JPEG_QUALITY = 0.75;

function compressPhoto(file) {
  // Only touch real camera/image files; anything else (or anything that
  // fails to decode) is sent through unchanged rather than blocked.
  if (!file.type || !file.type.startsWith('image/')) return Promise.resolve(file);

  return new Promise((resolve) => {
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(objectUrl);
      const scale = Math.min(1, MAX_PHOTO_DIMENSION / Math.max(img.width, img.height));
      const width = Math.round(img.width * scale);
      const height = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob(
        (blob) => {
          if (!blob || blob.size >= file.size) {
            // Compression didn't help (already small, or a format canvas
            // re-encodes poorly) — keep the original rather than risk a
            // worse result.
            resolve(file);
            return;
          }
          const compressed = new File(
            [blob],
            file.name.replace(/\.\w+$/, '') + '.jpg',
            { type: 'image/jpeg', lastModified: Date.now() }
          );
          resolve(compressed);
        },
        'image/jpeg',
        PHOTO_JPEG_QUALITY
      );
    };
    img.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      resolve(file); // not a decodable image — send as-is
    };
    img.src = objectUrl;
  });
}

// The date/time inputs should default to the reporter's own local time (e.g.
// BST in the UK in summer), not UTC — new Date().toISOString() always returns
// UTC ("GMT"), which is an hour behind local time whenever the clocks are
// forward. These build the default strings from the Date object's local
// getters instead.
function localDateStr(d) {
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}
function localTimeStr(d) {
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${hh}:${mi}`;
}

function PublicReport() {
  const [occurredDate, setOccurredDate] = useState(localDateStr(new Date()));
  const [occurredTime, setOccurredTime] = useState(localTimeStr(new Date()));
  const [vehicleReg, setVehicleReg] = useState('');
  const [cadRef, setCadRef] = useState('');
  const [callSign, setCallSign] = useState('');
  const [crew1Name, setCrew1Name] = useState('');
  const [crew1Grade, setCrew1Grade] = useState('');
  const [crew2Name, setCrew2Name] = useState('');
  const [crew2Grade, setCrew2Grade] = useState('');
  const [category, setCategory] = useState(INCIDENT_CATEGORIES[0]);
  const [anonymous, setAnonymous] = useState(false);
  const [reporterEmail, setReporterEmail] = useState('');
  const [notifiedBy, setNotifiedBy] = useState('');
  const [onCallManagerInformed, setOnCallManagerInformed] = useState('');
  const [onCallManagerName, setOnCallManagerName] = useState('');
  const [onCallManagerCalledAt, setOnCallManagerCalledAt] = useState('');
  const [location, setLocation] = useState('');
  const [description, setDescription] = useState('');
  const [photos, setPhotos] = useState([]);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const [processingPhotos, setProcessingPhotos] = useState(false);
  const [submittedRef, setSubmittedRef] = useState('');

  function resetForm() {
    setOccurredDate(localDateStr(new Date()));
    setOccurredTime(localTimeStr(new Date()));
    setVehicleReg('');
    setCadRef('');
    setCallSign('');
    setCrew1Name('');
    setCrew1Grade('');
    setCrew2Name('');
    setCrew2Grade('');
    setCategory(INCIDENT_CATEGORIES[0]);
    setAnonymous(false);
    setReporterEmail('');
    setNotifiedBy('');
    setOnCallManagerInformed('');
    setOnCallManagerName('');
    setOnCallManagerCalledAt('');
    setLocation('');
    setDescription('');
    setPhotos([]);
    setSubmittedRef('');
  }

  function buildCrewNames() {
    const parts = [];
    if (crew1Name.trim()) parts.push(crew1Grade.trim() ? `${crew1Name.trim()} (${crew1Grade.trim()})` : crew1Name.trim());
    if (crew2Name.trim()) parts.push(crew2Grade.trim() ? `${crew2Name.trim()} (${crew2Grade.trim()})` : crew2Name.trim());
    return parts.join(', ');
  }

  async function addPhotos(e) {
    const picked = Array.from(e.target.files || []);
    e.target.value = ''; // allow picking the same file again after removing it
    if (!picked.length) return;
    setError('');
    setProcessingPhotos(true);
    try {
      const compressed = await Promise.all(picked.map(compressPhoto));
      const oversized = compressed.find((f) => f.size > MAX_PHOTO_SIZE);
      if (oversized) {
        setError(`"${oversized.name}" is too large — photos must be under 20MB`);
        return;
      }
      setPhotos((prev) => {
        const combined = [...prev, ...compressed];
        if (combined.length > MAX_PHOTOS) {
          setError(`You can attach up to ${MAX_PHOTOS} photos`);
          return combined.slice(0, MAX_PHOTOS);
        }
        return combined;
      });
    } finally {
      setProcessingPhotos(false);
    }
  }

  function removePhoto(index) {
    setPhotos((prev) => prev.filter((_, i) => i !== index));
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    setBusy(true);
    try {
      const occurredAt = new Date(`${occurredDate}T${occurredTime}:00`).toISOString();
      const isAnonymous = category === 'NEAR_MISS' && anonymous;
      const form = new FormData();
      form.append('occurredAt', occurredAt);
      form.append('vehicleReg', vehicleReg);
      form.append('cadRef', cadRef);
      form.append('callSign', callSign);
      form.append('crewNames', buildCrewNames());
      form.append('category', category);
      form.append('anonymous', String(isAnonymous));
      form.append('reporterEmail', isAnonymous ? '' : reporterEmail);
      form.append('notifiedBy', notifiedBy);
      form.append('onCallManagerInformed', String(onCallManagerInformed === 'YES'));
      form.append('onCallManagerName', onCallManagerName);
      form.append('onCallManagerCalledAt', onCallManagerCalledAt);
      form.append('location', location);
      form.append('description', description);
      for (const photo of photos) form.append('photos', photo);
      const result = await api.createPublicIncident(form);
      setSubmittedRef(result.ref);
    } catch (err) {
      setError(err.message || 'Failed to submit incident report');
    } finally {
      setBusy(false);
    }
  }

  if (submittedRef) {
    return (
      <div className="public-report-page">
        <div className="public-report-card">
          <div className="public-report-brand">
            <div className="brand-icon brand-icon-light">
              <span className="brand-icon-letter">D</span>
              <span className="brand-icon-dot"></span>
            </div>
            DYNAMO
          </div>
          <h1>Report submitted</h1>
          <p>Thank you — your incident report has been logged.</p>
          <div className="public-report-ref">{submittedRef}</div>
          <p className="muted">Please make a note of this reference for your records.</p>
          <button type="button" className="btn btn-primary" onClick={resetForm}>Submit another report</button>
        </div>
      </div>
    );
  }

  return (
    <div className="public-report-page">
      <form className="public-report-card" onSubmit={handleSubmit}>
        <div className="public-report-brand">
          <div className="brand-icon brand-icon-light">
            <span className="brand-icon-letter">D</span>
            <span className="brand-icon-dot"></span>
          </div>
          DYNAMO
        </div>
        <h1>Incident Report</h1>
        <div className="page-sub">Investigation response form</div>

        {error && <div className="error-banner">{error}</div>}

        <div className="form-grid">
          <div className="form-field form-field-wide">
            <label>Name of person reporting</label>
            <input value={notifiedBy} onChange={(e) => setNotifiedBy(e.target.value)} placeholder="e.g. A. Smith" required />
          </div>

          <div className="form-field">
            <label>Date of incident</label>
            <input type="date" value={occurredDate} onChange={(e) => setOccurredDate(e.target.value)} required />
          </div>
          <div className="form-field">
            <label>Time</label>
            <input type="time" value={occurredTime} onChange={(e) => setOccurredTime(e.target.value)} required />
          </div>

          <div className="form-field">
            <label>Vehicle registration</label>
            <input value={vehicleReg} onChange={(e) => setVehicleReg(e.target.value)} placeholder="e.g. AB12 CDE" required />
          </div>
          <div className="form-field">
            <label>CAD Ref (if applicable)</label>
            <input value={cadRef} onChange={(e) => setCadRef(e.target.value)} />
          </div>

          <div className="form-field">
            <label>Call sign</label>
            <input value={callSign} onChange={(e) => setCallSign(e.target.value)} required />
          </div>
          <div className="form-field">
            <label>Incident type</label>
            <select
              value={category}
              onChange={(e) => { setCategory(e.target.value); if (e.target.value !== 'NEAR_MISS') setAnonymous(false); }}
              required
            >
              {INCIDENT_CATEGORIES.map((c) => <option key={c} value={c}>{CATEGORY_LABELS[c] || c}</option>)}
            </select>
          </div>

          {category === 'NEAR_MISS' && (
            <div className="form-field form-field-wide">
              <label>&nbsp;</label>
              <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontWeight: 400 }}>
                <input type="checkbox" checked={anonymous} onChange={(e) => setAnonymous(e.target.checked)} />
                Report this near miss anonymously (your email will not be recorded)
              </label>
            </div>
          )}

          <div className="form-field">
            <label>Crew member 1 — name</label>
            <input value={crew1Name} onChange={(e) => setCrew1Name(e.target.value)} placeholder="e.g. A. Smith" />
          </div>
          <div className="form-field">
            <label>Crew member 1 — grade</label>
            <input value={crew1Grade} onChange={(e) => setCrew1Grade(e.target.value)} placeholder="e.g. PARA" />
          </div>

          <div className="form-field">
            <label>Crew member 2 — name</label>
            <input value={crew2Name} onChange={(e) => setCrew2Name(e.target.value)} placeholder="e.g. B. Jones" />
          </div>
          <div className="form-field">
            <label>Crew member 2 — grade</label>
            <input value={crew2Grade} onChange={(e) => setCrew2Grade(e.target.value)} placeholder="e.g. ECA" />
          </div>

          {!(category === 'NEAR_MISS' && anonymous) && (
            <div className="form-field">
              <label>Email address</label>
              <input type="email" value={reporterEmail} onChange={(e) => setReporterEmail(e.target.value)} required placeholder="you@example.com" />
            </div>
          )}
          <div className="form-field">
            <label>Was the on-call manager informed?</label>
            <select
              value={onCallManagerInformed}
              onChange={(e) => {
                setOnCallManagerInformed(e.target.value);
                if (e.target.value === 'NO') {
                  setOnCallManagerName('');
                  setOnCallManagerCalledAt('');
                }
              }}
              required
            >
              <option value="" disabled>Select an answer</option>
              <option value="YES">Yes</option>
              <option value="NO">No</option>
            </select>
          </div>
          {onCallManagerInformed === 'YES' && (
            <>
              <div className="form-field">
                <label>Name of on-call manager</label>
                <input value={onCallManagerName} onChange={(e) => setOnCallManagerName(e.target.value)} placeholder="e.g. Jordan Lee" />
              </div>
              <div className="form-field">
                <label>Time called</label>
                <input type="time" value={onCallManagerCalledAt} onChange={(e) => setOnCallManagerCalledAt(e.target.value)} />
              </div>
            </>
          )}

          <div className="form-field form-field-wide">
            <label>Location</label>
            <input value={location} onChange={(e) => setLocation(e.target.value)} placeholder="e.g. Luton depot" />
          </div>

          <div className="form-field form-field-wide">
            <label>Incident description</label>
            <textarea value={description} onChange={(e) => setDescription(e.target.value)} rows={6} required />
          </div>

          <div className="form-field form-field-wide">
            <label>Photos (optional)</label>
            <input
              type="file"
              accept="image/*"
              multiple
              capture="environment"
              onChange={addPhotos}
              disabled={photos.length >= MAX_PHOTOS || processingPhotos}
            />
            <div className="muted" style={{ marginTop: 4, fontSize: 13 }}>
              {processingPhotos
                ? 'Preparing photo(s) for upload…'
                : `Up to ${MAX_PHOTOS} photos — e.g. vehicle damage or the scene. Photos are shrunk automatically so they upload reliably on a weak signal.`}
            </div>
            {photos.length > 0 && (
              <ul style={{ listStyle: 'none', padding: 0, margin: '8px 0 0', display: 'flex', flexDirection: 'column', gap: 6 }}>
                {photos.map((photo, i) => (
                  <li key={`${photo.name}-${i}`} style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                      {photo.name} <span className="muted">({Math.round(photo.size / 1024)} KB)</span>
                    </span>
                    <button type="button" className="btn btn-danger btn-sm" onClick={() => removePhoto(i)}>Remove</button>
                  </li>
                ))}
              </ul>
            )}
          </div>
        </div>

        <button type="submit" className="btn btn-primary" disabled={busy || processingPhotos} style={{ marginTop: 6 }}>
          {busy ? 'Submitting…' : 'Submit report'}
        </button>
      </form>
    </div>
  );
}



const SEVERITY_ORDER = ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW'];
const SEVERITY_COLOR = { CRITICAL: '#dc2626', HIGH: '#ea580c', MEDIUM: '#d97706', LOW: '#9ca3af' };
const STATUS_ORDER = ['OPEN', 'INVESTIGATING', 'CLOSED'];
const STATUS_COLOR = { OPEN: '#dc2626', INVESTIGATING: '#d97706', CLOSED: '#16a34a' };
const RESPONSE_ORDER = ['RED', 'AMBER', 'GREEN'];
const RESPONSE_COLOR = { RED: '#dc2626', AMBER: '#d97706', GREEN: '#16a34a' };
const RESPONSE_LABEL = { RED: 'Overdue', AMBER: 'Due soon', GREEN: 'On track' };

function startOfWeek(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0, 0, 0, 0);
  return date;
}

function shortDate(d) {
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}

function DashBarRow({ label, count, max, color }) {
  const pct = max > 0 ? Math.max((count / max) * 100, count > 0 ? 3 : 0) : 0;
  return (
    <div className="dash-bar-row">
      <div className="dash-bar-label" title={label}>{label}</div>
      <div className="dash-bar-track">
        <div className="dash-bar-fill" style={{ width: `${pct}%`, background: color }} />
      </div>
      <div className="dash-bar-value">{count}</div>
    </div>
  );
}

function TrendChart({ weeks }) {
  const width = 640;
  const height = 160;
  const padLeft = 4;
  const padRight = 4;
  const padTop = 16;
  const padBottom = 26;
  const plotW = width - padLeft - padRight;
  const plotH = height - padTop - padBottom;
  const max = Math.max(1, ...weeks.map((w) => w.count));
  const step = weeks.length > 1 ? plotW / (weeks.length - 1) : 0;

  const points = weeks.map((w, idx) => {
    const x = padLeft + step * idx;
    const y = padTop + plotH - (w.count / max) * plotH;
    return { x, y, ...w };
  });

  const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const areaPath = `${linePath} L${points[points.length - 1].x.toFixed(1)},${padTop + plotH} L${points[0].x.toFixed(1)},${padTop + plotH} Z`;
  const baselineY = padTop + plotH;

  return (
    <svg viewBox={`0 0 ${width} ${height}`} className="dash-trend-svg" role="img" aria-label="Incidents reported per week, last 12 weeks">
      <line x1={padLeft} y1={baselineY} x2={width - padRight} y2={baselineY} stroke="#e5e7eb" strokeWidth="1" />
      <path d={areaPath} fill="#2563eb" opacity="0.1" />
      <path d={linePath} fill="none" stroke="#2563eb" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
      {points.map((p, i) => (
        <g key={i}>
          <circle cx={p.x} cy={p.y} r={i === points.length - 1 ? 5 : 3.5} fill="#2563eb" stroke="#fff" strokeWidth="2" />
          <title>{`${shortDate(p.weekStart)}: ${p.count} incident${p.count === 1 ? '' : 's'}`}</title>
          {i === points.length - 1 && (
            <text x={p.x} y={p.y - 12} textAnchor="end" fontSize="12" fontWeight="700" fill="#111827">{p.count}</text>
          )}
          {(i % 2 === 0 || i === points.length - 1) && (
            <text x={p.x} y={height - 6} textAnchor="middle" fontSize="10" fill="#6b7280">{shortDate(p.weekStart)}</text>
          )}
        </g>
      ))}
    </svg>
  );
}

function Dashboard() {
  const { user } = useAuth();
  const isAdmin = isMgrOrAdmin(user?.role);
  const [incidents, setIncidents] = useState([]);
  const [overdueActions, setOverdueActions] = useState([]);
  const [alertsPending, setAlertsPending] = useState(0);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    api.listIncidents().then(setIncidents).finally(() => setLoading(false));
    if (isAdmin) {
      api.listActions({ overdue: 1 }).then(setOverdueActions).catch(() => {});
    }
    api.listSafetyAlerts().then((rows) => setAlertsPending(rows.filter((a) => !a.acknowledged).length)).catch(() => {});
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  if (loading) {
    return <div className="page-loading">Loading…</div>;
  }

  const total = incidents.length;
  const open = incidents.filter((i) => i.status !== 'CLOSED').length;
  const overdue = incidents.filter((i) => i.responseStatus === 'RED').length;
  const riddorCount = incidents.filter((i) => i.riddorReportable).length;
  const cqcCount = incidents.filter((i) => i.cqcNotifiable).length;
  const now = new Date();
  const thisMonth = incidents.filter((i) => {
    const d = new Date(i.occurredAt);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  }).length;

  const categoryCounts = INCIDENT_CATEGORIES
    .map((c) => ({ key: c, label: CATEGORY_LABELS[c] || c, count: incidents.filter((i) => i.category === c).length }))
    .filter((c) => c.count > 0)
    .sort((a, b) => b.count - a.count);
  const maxCategory = Math.max(1, ...categoryCounts.map((c) => c.count));

  const severityCounts = SEVERITY_ORDER.map((s) => ({ key: s, count: incidents.filter((i) => i.severity === s).length }));
  const maxSeverity = Math.max(1, ...severityCounts.map((s) => s.count));

  const statusCounts = STATUS_ORDER.map((s) => ({ key: s, count: incidents.filter((i) => i.status === s).length }));
  const maxStatus = Math.max(1, ...statusCounts.map((s) => s.count));

  const respondable = incidents.filter((i) => i.responseStatus);
  const responseCounts = RESPONSE_ORDER.map((r) => ({ key: r, count: respondable.filter((i) => i.responseStatus === r).length }));
  const maxResponse = Math.max(1, ...responseCounts.map((r) => r.count));

  function topCounts(getKey, limit) {
    const counts = new Map();
    incidents.forEach((i) => {
      const key = getKey(i);
      if (!key) return;
      counts.set(key, (counts.get(key) || 0) + 1);
    });
    return [...counts.entries()]
      .map(([key, count]) => ({ key, count }))
      .sort((a, b) => b.count - a.count)
      .slice(0, limit);
  }
  const vehicleCounts = topCounts((i) => i.vehicleReg, 8);
  const maxVehicle = Math.max(1, ...vehicleCounts.map((c) => c.count));
  const locationCounts = topCounts((i) => i.location, 8);
  const maxLocation = Math.max(1, ...locationCounts.map((c) => c.count));

  const thisWeekStart = startOfWeek(now);
  const weeks = [];
  for (let idx = 11; idx >= 0; idx--) {
    const ws = new Date(thisWeekStart);
    ws.setDate(ws.getDate() - idx * 7);
    const we = new Date(ws);
    we.setDate(we.getDate() + 7);
    const count = incidents.filter((i) => {
      const d = new Date(i.occurredAt);
      return d >= ws && d < we;
    }).length;
    weeks.push({ weekStart: ws, count });
  }

  const recent = [...incidents]
    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
    .slice(0, 6);

  const flagged = incidents
    .filter((i) => i.riddorReportable || i.cqcNotifiable)
    .sort((a, b) => new Date(b.occurredAt) - new Date(a.occurredAt));

  return (
    <div>
      <div className="page-header">
        <h1>Dashboard</h1>
      </div>

      <div className="kpi-grid">
        <div className="kpi-card">
          <div className="kpi-value">{total}</div>
          <div className="kpi-label">Total incidents</div>
          <div className="kpi-sub">All time</div>
        </div>
        <div className="kpi-card kpi-card-amber">
          <div className="kpi-value">{open}</div>
          <div className="kpi-label">Open</div>
          <div className="kpi-sub">Not yet closed</div>
        </div>
        <div className="kpi-card kpi-card-red">
          <div className="kpi-value">{overdue}</div>
          <div className="kpi-label">Overdue response</div>
          <div className="kpi-sub">Past the SLA deadline</div>
        </div>
        <div className="kpi-card kpi-card-green">
          <div className="kpi-value">{thisMonth}</div>
          <div className="kpi-label">This month</div>
          <div className="kpi-sub">{now.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' })}</div>
        </div>
        <div className="kpi-card kpi-card-red">
          <div className="kpi-value">{riddorCount}</div>
          <div className="kpi-label">RIDDOR reportable</div>
          <div className="kpi-sub">Flagged for RIDDOR</div>
        </div>
        <div className="kpi-card kpi-card-amber">
          <div className="kpi-value">{cqcCount}</div>
          <div className="kpi-label">CQC notifiable</div>
          <div className="kpi-sub">Flagged for CQC</div>
        </div>
        {isAdmin && (
          <div className="kpi-card kpi-card-red">
            <div className="kpi-value">{overdueActions.length}</div>
            <div className="kpi-label">Overdue actions</div>
            <div className="kpi-sub">Corrective actions past due</div>
          </div>
        )}
        <div className="kpi-card kpi-card-amber">
          <div className="kpi-value">{alertsPending}</div>
          <div className="kpi-label">Safety alerts to read</div>
          <div className="kpi-sub">Not yet acknowledged by you</div>
        </div>
      </div>

      <div className="card">
        <div className="kpi-panel-header">
          <div className="kpi-panel-title">Incidents reported per week</div>
          <div className="muted">Last 12 weeks</div>
        </div>
        <TrendChart weeks={weeks} />
      </div>

      <div className="kpi-panels">
        <div className="card kpi-panel">
          <div className="kpi-panel-header">
            <div className="kpi-panel-title">By category</div>
          </div>
          {categoryCounts.length === 0 ? (
            <div className="empty">No incidents yet.</div>
          ) : (
            categoryCounts.map((c) => (
              <DashBarRow key={c.key} label={c.label} count={c.count} max={maxCategory} color="#2563eb" />
            ))
          )}
        </div>

        <div className="card kpi-panel">
          <div className="kpi-panel-header">
            <div className="kpi-panel-title">By severity</div>
          </div>
          {severityCounts.map((s) => (
            <DashBarRow key={s.key} label={s.key.charAt(0) + s.key.slice(1).toLowerCase()} count={s.count} max={maxSeverity} color={SEVERITY_COLOR[s.key]} />
          ))}
        </div>

        <div className="card kpi-panel">
          <div className="kpi-panel-header">
            <div className="kpi-panel-title">By status</div>
          </div>
          {statusCounts.map((s) => (
            <DashBarRow key={s.key} label={s.key.charAt(0) + s.key.slice(1).toLowerCase()} count={s.count} max={maxStatus} color={STATUS_COLOR[s.key]} />
          ))}
        </div>

        <div className="card kpi-panel">
          <div className="kpi-panel-header">
            <div className="kpi-panel-title">Response status</div>
            <div className="muted">Open &amp; investigating only</div>
          </div>
          {respondable.length === 0 ? (
            <div className="empty">Nothing awaiting a response.</div>
          ) : (
            responseCounts.map((r) => (
              <DashBarRow key={r.key} label={RESPONSE_LABEL[r.key]} count={r.count} max={maxResponse} color={RESPONSE_COLOR[r.key]} />
            ))
          )}
        </div>

        <div className="card kpi-panel">
          <div className="kpi-panel-header">
            <div className="kpi-panel-title">Top vehicles</div>
            <div className="muted">By incident count</div>
          </div>
          {vehicleCounts.length === 0 ? (
            <div className="empty">No vehicle registrations recorded yet.</div>
          ) : (
            vehicleCounts.map((v) => (
              <DashBarRow key={v.key} label={v.key} count={v.count} max={maxVehicle} color="#7c3aed" />
            ))
          )}
        </div>

        <div className="card kpi-panel">
          <div className="kpi-panel-header">
            <div className="kpi-panel-title">Top locations</div>
            <div className="muted">By incident count</div>
          </div>
          {locationCounts.length === 0 ? (
            <div className="empty">No locations recorded yet.</div>

function Actions() {
  const [actions, setActions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showAll, setShowAll] = useState(false);
  const [error, setError] = useState('');

    setLoading(true);
    return api.listActions(all ? undefined : { overdue: 1 })
      .then(setActions)
      .catch((err) => setError(err.message || 'Failed to load'))
      .finally(() => setLoading(false));
  }

  useEffect(() => {
    load(showAll);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [showAll]);

  async function handleStatus(action, status) {
    try {
      await api.updateAction(action.id, { status });
      await load(showAll);
    } catch (err) {
      setError(err.message || 'Failed to update action');

  return (

        {loading ? (
          <div className="empty">Loading…</div>
        ) : actions.length === 0 ? (
          <div className="empty">{showAll ? 'No open corrective actions.' : 'No overdue corrective actions.'}</div>
        ) : (
          <table className="table">
            <thead>
              <tr>
                <th>Incident</th>
                <th>Action</th>
                <th>Owner</th>
                <th>Due</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              {actions.map((a) => (
                <tr key={a.id}>
                  <td><span className="ref-link">{a.incidentRef}</span></td>
                  <td>{a.description}</td>
                  <td>{a.ownerName || 'Unassigned'}</td>

function SafetyAlerts() {
  const { user } = useAuth();
  const isAdmin = isMgrOrAdmin(user?.role);
  const [alerts, setAlerts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [acking, setAcking] = useState(null);
  const [viewingAcks, setViewingAcks] = useState(null);
  const [ackRows, setAckRows] = useState([]);
  const [error, setError] = useState('');

  function load() {
    setLoading(true);
    return api.listSafetyAlerts().then(setAlerts).catch((err) => setError(err.message || 'Failed to load')).finally(() => setLoading(false));
  }

  useEffect(() => {
    load();
  }, []);

  async function handleAck(alert) {
    setAcking(alert.id);
    try {
      await api.ackSafetyAlert(alert.id);
      await load();
    } catch (err) {
      setError(err.message || 'Failed to acknowledge');
    } finally {
      setAcking(null);
    }
  }

  async function handleViewAcks(alert) {
    setViewingAcks(alert);
    try {
      const rows = await api.getSafetyAlertAcks(alert.id);
      setAckRows(rows);
    } catch (err) {
      setError(err.message || 'Failed to load acknowledgements');
    }
  }

  async function handleArchive(alert) {
    if (!confirm(`Archive "${alert.title}"? It will no longer be shown to staff.`)) return;
    try {
      await api.archiveSafetyAlert(alert.id);
      await load();
    } catch (err) {
      setError(err.message || 'Failed to archive');
    }
  }

  return (
    <div>
      <div className="page-header">
        <h1>Safety Alerts</h1>
      </div>

      {error && <div className="error-banner" style={{ marginBottom: 12 }}>{error}</div>}

      <div className="card table-card">
        {loading ? (
          <div className="empty">Loading…</div>
        ) : alerts.length === 0 ? (
          <div className="empty">No active safety alerts.</div>
        ) : (
          <div className="kpi-list">
            {alerts.map((a) => (
              <div key={a.id} className="kpi-list-row" style={{ alignItems: 'flex-start', flexWrap: 'wrap' }}>
                <div style={{ flex: '1 1 320px' }}>
                  <div style={{ fontWeight: 600 }}>{a.title}</div>
                  <div className="policy-body" style={{ marginTop: 4 }}>{a.body}</div>
                  <div className="muted" style={{ marginTop: 4, fontSize: 12 }}>
                    Raised by {a.createdByName || 'Unknown'}{a.incidentRef ? ` from incident ${a.incidentRef}` : ''}
                  </div>
                </div>
                <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                  {a.acknowledged ? (
                    <span className="badge badge-green">Acknowledged</span>
                  ) : (
                    <button type="button" className="btn btn-primary btn-sm" disabled={acking === a.id} onClick={() => handleAck(a)}>
                      {acking === a.id ? 'Saving…' : 'Acknowledge'}
                    </button>
                  )}
                  {isAdmin && (
                    <>
                      <span className="muted" style={{ fontSize: 12 }}>{a.ackCount ?? 0}/{a.staffCount ?? 0} acknowledged</span>
                      <button type="button" className="btn btn-ghost btn-sm" onClick={() => handleViewAcks(a)}>Who's seen it?</button>
                      <button type="button" className="btn btn-ghost btn-sm" onClick={() => handleArchive(a)}>Archive</button>
                    </>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {viewingAcks && (
        <div className="modal-backdrop" onMouseDown={() => setViewingAcks(null)}>
          <div className="modal" onMouseDown={(e) => e.stopPropagation()} style={{ maxWidth: 480 }}>
            <div className="modal-header">
              <h2>{viewingAcks.title}</h2>
              <button type="button" className="modal-close" onClick={() => setViewingAcks(null)}>✕</button>
            </div>
            <div className="kpi-list">
              {ackRows.map((r) => (
                <div key={r.id} className="kpi-list-row">
                  <span>{r.name}</span>
                  <span className="muted">{r.email}</span>
                  <span className={'badge ' + (r.acknowledgedAt ? 'badge-green' : 'badge-red')}>
                    {r.acknowledgedAt ? 'Acknowledged' : 'Not yet'}
                  </span>
                </div>
              ))}
            </div>
            <div className="modal-footer">
              <div />
              <div className="modal-footer-right">
                <button type="button" className="btn btn-ghost" onClick={() => setViewingAcks(null)}>Close</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const VEHICLE_STATUS_LABELS = { AVAILABLE: 'Available', OFF_ROAD: 'Off road', MAINTENANCE: 'In maintenance' };
const VEHICLE_STATUS_BADGE = { AVAILABLE: 'badge-green', OFF_ROAD: 'badge-red', MAINTENANCE: 'badge-amber' };
const DUE_FIELDS = [
  { key: 'motDue', status: 'motStatus', label: 'MOT' },
  { key: 'serviceDue', status: 'serviceStatus', label: 'Service' },
  { key: 'insuranceDue', status: 'insuranceStatus', label: 'Insurance' },
  { key: 'taxDue', status: 'taxStatus', label: 'Tax' },
];

function shortDateStr(s) {
  if (!s) return '—';
  return new Date(s).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function DueCell({ date, status }) {
  if (!date) return <span className="muted">Not set</span>;
  const style =
    status === 'OVERDUE' ? { color: '#b91c1c', fontWeight: 700 }
    : status === 'DUE_SOON' ? { color: '#b45309', fontWeight: 700 }
    : undefined;
  return (
    <span style={style}>
      {shortDateStr(date)}
      {status === 'OVERDUE' ? ' — overdue' : status === 'DUE_SOON' ? ' — due soon' : ''}
    </span>
  );
}

function lastCheckLabel(v) {
  if (!v.lastCheckAt) return <span className="badge badge-grey">Never checked</span>;
  const d = new Date(v.lastCheckAt);
  const today = new Date();
  const isToday = d.toDateString() === today.toDateString();
  const label = isToday ? `Today ${fmtTime(d)}` : shortDateStr(d);
  if (v.lastCheckDefects > 0) return <span className="badge badge-red">{label} · {v.lastCheckDefects} defect{v.lastCheckDefects === 1 ? '' : 's'}</span>;
  return <span className={'badge ' + (isToday ? 'badge-green' : 'badge-amber')}>{label}{isToday ? ' · passed' : ''}</span>;
}

function VehicleModal({ vehicle, onClose, onSaved }) {
  const [form, setForm] = useState({
    reg: vehicle?.reg || '',
    callSign: vehicle?.callSign || '',
    vehicleType: vehicle?.vehicleType || '',
    makeModel: vehicle?.makeModel || '',
    status: vehicle?.status || 'AVAILABLE',
    motDue: vehicle?.motDue || '',
    serviceDue: vehicle?.serviceDue || '',
    insuranceDue: vehicle?.insuranceDue || '',
    taxDue: vehicle?.taxDue || '',
    notes: vehicle?.notes || '',
    active: vehicle ? vehicle.active : true,
  });
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  function set(field) {
    return (e) => setForm((f) => ({ ...f, [field]: e.target.value }));
  }

  async function save(overrides) {
    setError('');
    setBusy(true);
    try {
      const data = { ...form, ...(overrides || {}) };
      if (vehicle) await api.updateVehicle(vehicle.id, data);
      else await api.createVehicle(data);
      onSaved();
    } catch (err) {
      setError(err.message || 'Failed to save vehicle');
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="modal-backdrop" onMouseDown={onClose}>
      <form className="modal" onMouseDown={(e) => e.stopPropagation()} onSubmit={(e) => { e.preventDefault(); save(); }}>
        <div className="modal-header">
          <h2>{vehicle ? `Edit ${vehicle.reg}` : 'Add vehicle'}</h2>
          <button type="button" className="modal-close" onClick={onClose}>✕</button>
        </div>

        {error && <div className="error-banner">{error}</div>}

        <div className="form-grid">
          <div className="form-field">
            <label>Registration</label>
            <input value={form.reg} onChange={set('reg')} placeholder="e.g. AB12 CDE" required autoFocus />
          </div>
          <div className="form-field">
            <label>Call sign</label>
            <input value={form.callSign} onChange={set('callSign')} placeholder="e.g. MES1" />
          </div>
          <div className="form-field">
            <label>Type</label>
            <input value={form.vehicleType} onChange={set('vehicleType')} placeholder="e.g. Emergency ambulance, RRV" />
          </div>
          <div className="form-field">
            <label>Make and model</label>
            <input value={form.makeModel} onChange={set('makeModel')} placeholder="e.g. Mercedes Sprinter" />
          </div>
          <div className="form-field">
            <label>Status</label>
            <select value={form.status} onChange={set('status')}>
              {Object.entries(VEHICLE_STATUS_LABELS).map(([k, l]) => <option key={k} value={k}>{l}</option>)}
            </select>
          </div>
          <div className="form-field" />
          <div className="form-field">
            <label>MOT due</label>
            <input type="date" value={form.motDue} onChange={set('motDue')} />
          </div>
          <div className="form-field">
            <label>Service due</label>
            <input type="date" value={form.serviceDue} onChange={set('serviceDue')} />
          </div>
          <div className="form-field">
            <label>Insurance renewal</label>
            <input type="date" value={form.insuranceDue} onChange={set('insuranceDue')} />
          </div>
          <div className="form-field">
            <label>Road tax due</label>
            <input type="date" value={form.taxDue} onChange={set('taxDue')} />
          </div>
          <div className="form-field form-field-wide">
            <label>Notes</label>
            <textarea value={form.notes} onChange={set('notes')} rows={3} />
          </div>
        </div>

        <div className="modal-footer">
          {vehicle ? (
            vehicle.active ? (
              <button
                type="button"
                className="btn btn-danger"
                disabled={busy}
                onClick={() => { if (confirm(`Archive ${vehicle.reg}? It will be hidden from the fleet list and the crew check form. Its check history is kept.`)) save({ active: false }); }}
              >
                Archive vehicle

              <button type="button" className="btn btn-ghost" disabled={busy} onClick={() => save({ active: true })}>Restore vehicle</button>
            )
          ) : <div />}
          <div className="modal-footer-right">
            <button type="button" className="btn btn-ghost" onClick={onClose} disabled={busy}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>{busy ? 'Saving…' : 'Save vehicle'}</button>
          </div>

  );

      onSaved();
    } catch (err) {
      setError(err.message || 'Failed to update defect');
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="modal-backdrop" onMouseDown={onClose}>
      <form className="modal" onMouseDown={(e) => e.stopPropagation()} onSubmit={handleSubmit} style={{ maxWidth: 520 }}>
        <div className="modal-header">
          <h2>Resolve defect — {defect.vehicleReg}</h2>
          <button type="button" className="modal-close" onClick={onClose}>✕</button>
        </div>
        {error && <div className="error-banner">{error}</div>}
        <div>
          <div style={{ fontWeight: 600 }}>{defect.item}</div>
          {defect.description && <div className="muted" style={{ fontStyle: 'normal', marginTop: 4 }}>{defect.description}</div>}
        </div>
        <div className="form-field form-field-wide">
          <label>What was done?</label>
          <textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={4} placeholder="e.g. Tyre replaced at depot" required autoFocus />
        </div>
        <div className="modal-footer">
          <div />
          <div className="modal-footer-right">
            <button type="button" className="btn btn-ghost" onClick={onClose} disabled={busy}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>{busy ? 'Saving…' : 'Mark resolved'}</button>
          </div>
        </div>
      </form>
    </div>
  );
}

function AddDefectModal({ vehicles, onClose, onSaved }) {
  const [vehicleId, setVehicleId] = useState(vehicles[0]?.id || '');
  const [item, setItem] = useState('');
  const [description, setDescription] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    setBusy(true);
    try {
      await api.createDefect({ vehicleId: Number(vehicleId), item, description });
      onSaved();
    } catch (err) {
      setError(err.message || 'Failed to add defect');
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="modal-backdrop" onMouseDown={onClose}>
      <form className="modal" onMouseDown={(e) => e.stopPropagation()} onSubmit={handleSubmit} style={{ maxWidth: 520 }}>
        <div className="modal-header">
          <h2>Report a defect</h2>
          <button type="button" className="modal-close" onClick={onClose}>✕</button>
        </div>
        {error && <div className="error-banner">{error}</div>}
        <div className="form-grid">
          <div className="form-field form-field-wide">
            <label>Vehicle</label>
            <select value={vehicleId} onChange={(e) => setVehicleId(e.target.value)} required>
              {vehicles.map((v) => <option key={v.id} value={v.id}>{v.reg}{v.callSign ? ` — ${v.callSign}` : ''}</option>)}
            </select>
          </div>
          <div className="form-field form-field-wide">
            <label>Defect</label>
            <input value={item} onChange={(e) => setItem(e.target.value)} placeholder="e.g. Nearside mirror cracked" required />
          </div>
          <div className="form-field form-field-wide">
            <label>Details (optional)</label>
            <textarea value={description} onChange={(e) => setDescription(e.target.value)} rows={4} />
          </div>
        </div>
        <div className="modal-footer">
          <div />
          <div className="modal-footer-right">
            <button type="button" className="btn btn-ghost" onClick={onClose} disabled={busy}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>{busy ? 'Saving…' : 'Add defect'}</button>
          </div>
        </div>
      </form>
    </div>
  );
}

function FleetManagement() {
  const [tab, setTab] = useState('vehicles');
  const [summary, setSummary] = useState(null);
  const [vehicles, setVehicles] = useState([]);
  const [checks, setChecks] = useState([]);
  const [defects, setDefects] = useState([]);
  const [showArchived, setShowArchived] = useState(false);
  const [defectFilter, setDefectFilter] = useState('OPEN');
  const [checkVehicle, setCheckVehicle] = useState('');
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [editing, setEditing] = useState(null); // vehicle object, or 'new'
  const [viewingCheck, setViewingCheck] = useState(null);
  const [resolving, setResolving] = useState(null);
  const [addingDefect, setAddingDefect] = useState(false);
  const [copied, setCopied] = useState(false);

  const checkFormUrl = `${window.location.origin}/vdi`;

  function loadAll() {
    setError('');
    return Promise.all([
      api.getFleetSummary().then(setSummary),
      api.listVehicles(showArchived).then(setVehicles),
      api.listVdiChecks(checkVehicle || undefined).then(setChecks),
      api.listDefects(defectFilter || undefined).then(setDefects),
    ])
      .catch((err) => setError(err.message || 'Failed to load fleet data'))
      .finally(() => setLoading(false));
  }

  useEffect(() => {
    loadAll();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [showArchived, defectFilter, checkVehicle]);

  async function reopenDefect(d) {
    try {
      await api.updateDefect(d.id, { status: 'OPEN' });
      await loadAll();
    } catch (err) {
      setError(err.message || 'Failed to reopen defect');
    }
  }

  function copyLink() {
    navigator.clipboard?.writeText(checkFormUrl).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });
  }

  if (loading) return <div className="page-loading">Loading…</div>;

  const activeVehicles = vehicles.filter((v) => v.active);

  return (
    <div>
      <div className="page-header">
        <div>
          <h1>Fleet Management</h1>
          <div className="page-sub">Vehicles, key dates and crew daily inspections</div>
        </div>
        <div className="page-header-actions">
          <button className="btn btn-ghost" onClick={() => setAddingDefect(true)} disabled={!activeVehicles.length}>Report defect</button>
          <button className="btn btn-primary" onClick={() => setEditing('new')}>+ Add vehicle</button>
        </div>
      </div>

      {error && <div className="error-banner" style={{ marginBottom: 12 }}>{error}</div>}

      {summary && (
        <div className="kpi-grid">
          <div className={'kpi-card ' + (summary.offRoad ? 'kpi-card-amber' : 'kpi-card-green')}>
            <div className="kpi-value">{summary.available}/{summary.vehicles}</div>
            <div className="kpi-label">Vehicles available</div>
            <div className="kpi-sub">{summary.offRoad} off road or in maintenance</div>
          </div>
          <div className={'kpi-card ' + (summary.openDefects ? 'kpi-card-red' : 'kpi-card-green')}>
            <div className="kpi-value">{summary.openDefects}</div>
            <div className="kpi-label">Open defects</div>
            <div className="kpi-sub">Reported on checks or by managers</div>
          </div>
          <div className={'kpi-card ' + (summary.notCheckedToday ? 'kpi-card-amber' : 'kpi-card-green')}>
            <div className="kpi-value">{summary.checksToday}</div>
            <div className="kpi-label">Daily checks today</div>
            <div className="kpi-sub">{summary.notCheckedToday} available vehicle{summary.notCheckedToday === 1 ? '' : 's'} not yet checked</div>
          </div>
          <div className={'kpi-card ' + (summary.overdueItems ? 'kpi-card-red' : summary.dueSoonItems ? 'kpi-card-amber' : 'kpi-card-green')}>
            <div className="kpi-value">{summary.overdueItems}</div>
            <div className="kpi-label">Overdue MOT / service / insurance / tax</div>
            <div className="kpi-sub">{summary.dueSoonItems} due in the next 30 days</div>
          </div>
        </div>
      )}

      <div className="card" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap' }}>
        <div>
          <div style={{ fontWeight: 700 }}>Crew daily check form</div>
          <div className="muted" style={{ fontStyle: 'normal', fontSize: 13 }}>
            Crews open this link (no login) to complete a vehicle daily inspection. Use Print QR codes to make a code for each vehicle; scanning it opens the form with that vehicle already selected.
          </div>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <code style={{ background: '#f1f5f9', border: '1px solid var(--border)', borderRadius: 4, padding: '4px 8px', fontSize: 13 }}>{checkFormUrl}</code>
          <button type="button" className="btn btn-ghost btn-sm" onClick={copyLink}>{copied ? 'Copied' : 'Copy link'}</button>
          <a className="btn btn-ghost btn-sm" href="/vdi" target="_blank" rel="noopener" style={{ textDecoration: 'none' }}>Open</a>
          <a className="btn btn-primary btn-sm" href="/fleet/qr" target="_blank" rel="noopener" style={{ textDecoration: 'none' }}>Print QR codes</a>
        </div>
      </div>

      <div className="tabs">
        <button className={'tab-btn' + (tab === 'vehicles' ? ' active' : '')} onClick={() => setTab('vehicles')}>Vehicles</button>
        <button className={'tab-btn' + (tab === 'checks' ? ' active' : '')} onClick={() => setTab('checks')}>Daily checks</button>
        <button className={'tab-btn' + (tab === 'defects' ? ' active' : '')} onClick={() => setTab('defects')}>
          Defects{summary?.openDefects ? ` (${summary.openDefects})` : ''}
        </button>
      </div>

      {tab === 'vehicles' && (
        <div className="card table-card">
          <div style={{ padding: '10px 16px', display: 'flex', justifyContent: 'flex-end' }}>
            <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13 }}>
              <input type="checkbox" checked={showArchived} onChange={(e) => setShowArchived(e.target.checked)} />
              Show archived vehicles
            </label>
          </div>
          {vehicles.length === 0 ? (
            <div className="empty">No vehicles yet. Use “+ Add vehicle” to add your fleet.</div>
          ) : (
            <div style={{ overflowX: 'auto' }}>
              <table className="table">
                <thead>
                  <tr>
                    <th>Vehicle</th>
                    <th>Status</th>
                    <th>Last daily check</th>
                    <th>Open defects</th>
                    {DUE_FIELDS.map((f) => <th key={f.key}>{f.label}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {vehicles.map((v) => (
                    <tr key={v.id} className="row-clickable" onClick={() => setEditing(v)} style={v.active ? undefined : { opacity: 0.55 }}>
                      <td>
                        <div className="ref-link">{v.reg}</div>
                        <div className="muted" style={{ fontSize: 12 }}>
                          {[v.callSign, v.vehicleType, v.makeModel].filter(Boolean).join(' · ') || '—'}
                          {!v.active ? ' · archived' : ''}
                        </div>
                      </td>
                      <td><span className={'badge ' + (VEHICLE_STATUS_BADGE[v.status] || 'badge-grey')}>{VEHICLE_STATUS_LABELS[v.status] || v.status}</span></td>
                      <td>{lastCheckLabel(v)}</td>
                      <td>{v.openDefects ? <span className="badge badge-red">{v.openDefects}</span> : <span className="muted">None</span>}</td>
                      {DUE_FIELDS.map((f) => <td key={f.key}><DueCell date={v[f.key]} status={v[f.status]} /></td>)}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {tab === 'checks' && (
        <div className="card table-card">
          <div style={{ padding: '10px 16px', display: 'flex', justifyContent: 'flex-end' }}>
            <select value={checkVehicle} onChange={(e) => setCheckVehicle(e.target.value)}>
              <option value="">All vehicles</option>
              {vehicles.map((v) => <option key={v.id} value={v.id}>{v.reg}{v.callSign ? ` — ${v.callSign}` : ''}</option>)}
            </select>
          </div>
          {checks.length === 0 ? (
            <div className="empty">No daily checks submitted yet.</div>
          ) : (
            <table className="table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Vehicle</th>
                  <th>Checked by</th>
                  <th>Mileage</th>
                  <th>Result</th>
                </tr>
              </thead>
              <tbody>
                {checks.map((c) => (
                  <tr key={c.id} className="row-clickable" onClick={() => setViewingCheck(c)}>
                    <td>{fmtDate(c.createdAt)} {fmtTime(c.createdAt)}</td>
                    <td><span className="ref-link">{c.vehicleReg}</span>{c.callSign ? <span className="muted"> · {c.callSign}</span> : null}</td>
                    <td>{c.checkedBy || '—'}</td>
                    <td>{c.mileage != null ? Number(c.mileage).toLocaleString('en-GB') : '—'}</td>
                    <td>
                      {c.defectCount > 0
                        ? <span className="badge badge-red">{c.defectCount} defect{c.defectCount === 1 ? '' : 's'}</span>
                        : <span className="badge badge-green">Passed</span>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}

      {tab === 'defects' && (
        <div className="card table-card">
          <div style={{ padding: '10px 16px', display: 'flex', justifyContent: 'flex-end' }}>
            <select value={defectFilter} onChange={(e) => setDefectFilter(e.target.value)}>
              <option value="OPEN">Open defects</option>
              <option value="RESOLVED">Resolved defects</option>
              <option value="">All defects</option>
            </select>
          </div>
          {defects.length === 0 ? (
            <div className="empty">{defectFilter === 'OPEN' ? 'No open defects.' : 'No defects to show.'}</div>
          ) : (
            <table className="table">
              <thead>
                <tr>
                  <th>Reported</th>
                  <th>Vehicle</th>
                  <th>Defect</th>
                  <th>Status</th>
                  <th className="actions-cell"></th>
                </tr>
              </thead>
              <tbody>
                {defects.map((d) => (
                  <tr key={d.id}>
                    <td>
                      {shortDateStr(d.reportedAt)}
                      <div className="muted" style={{ fontSize: 12 }}>{d.reportedBy || ''}</div>
                    </td>
                    <td><span className="ref-link">{d.vehicleReg}</span>{d.callSign ? <span className="muted"> · {d.callSign}</span> : null}</td>
                    <td>
                      <div style={{ fontWeight: 600 }}>{d.item}</div>
                      {d.description && <div style={{ fontSize: 13, marginTop: 2 }}>{d.description}</div>}
                      {d.status === 'RESOLVED' && (
                        <div className="muted" style={{ fontSize: 12, marginTop: 4 }}>
                          Resolved {shortDateStr(d.resolvedAt)}{d.resolvedByName ? ` by ${d.resolvedByName}` : ''}{d.resolutionNotes ? ` — ${d.resolutionNotes}` : ''}
                        </div>
                      )}
                    </td>
                    <td><span className={'badge ' + (d.status === 'OPEN' ? 'badge-red' : 'badge-green')}>{d.status === 'OPEN' ? 'Open' : 'Resolved'}</span></td>
                    <td className="actions-cell">
                      {d.status === 'OPEN'
                        ? <button type="button" className="btn btn-primary btn-sm" onClick={() => setResolving(d)}>Resolve</button>
                        : <button type="button" className="btn btn-ghost btn-sm" onClick={() => reopenDefect(d)}>Reopen</button>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}

      {editing && (
        <VehicleModal
          vehicle={editing === 'new' ? null : editing}
          onClose={() => setEditing(null)}
          onSaved={() => { setEditing(null); loadAll(); }}
        />
      )}
      {viewingCheck && <CheckDetailModal check={viewingCheck} onClose={() => setViewingCheck(null)} />}
      {resolving && (
        <ResolveDefectModal
          defect={resolving}
          onClose={() => setResolving(null)}
          onSaved={() => { setResolving(null); loadAll(); }}
        />
      )}
      {addingDefect && (
        <AddDefectModal
          vehicles={activeVehicles}
          onClose={() => setAddingDefect(false)}
          onSaved={() => { setAddingDefect(false); setTab('defects'); setDefectFilter('OPEN'); loadAll(); }}
        />
      )}
    </div>
  );
}

// ---------------- Company assets ----------------
const ASSET_CATEGORY_LABELS = { MEDICAL: 'Medical equipment', COMMS: 'Radios & phones', IT: 'IT equipment', UNIFORM_PPE: 'Uniform & PPE', OTHER: 'Other' };
const ASSET_STATUS_LABELS = { AVAILABLE: 'Available', ISSUED: 'Issued', IN_REPAIR: 'In repair', LOST: 'Lost', RETIRED: 'Retired' };
const ASSET_STATUS_BADGE = { AVAILABLE: 'badge-green', ISSUED: 'badge-blue', IN_REPAIR: 'badge-amber', LOST: 'badge-red', RETIRED: 'badge-grey' };
const ASSET_DUE_FIELDS = [
  { key: 'serviceDue', status: 'serviceStatus', label: 'Service' },
  { key: 'calibrationDue', status: 'calibrationStatus', label: 'Calibration' },
  { key: 'patDue', status: 'patStatus', label: 'PAT test' },
];
const RETURN_CONDITION_LABELS = { GOOD: 'Good — back in service', DAMAGED: 'Damaged — send for repair', LOST: 'Lost / not returned' };

function assetHolder(a) {
  const i = a.currentIssue;
  if (!i) return a.location ? <span>{a.location}</span> : <span className="muted">—</span>;
  const who = [i.issuedToName, i.vehicleReg].filter(Boolean).join(' · ');
  return (
    <span>
      <strong>{who}</strong>
      {i.dueBack && (
        <div style={{ fontSize: 12, ...(i.overdue ? { color: '#b91c1c', fontWeight: 700 } : { color: 'var(--muted, #64748b)' }) }}>
          {i.overdue ? 'Overdue — due back ' : 'Due back '}{shortDateStr(i.dueBack)}
        </div>
      )}
    </span>
  );
}

function AssetModal({ asset, onClose, onSaved }) {
  const [form, setForm] = useState({
    assetTag: asset?.assetTag || '',
    name: asset?.name || '',
    category: asset?.category || 'MEDICAL',
    makeModel: asset?.makeModel || '',
    serialNumber: asset?.serialNumber || '',
    location: asset?.location || '',
    status: asset?.status || 'AVAILABLE',
    purchaseDate: asset?.purchaseDate || '',
    purchaseCost: asset?.purchaseCost ?? '',
    serviceDue: asset?.serviceDue || '',
    calibrationDue: asset?.calibrationDue || '',
    patDue: asset?.patDue || '',
    notes: asset?.notes || '',
  });
  const [tagHint, setTagHint] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const isIssued = asset?.status === 'ISSUED';

  useEffect(() => {
    if (!asset) api.getNextAssetTag().then((r) => setTagHint(r.assetTag)).catch(() => {});
  }, []);

  function set(field) {
    return (e) => setForm((f) => ({ ...f, [field]: e.target.value }));
  }

  async function save(overrides) {
    setError('');
    setBusy(true);
    try {
      const data = { ...form, ...(overrides || {}) };
      if (asset) await api.updateAsset(asset.id, data);
      else await api.createAsset(data);
      onSaved();
    } catch (err) {
      setError(err.message || 'Failed to save asset');
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="modal-backdrop" onMouseDown={onClose}>
      <form className="modal" onMouseDown={(e) => e.stopPropagation()} onSubmit={(e) => { e.preventDefault(); save(); }}>
        <div className="modal-header">
          <h2>{asset ? `Edit ${asset.assetTag}` : 'Add asset'}</h2>
          <button type="button" className="modal-close" onClick={onClose}>✕</button>
        </div>

        {error && <div className="error-banner">{error}</div>}

        <div className="form-grid">
          <div className="form-field">
            <label>Item name</label>
            <input value={form.name} onChange={set('name')} placeholder="e.g. Lifepak 15 defibrillator" required autoFocus />
          </div>
          <div className="form-field">
            <label>Asset tag</label>
            <input value={form.assetTag} onChange={set('assetTag')} placeholder={tagHint ? `Leave blank for ${tagHint}` : 'e.g. A-0001'} />
          </div>
          <div className="form-field">
            <label>Category</label>
            <select value={form.category} onChange={set('category')}>
              {Object.entries(ASSET_CATEGORY_LABELS).map(([k, l]) => <option key={k} value={k}>{l}</option>)}
            </select>
          </div>
          <div className="form-field">
            <label>Status</label>
            {isIssued ? (
              <input value="Issued (return it to change)" disabled />
            ) : (
              <select value={form.status} onChange={set('status')}>
                {['AVAILABLE', 'IN_REPAIR', 'LOST', 'RETIRED'].map((k) => <option key={k} value={k}>{ASSET_STATUS_LABELS[k]}</option>)}
              </select>
            )}
          </div>
          <div className="form-field">
            <label>Make and model</label>
            <input value={form.makeModel} onChange={set('makeModel')} placeholder="e.g. Physio-Control Lifepak 15" />
          </div>
          <div className="form-field">
            <label>Serial number</label>
            <input value={form.serialNumber} onChange={set('serialNumber')} />
          </div>
          <div className="form-field">
            <label>Usual location</label>
            <input value={form.location} onChange={set('location')} placeholder="e.g. Main base store, Vehicle MES1" />
          </div>
          <div className="form-field" />
          <div className="form-field">
            <label>Next service due</label>
            <input type="date" value={form.serviceDue} onChange={set('serviceDue')} />
          </div>
          <div className="form-field">
            <label>Next calibration due</label>
            <input type="date" value={form.calibrationDue} onChange={set('calibrationDue')} />
          </div>
          <div className="form-field">
            <label>Next PAT / electrical test due</label>
            <input type="date" value={form.patDue} onChange={set('patDue')} />
          </div>
          <div className="form-field" />
          <div className="form-field">
            <label>Purchase date</label>
            <input type="date" value={form.purchaseDate} onChange={set('purchaseDate')} />
          </div>
          <div className="form-field">
            <label>Purchase cost (£)</label>
            <input type="number" min="0" step="0.01" value={form.purchaseCost} onChange={set('purchaseCost')} />
          </div>
          <div className="form-field form-field-wide">
            <label>Notes</label>
            <textarea value={form.notes} onChange={set('notes')} rows={3} />
          </div>
        </div>

        <div className="modal-footer">
          {asset ? (
            asset.active ? (
              <button
                type="button"
                className="btn btn-danger"
                disabled={busy || isIssued}
                title={isIssued ? 'Return the item before archiving it' : undefined}
                onClick={() => { if (confirm(`Archive ${asset.assetTag}? It will be hidden from the register. Its issue history is kept.`)) save({ active: false }); }}
              >
                Archive asset
              </button>
            ) : (
              <button type="button" className="btn btn-ghost" disabled={busy} onClick={() => save({ active: true })}>Restore asset</button>
            )
          ) : <div />}
          <div className="modal-footer-right">
            <button type="button" className="btn btn-ghost" onClick={onClose} disabled={busy}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>{busy ? 'Saving…' : 'Save asset'}</button>
          </div>
        </div>
      </form>
    </div>
  );
}

function IssueAssetModal({ asset, vehicles, onClose, onSaved }) {
  const [form, setForm] = useState({ issuedToName: '', vehicleId: '', dueBack: '', notes: '' });
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  function set(field) {
    return (e) => setForm((f) => ({ ...f, [field]: e.target.value }));
  }
  async function save() {
    setError('');
    if (!form.issuedToName.trim() && !form.vehicleId) { setError('Enter who it is issued to, or choose a vehicle.'); return; }
    setBusy(true);
    try {
      await api.issueAsset(asset.id, { ...form, vehicleId: form.vehicleId ? Number(form.vehicleId) : null });
      onSaved();
    } catch (err) {
      setError(err.message || 'Failed to issue item');
    } finally {
      setBusy(false);
    }
  }
  return (
    <div className="modal-backdrop" onMouseDown={onClose}>
      <form className="modal" style={{ maxWidth: 560 }} onMouseDown={(e) => e.stopPropagation()} onSubmit={(e) => { e.preventDefault(); save(); }}>
        <div className="modal-header">
          <h2>Issue {asset.assetTag}</h2>
          <button type="button" className="modal-close" onClick={onClose}>✕</button>
        </div>
        <p className="muted" style={{ fontStyle: 'normal', marginTop: 0 }}>{asset.name}{asset.serialNumber ? ` · S/N ${asset.serialNumber}` : ''}</p>
        {error && <div className="error-banner">{error}</div>}
        <div className="form-grid">
          <div className="form-field">
            <label>Issued to (name)</label>
            <input value={form.issuedToName} onChange={set('issuedToName')} placeholder="e.g. Sam Patel" autoFocus />
          </div>
          <div className="form-field">
            <label>Vehicle (optional)</label>
            <select value={form.vehicleId} onChange={set('vehicleId')}>
              <option value="">— none —</option>
              {vehicles.map((v) => <option key={v.id} value={v.id}>{v.reg}{v.callSign ? ` — ${v.callSign}` : ''}</option>)}
            </select>
          </div>
          <div className="form-field">
            <label>Due back (optional)</label>
            <input type="date" value={form.dueBack} onChange={set('dueBack')} />
          </div>
          <div className="form-field" />
          <div className="form-field form-field-wide">
            <label>Notes</label>
            <textarea value={form.notes} onChange={set('notes')} rows={2} placeholder="e.g. For the weekend event; charger included" />
          </div>
        </div>
        <div className="modal-footer">
          <div />
          <div className="modal-footer-right">
            <button type="button" className="btn btn-ghost" onClick={onClose} disabled={busy}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>{busy ? 'Saving…' : 'Issue item'}</button>
          </div>
        </div>
      </form>
    </div>
  );
}

function ReturnAssetModal({ asset, onClose, onSaved }) {
  const [condition, setCondition] = useState('GOOD');
  const [notes, setNotes] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const i = asset.currentIssue || {};
  async function save() {
    setError('');
    if (condition !== 'GOOD' && !notes.trim()) { setError('Please describe the damage or what happened.'); return; }
    setBusy(true);
    try {
      await api.returnAsset(asset.id, { condition, notes });
      onSaved();
    } catch (err) {
      setError(err.message || 'Failed to record return');
    } finally {
      setBusy(false);
    }
  }
  return (
    <div className="modal-backdrop" onMouseDown={onClose}>
      <form className="modal" style={{ maxWidth: 560 }} onMouseDown={(e) => e.stopPropagation()} onSubmit={(e) => { e.preventDefault(); save(); }}>
        <div className="modal-header">
          <h2>Return {asset.assetTag}</h2>
          <button type="button" className="modal-close" onClick={onClose}>✕</button>
        </div>
        <p className="muted" style={{ fontStyle: 'normal', marginTop: 0 }}>
          {asset.name} — issued to {[i.issuedToName, i.vehicleReg].filter(Boolean).join(' · ')} on {shortDateStr(i.issuedAt)}
        </p>
        {error && <div className="error-banner">{error}</div>}
        <div className="form-field">
          <label>Condition on return</label>

              <input type="radio" name="cond" checked={condition === k} onChange={() => setCondition(k)} style={{ width: 'auto' }} /> {l}

function CompanyAssets() {
  const [tab, setTab] = useState('assets');
  const [summary, setSummary] = useState(null);
  const [assets, setAssets] = useState([]);
  const [issues, setIssues] = useState([]);
  const [vehicles, setVehicles] = useState([]);
  const [showArchived, setShowArchived] = useState(false);
  const [search, setSearch] = useState('');
  const [category, setCategory] = useState('');
  const [status, setStatus] = useState('');
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [editing, setEditing] = useState(null); // asset or 'new'
  const [viewing, setViewing] = useState(null);
  const [issuing, setIssuing] = useState(null);
  const [returning, setReturning] = useState(null);

  function loadAll() {
    setError('');
    return Promise.all([
      api.getAssetSummary().then(setSummary),
      api.listAssets(showArchived).then(setAssets),
      api.listAssetIssues(tab === 'issued').then(setIssues),
      api.listVehicles(false).then(setVehicles).catch(() => setVehicles([])),
    ])
      .catch((err) => setError(err.message || 'Failed to load assets'))
      .finally(() => setLoading(false));
  }

  useEffect(() => {
    loadAll();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [showArchived, tab]);

  function done() {
    setEditing(null); setIssuing(null); setReturning(null); setViewing(null);
    loadAll();
  }

  if (loading) return <div className="page-loading">Loading…</div>;

  const q = search.trim().toLowerCase();
  const shown = assets.filter((a) =>
    (!category || a.category === category) &&
    (!status || a.status === status) &&
    (!q || [a.assetTag, a.name, a.makeModel, a.serialNumber, a.location, a.currentIssue?.issuedToName, a.currentIssue?.vehicleReg]
      .filter(Boolean).some((v) => String(v).toLowerCase().includes(q)))
  );
  const byId = Object.fromEntries(assets.map((a) => [a.id, a]));

  return (
    <div>
      <div className="page-header">
        <div>
          <h1>Company Assets</h1>
          <div className="page-sub">Equipment register, service dates and who has what</div>
        </div>
        <div className="page-header-actions">
          <button className="btn btn-primary" onClick={() => setEditing('new')}>+ Add asset</button>
        </div>
      </div>

      {error && <div className="error-banner" style={{ marginBottom: 12 }}>{error}</div>}

      {summary && (
        <div className="kpi-grid">
          <div className="kpi-card kpi-card-green">
            <div className="kpi-value">{summary.total}</div>
            <div className="kpi-label">Assets in service</div>
            <div className="kpi-sub">{summary.available} available now</div>
          </div>
          <div className={'kpi-card ' + (summary.overdueReturns ? 'kpi-card-red' : 'kpi-card-green')}>
            <div className="kpi-value">{summary.issued}</div>
            <div className="kpi-label">Issued out</div>
            <div className="kpi-sub">{summary.overdueReturns} overdue for return</div>
          </div>
          <div className={'kpi-card ' + (summary.overdueChecks ? 'kpi-card-red' : summary.dueSoonChecks ? 'kpi-card-amber' : 'kpi-card-green')}>
            <div className="kpi-value">{summary.overdueChecks}</div>
            <div className="kpi-label">Overdue service / calibration / PAT</div>
            <div className="kpi-sub">{summary.dueSoonChecks} due in the next 30 days</div>
          </div>
          <div className={'kpi-card ' + (summary.inRepair || summary.lost ? 'kpi-card-amber' : 'kpi-card-green')}>
            <div className="kpi-value">{summary.inRepair}</div>
            <div className="kpi-label">In repair</div>
            <div className="kpi-sub">{summary.lost} recorded as lost</div>
          </div>
        </div>
      )}

      <div className="tabs">
        <button className={'tab-btn' + (tab === 'assets' ? ' active' : '')} onClick={() => setTab('assets')}>Assets</button>
        <button className={'tab-btn' + (tab === 'issued' ? ' active' : '')} onClick={() => setTab('issued')}>
          Issued out{summary?.issued ? ` (${summary.issued})` : ''}
        </button>
        <button className={'tab-btn' + (tab === 'history' ? ' active' : '')} onClick={() => setTab('history')}>History</button>
      </div>

      {tab === 'assets' && (
        <div className="card table-card">
          <div style={{ padding: '10px 16px', display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center' }}>
            <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search tag, name, serial, person…" style={{ flex: '1 1 220px' }} />
            <select value={category} onChange={(e) => setCategory(e.target.value)}>
              <option value="">All categories</option>
              {Object.entries(ASSET_CATEGORY_LABELS).map(([k, l]) => <option key={k} value={k}>{l}</option>)}

            <select value={status} onChange={(e) => setStatus(e.target.value)}>

                        <div className="muted" style={{ fontSize: 12 }}>

                        </div>
                      </td>
                      <td>{ASSET_CATEGORY_LABELS[a.category] || a.category}</td>
                      <td><span className={'badge ' + (ASSET_STATUS_BADGE[a.status] || 'badge-grey')}>{ASSET_STATUS_LABELS[a.status] || a.status}</span></td>
                      <td>{assetHolder(a)}</td>
                      {ASSET_DUE_FIELDS.map((f) => <td key={f.key}><DueCell date={a[f.key]} status={a[f.status]} /></td>)}
                      <td className="actions-cell" onClick={(e) => e.stopPropagation()}>
                        {a.currentIssue
                          ? <button type="button" className="btn btn-ghost btn-sm" onClick={() => setReturning(a)}>Return</button>
                          : a.active && !['LOST', 'RETIRED', 'IN_REPAIR'].includes(a.status) && <button type="button" className="btn btn-primary btn-sm" onClick={() => setIssuing(a)}>Issue</button>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {(tab === 'issued' || tab === 'history') && (
        <div className="card table-card">
          {issues.length === 0 ? (
            <div className="empty">{tab === 'issued' ? 'Nothing is issued out at the moment.' : 'No equipment has been issued yet.'}</div>
          ) : (
            <div style={{ overflowX: 'auto' }}>
              <table className="table">
                <thead>
                  <tr>
                    <th>Asset</th>
                    <th>Issued to</th>
                    <th>Issued</th>
                    <th>{tab === 'issued' ? 'Due back' : 'Returned'}</th>
                    {tab === 'history' && <th>Condition</th>}
                    {tab === 'issued' && <th className="actions-cell"></th>}

                <tbody>
                  {issues.map((h) => (

                        <div style={{ fontSize: 13 }}>{h.assetName}</div>

                        <strong>{[h.issuedToName, h.vehicleReg].filter(Boolean).join(' · ')}</strong>

                      </td>
                      <td>{shortDateStr(h.issuedAt)}<div className="muted" style={{ fontSize: 12 }}>{h.issuedByName ? `by ${h.issuedByName}` : ''}</div></td>

                        <td>{h.dueBack ? <DueCell date={h.dueBack} status={h.overdue ? 'OVERDUE' : null} /> : <span className="muted">No date</span>}</td>

                        <td>

        <AssetDetailModal

          onClose={() => setViewing(null)}

      {issuing && <IssueAssetModal asset={issuing} vehicles={vehicles} onClose={() => setIssuing(null)} onSaved={done} />}
