function MfaSetupPanel({ mfaToken, onEnabled, onRestart }) {
  const [info, setInfo] = useState(null);
  const [code, setCode] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    api.mfaSetup(mfaToken ? { mfaToken } : {}).then(setInfo).catch((err) => setError(err.message || 'Could not start set-up'));
  }, []);

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    setBusy(true);
    try {
      const res = await api.mfaEnable({ ...(mfaToken ? { mfaToken } : {}), code: code.replace(/\s/g, '') });
      onEnabled(res);
    } catch (err) {
      setError(err.message || 'That code didn’t work');
      if (/sign in again|start the set-up again/i.test(err.message || '') && onRestart) onRestart(err.message);
    } finally {
      setBusy(false);
    }
  }

  return (
    <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      <p style={{ margin: 0, fontSize: 14 }}>
        Two-factor sign-in protects patient and staff information. Install an authenticator app on your phone
        (for example Microsoft Authenticator or Google Authenticator), then scan this code with it.
      </p>
      {error && <div className="error-banner">{error}</div>}
      {!info ? (
        !error && <div className="muted">Preparing…</div>
      ) : (
        <>
          <div style={{ width: 200, maxWidth: '100%', alignSelf: 'center', background: '#fff', padding: 6, borderRadius: 8 }}
            dangerouslySetInnerHTML={{ __html: info.qrSvg }} />
          <details style={{ fontSize: 13 }}>
            <summary>Can't scan it? Enter this key instead</summary>
            <div style={{ fontFamily: 'monospace', fontSize: 14, marginTop: 6, wordBreak: 'break-all' }}>{info.secret}</div>
          </details>
          <label>Enter the 6-digit code from the app</label>
          <input inputMode="numeric" autoComplete="one-time-code" pattern="[0-9 ]*" maxLength={7} value={code}
            onChange={(e) => setCode(e.target.value)} required autoFocus placeholder="123456" />
          <button className="btn btn-primary" type="submit" disabled={busy || code.replace(/\s/g, '').length !== 6}>
            {busy ? 'Checking…' : 'Turn on two-factor sign-in'}
          </button>
        </>
      )}
    </form>
  );
}

function RecoveryCodesView({ codes, onContinue, continueLabel }) {
  const [copied, setCopied] = useState(false);
  const text = 'Dynamo recovery codes (each works once)\n\n' + codes.join('\n') + '\n';
  function download() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
    a.download = 'dynamo-recovery-codes.txt';
    a.click();
  }
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      <p style={{ margin: 0, fontSize: 14 }}>
        <strong>Save these recovery codes somewhere safe.</strong> If you lose your phone, each code lets you sign in once.
        They won't be shown again.
      </p>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6, fontFamily: 'monospace', fontSize: 15,
        background: 'var(--bg)', padding: 12, borderRadius: 8 }}>
        {codes.map((c) => <div key={c}>{c}</div>)}
      </div>
      <div style={{ display: 'flex', gap: 8 }}>
        <button type="button" className="btn btn-ghost btn-sm" onClick={() => {
          navigator.clipboard?.writeText(text).then(() => setCopied(true)).catch(() => {});
        }}>{copied ? 'Copied' : 'Copy'}</button>
        <button type="button" className="btn btn-ghost btn-sm" onClick={download}>Download</button>
      </div>
      {onContinue && <button type="button" className="btn btn-primary" onClick={onContinue}>{continueLabel || 'I’ve saved them — continue'}</button>}
    </div>
  );
}

function Login() {
  const { user, login, finishLogin, loading } = useAuth();
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  // 'password' | 'code' | 'setup' | 'codes' | 'lowCodes'
  const [stage, setStage] = useState('password');
  const [mfaToken, setMfaToken] = useState(null);
  const [code, setCode] = useState('');
  const [useRecovery, setUseRecovery] = useState(false);
  const [pending, setPending] = useState(null); // session held back while recovery codes are shown
  const navigate = useNavigate();

  if (!loading && user) return <Navigate to="/dashboard" replace />;

  function restart(message) {
    setStage('password');
    setMfaToken(null);
    setCode('');
    setPassword('');
    setUseRecovery(false);
    setError(message || '');
  }

  function done(res) {
    finishLogin(res);
    navigate('/dashboard');
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    setBusy(true);
    try {
      const res = await login(email, password);
      if (res.token) {
        navigate('/dashboard');
      } else if (res.mfaRequired) {
        setMfaToken(res.mfaToken);
        setStage('code');
      } else if (res.mfaSetupRequired) {
        setMfaToken(res.mfaToken);
        setStage('setup');
      }
    } catch (err) {
      setError(err.message || 'Login failed');
    } finally {
      setBusy(false);
    }
  }

  async function handleCode(e) {
    e.preventDefault();
    setError('');
    setBusy(true);
    try {
      const res = await api.mfaVerify(useRecovery ? { mfaToken, recoveryCode: code } : { mfaToken, code: code.replace(/\s/g, '') });
      if (useRecovery && res.recoveryCodesLeft <= 3) {
        setPending(res);
        setStage('lowCodes');
      } else {
        done(res);
      }
    } catch (err) {
      if (/sign in again/i.test(err.message || '')) restart(err.message);
      else setError(err.message || 'That code didn’t work');
    } finally {
      setBusy(false);
    }
  }

  const brand = (
    <div className="login-brand">
      <div className="brand-icon brand-icon-light">
        <span className="brand-icon-letter">D</span>
        <span className="brand-icon-dot"></span>
      </div>
      DYNAMO
    </div>
  );

  if (stage === 'setup') {
    return (
      <div className="login-page">
        <div className="login-card">
          {brand}
          <h1>Set up two-factor sign-in</h1>
          {error && <div className="error-banner">{error}</div>}
          <MfaSetupPanel mfaToken={mfaToken} onRestart={restart}
            onEnabled={(res) => { setPending(res); setStage('codes'); }} />
          <button type="button" className="btn btn-ghost btn-sm" onClick={() => restart()}>Back to sign in</button>
        </div>
      </div>
    );
  }

  if (stage === 'codes' && pending) {
    return (
      <div className="login-page">
        <div className="login-card">
          {brand}
          <h1>Two-factor sign-in is on</h1>
          <RecoveryCodesView codes={pending.recoveryCodes} onContinue={() => done(pending)} />
        </div>
      </div>
    );
  }

  if (stage === 'lowCodes' && pending) {
    return (
      <div className="login-page">
        <div className="login-card">
          {brand}
          <h1>Recovery codes running low</h1>
          <p style={{ margin: 0, fontSize: 14 }}>
            You have {pending.recoveryCodesLeft} recovery code{pending.recoveryCodesLeft === 1 ? '' : 's'} left.
            If you've lost your phone, ask an admin to reset your two-factor sign-in so you can set it up on a new one.
            Otherwise, get new codes under Settings → Two-factor sign-in.
          </p>
          <button className="btn btn-primary" type="button" onClick={() => done(pending)}>Continue</button>
        </div>
      </div>
    );
  }

  if (stage === 'code') {
    return (
      <div className="login-page">
        <form className="login-card" onSubmit={handleCode}>
          {brand}
          <h1>Enter your code</h1>
          {error && <div className="error-banner">{error}</div>}
          {useRecovery ? (
            <>
              <label>Recovery code</label>
              <input key="rc" value={code} onChange={(e) => setCode(e.target.value)} required autoFocus
                placeholder="XXXXX-XXXXX" autoComplete="off" />
            </>
          ) : (
            <>
              <label>6-digit code from your authenticator app</label>
              <input key="totp" inputMode="numeric" autoComplete="one-time-code" pattern="[0-9 ]*" maxLength={7}
                value={code} onChange={(e) => setCode(e.target.value)} required autoFocus placeholder="123456" />
            </>
          )}
          <button className="btn btn-primary" type="submit" disabled={busy}>
            {busy ? 'Checking…' : 'Sign in'}
          </button>
          <button type="button" className="btn btn-ghost btn-sm" onClick={() => { setUseRecovery(!useRecovery); setCode(''); setError(''); }}>
            {useRecovery ? 'Use a code from my app instead' : 'Lost your phone? Use a recovery code'}
          </button>
          <button type="button" className="btn btn-ghost btn-sm" onClick={() => restart()}>Back</button>
        </form>
      </div>
    );
  }

  return (
    <div className="login-page">
      <form className="login-card" onSubmit={handleSubmit}>
        {brand}
        <h1>Sign in</h1>
        {error && <div className="error-banner">{error}</div>}
        <label>Email</label>
        <input
          type="email"
          value={email}
          onChange={(e) => setEmail(e.target.value)}
          required
          autoFocus
        />
        <label>Password</label>
        <input
          type="password"
          value={password}
          onChange={(e) => setPassword(e.target.value)}
          required
        />
        <button className="btn btn-primary" type="submit" disabled={busy}>
          {busy ? 'Signing in…' : 'Sign in'}
        </button>
      </form>
    </div>
  );
}



// ---- Datix: drag-and-drop store for documents from NHS trusts' Datix ----

const DATIX_ACCEPT = '.pdf,.doc,.docx,.rtf,.odt,.txt,.csv,.xls,.xlsx,.ods,.msg,.eml,.htm,.html,.jpg,.jpeg,.png,.gif,.webp,.heic,.tif,.tiff,.zip';
const DATIX_MAX_MB = 25;

function fmtFileSize(n) {
  if (!n && n !== 0) return '—';
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${Math.round(n / 1024)} KB`;
  return `${(n / 1024 / 1024).toFixed(1)} MB`;
}

function datixFileIcon(name) {
  const ext = (String(name).match(/\.([a-z0-9]+)$/i)?.[1] || '').toLowerCase();
  if (ext === 'pdf') return '📕';
  if (['doc', 'docx', 'rtf', 'odt', 'txt'].includes(ext)) return '📄';
  if (['xls', 'xlsx', 'csv', 'ods'].includes(ext)) return '📊';
  if (['msg', 'eml'].includes(ext)) return '✉️';
  if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'heic', 'tif', 'tiff'].includes(ext)) return '🖼️';
  if (ext === 'zip') return '🗜️';
  return '📎';
}

function DatixDocuments() {
  const { user } = useAuth();
  const isAdminUser = user?.role === 'ADMIN';
  const [docs, setDocs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [error, setError] = useState('');
  const [dragging, setDragging] = useState(false);
  const [queue, setQueue] = useState([]); // [{ file, status: 'waiting'|'uploading'|'done'|'error', message }]
  const location = useLocation();
  const initialParams = new URLSearchParams(location.search);
  const [datixRef, setDatixRef] = useState('');
  const [trustId, setTrustId] = useState('');
  const [trusts, setTrusts] = useState([]);
  const [filterTrust, setFilterTrust] = useState(initialParams.get('trust') || '');
  const [filterUnlinked, setFilterUnlinked] = useState(initialParams.get('unlinked') === '1');
  const [incidentRef, setIncidentRef] = useState('');
  const [notes, setNotes] = useState('');
  const [uploading, setUploading] = useState(false);
  const [incidentRefs, setIncidentRefs] = useState([]);
  const [editing, setEditing] = useState(null);
  const [historyFor, setHistoryFor] = useState(null);
  const [authorised, setAuthorised] = useState(null);
  const canOpen = !!authorised?.youCanOpen;
  const fileInput = useRef(null);
  const dragDepth = useRef(0);

  function load(q = search) {
    setLoading(true);
    return api.listDatix({ q, trustId: filterTrust || undefined, unlinked: filterUnlinked ? 1 : undefined })
      .then(setDocs).catch((err) => setError(err.message || 'Could not load documents')).finally(() => setLoading(false));
  }
  function loadTrusts() {
    return api.listDatixTrusts(true).then(setTrusts).catch(() => {});
  }

  useEffect(() => {
    loadTrusts();
    api.getDatixAuthorised().then(setAuthorised).catch(() => {});
    api.listIncidents().then((rows) => setIncidentRefs(rows.map((r) => r.ref))).catch(() => {});
  }, []);

  useEffect(() => {
    const t = setTimeout(() => load(search), 300);
    return () => clearTimeout(t);
  }, [search, filterTrust, filterUnlinked]);

  function addFiles(fileList) {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    setError('');
    setQueue((prev) => [
      ...prev.filter((q) => q.status !== 'done'),
      ...files.map((file) => ({
        file,
        status: file.size > DATIX_MAX_MB * 1024 * 1024 ? 'error' : 'waiting',
        message: file.size > DATIX_MAX_MB * 1024 * 1024 ? `Too large (${DATIX_MAX_MB} MB max)` : '',
      })),
    ]);
  }

  function onDragEnter(e) { e.preventDefault(); dragDepth.current++; setDragging(true); }
  function onDragLeave(e) { e.preventDefault(); dragDepth.current = Math.max(0, dragDepth.current - 1); if (!dragDepth.current) setDragging(false); }
  function onDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; }
  function onDrop(e) {
    e.preventDefault();
    dragDepth.current = 0;
    setDragging(false);
    addFiles(e.dataTransfer.files);
  }

  async function uploadAll() {
    setUploading(true);
    setError('');
    const items = [...queue];
    for (let i = 0; i < items.length; i++) {
      if (items[i].status !== 'waiting') continue;
      items[i] = { ...items[i], status: 'uploading' };
      setQueue([...items]);
      try {
        const fd = new FormData();
        fd.append('file', items[i].file);
        if (datixRef.trim()) fd.append('datixRef', datixRef.trim());
        if (trustId) fd.append('trustId', trustId);
        if (incidentRef.trim()) fd.append('incidentRef', incidentRef.trim());
        if (notes.trim()) fd.append('notes', notes.trim());
        await api.uploadDatix(fd);
        items[i] = { ...items[i], status: 'done', message: '' };
      } catch (err) {
        items[i] = { ...items[i], status: 'error', message: err.message || 'Upload failed' };
      }
      setQueue([...items]);
    }
    setUploading(false);
    if (items.every((q) => q.status === 'done')) {
      setDatixRef(''); setTrustId(''); setIncidentRef(''); setNotes('');
      setTimeout(() => setQueue((prev) => prev.filter((q) => q.status !== 'done')), 2500);
    }
    load();
  }

  async function openDoc(d) {
    try {
      const { url } = await api.getDatixDownloadUrl(d.id);
      window.open(url, '_blank');
    } catch (err) {
      setError(err.message || 'Could not open the document');
    }
  }

  async function removeDoc(d) {
    if (!confirm(`Delete "${d.fileName}"? The file is removed permanently.`)) return;
    try {
      await api.deleteDatix(d.id);
      load();
    } catch (err) {
      setError(err.message || 'Could not delete the document');
    }
  }

  const waiting = queue.filter((q) => q.status === 'waiting').length;

  return (
    <div>
      <div className="page-header">
        <h1>Datix Documents</h1>
      </div>
      <p className="muted" style={{ marginTop: -8 }}>
        Store documents you receive from NHS trusts' Datix systems — incident reports, feedback and requests for information.
        They may contain patient information: only managers and admins can see them, and every upload and download is recorded.
      </p>

      {error && <div className="error-banner">{error}</div>}
      {authorised && <DatixAccessBanner authorised={authorised} />}

      <div className="card" style={{ marginBottom: 20 }}>
        <div
          className={'dropzone' + (dragging ? ' dropzone-active' : '')}
          style={{ padding: 36 }}
          onDragEnter={onDragEnter}
          onDragLeave={onDragLeave}
          onDragOver={onDragOver}
          onDrop={onDrop}
          onClick={() => fileInput.current?.click()}
          role="button"
          tabIndex={0}
          onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.current?.click(); } }}
        >
          <div className="dropzone-icon">📥</div>
          <div style={{ fontSize: 15, fontWeight: 600 }}>{dragging ? 'Drop the files here' : 'Drag and drop Datix files here'}</div>
          <div>or click to choose files · PDF, Word, Excel, emails (.msg / .eml), images or zip · up to {DATIX_MAX_MB} MB each</div>
          <input ref={fileInput} type="file" multiple accept={DATIX_ACCEPT} style={{ display: 'none' }}
            onChange={(e) => { addFiles(e.target.files); e.target.value = ''; }} />
        </div>

        {queue.length > 0 && (
          <div style={{ marginTop: 16 }}>
            <table className="table">
              <tbody>
                {queue.map((q, i) => (
                  <tr key={i}>
                    <td style={{ width: 28 }}>{datixFileIcon(q.file.name)}</td>
                    <td>{q.file.name}</td>
                    <td style={{ width: 90 }}>{fmtFileSize(q.file.size)}</td>
                    <td style={{ width: 220 }}>
                      {q.status === 'waiting' && <span className="badge badge-grey">Ready</span>}
                      {q.status === 'uploading' && <span className="badge">Uploading…</span>}
                      {q.status === 'done' && <span className="badge badge-green">Uploaded</span>}
                      {q.status === 'error' && <span className="badge badge-red" title={q.message}>{q.message || 'Failed'}</span>}
                    </td>
                    <td style={{ width: 40 }}>
                      {(q.status === 'waiting' || q.status === 'error') && !uploading && (
                        <span className="dropzone-file-remove" title="Remove" onClick={() => setQueue(queue.filter((_, j) => j !== i))}>✕</span>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>

            <div className="form-grid" style={{ marginTop: 12 }}>
              <div className="form-field">
                <label>Datix reference (optional)</label>
                <input value={datixRef} onChange={(e) => setDatixRef(e.target.value)} placeholder="e.g. W123456" />
              </div>
              <div className="form-field">
                <label>NHS trust (optional)</label>
                <DatixTrustSelect value={trustId} onChange={setTrustId} trusts={trusts}
                  onAdded={(t) => { loadTrusts(); setTrustId(String(t.id)); }} />
              </div>
              <div className="form-field">
                <label>Link to Dynamo incident (optional)</label>
                <input list="datix-incident-refs" value={incidentRef} onChange={(e) => setIncidentRef(e.target.value)} placeholder="e.g. 26/11/2026 - 0002" />
                <datalist id="datix-incident-refs">{incidentRefs.map((r) => <option key={r} value={r} />)}</datalist>
              </div>
              <div className="form-field">
                <label>Notes (optional)</label>
                <input value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="What it's about" />
              </div>
            </div>
            <p className="muted" style={{ fontSize: 12, margin: '4px 0 10px' }}>These details are added to every file in this upload. You can change them for each file afterwards.</p>
            <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8 }}>
              <button type="button" className="btn btn-ghost" disabled={uploading} onClick={() => setQueue([])}>Clear</button>
              <button type="button" className="btn btn-primary" disabled={uploading || waiting === 0} onClick={uploadAll}>
                {uploading ? 'Uploading…' : `Upload ${waiting} file${waiting === 1 ? '' : 's'}`}
              </button>
            </div>
          </div>
        )}
      </div>

      <div className="card table-card">
        <div style={{ padding: '12px 16px', display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' }}>
          <input style={{ flex: 1, minWidth: 220, maxWidth: 380 }} value={search} onChange={(e) => setSearch(e.target.value)}
            placeholder="Search by file name, Datix ref, trust, notes or incident ref" />
          <select value={filterTrust} onChange={(e) => setFilterTrust(e.target.value)} style={{ maxWidth: 260 }} aria-label="Filter by NHS trust">
            <option value="">All NHS trusts</option>
            {trusts.map((t) => <option key={t.id} value={t.id}>{t.name}{t.active ? '' : ' (archived)'}</option>)}
            <option value="none">No trust recorded</option>
          </select>
          <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13, whiteSpace: 'nowrap' }}>
            <input type="checkbox" checked={filterUnlinked} onChange={(e) => setFilterUnlinked(e.target.checked)} style={{ width: 'auto' }} />
            Not linked to an incident
          </label>
          <span className="muted" style={{ fontSize: 13 }}>{docs.length} document{docs.length === 1 ? '' : 's'}</span>
        </div>
        {loading && docs.length === 0 ? (
          <div className="empty">Loading…</div>
        ) : docs.length === 0 ? (
          <div className="empty">{search || filterTrust || filterUnlinked ? 'No documents match.' : 'No Datix documents yet. Drag files into the box above.'}</div>
        ) : (
          <table className="table">
            <thead>
              <tr>
                <th>File</th>
                <th>Datix ref</th>
                <th>Trust</th>
                <th>Incident</th>
                <th>Uploaded</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {docs.map((d) => (
                <tr key={d.id}>
                  <td>
                    {canOpen
                      ? <a href="#" onClick={(e) => { e.preventDefault(); openDoc(d); }}>{datixFileIcon(d.fileName)} {d.fileName}</a>
                      : <span title="Only authorised staff can open Datix documents">🔒 {d.fileName}</span>}
                    <div className="muted" style={{ fontSize: 12 }}>
                      {fmtFileSize(d.fileSize)}{d.notes ? ' · ' + d.notes : (d.hasNotes && !canOpen ? ' · notes hidden' : '')}
                    </div>
                  </td>
                  <td>{d.datixRef || '—'}</td>
                  <td>{d.trust || '—'}</td>
                  <td>{d.incidentRef || '—'}</td>
                  <td>
                    {new Date(d.uploadedAt).toLocaleDateString('en-GB')}
                    <div className="muted" style={{ fontSize: 12 }}>{d.uploadedByName || ''}</div>
                  </td>
                  <td className="actions-cell" style={{ whiteSpace: 'nowrap' }}>
                    {canOpen && <button type="button" className="btn btn-ghost btn-sm" onClick={() => openDoc(d)}>Open</button>}
                    {canOpen && <button type="button" className="btn btn-ghost btn-sm" onClick={() => setEditing(d)}>Edit</button>}
                    <button type="button" className="btn btn-ghost btn-sm" onClick={() => setHistoryFor(d)}>History</button>
                    {isAdminUser && canOpen && <button type="button" className="btn btn-ghost btn-sm" onClick={() => removeDoc(d)}>Delete</button>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {editing && (
        <DatixEditModal doc={editing} incidentRefs={incidentRefs} trusts={trusts} onTrustAdded={loadTrusts} onClose={() => setEditing(null)}
          onSaved={() => { setEditing(null); load(); }} />
      )}
      {historyFor && <DatixHistoryModal doc={historyFor} onClose={() => setHistoryFor(null)} />}
    </div>
  );
}

// Who can open Datix documents. Shown on both Datix pages.
function DatixAccessBanner({ authorised, compact }) {
  const names = authorised.staff.map((p) => p.name + (p.datixRole ? ` (${p.datixRole})` : '')).join(', ') || 'nobody yet';
  if (authorised.youCanOpen) {
    return compact ? null : (
      <div className="success-banner" style={{ marginBottom: 14 }}>
        🔓 <strong>You're authorised to open Datix documents.</strong> Authorised staff: {names}. Every document you open is recorded.
      </div>
    );
  }
  return (
    <div className="warning-banner" style={{ marginBottom: 14 }}>
      🔒 <strong>You need authorisation to open Datix documents.</strong> You can upload them and see the list, but only
      the authorised staff can open them: {names}. Ask one of them if you need to see a document.
    </div>
  );
}

// Dropdown of active NHS trusts, with "+ Add a new NHS trust…" at the end.
// keepId keeps an archived trust selectable when it's already on a document.
function DatixTrustSelect({ value, onChange, trusts, onAdded, keepId }) {
  const [adding, setAdding] = useState(false);
  const options = trusts.filter((t) => t.active || String(t.id) === String(keepId));
  return (
    <>
      <select value={value} onChange={(e) => {
        if (e.target.value === '__add') { setAdding(true); return; }
        onChange(e.target.value);
      }}>
        <option value="">— None —</option>
        {options.map((t) => <option key={t.id} value={t.id}>{t.name}{t.active ? '' : ' (archived)'}</option>)}
        <option value="__add">+ Add a new NHS trust…</option>
      </select>
      {adding && (
        <DatixTrustModal onClose={() => setAdding(false)} onSaved={(t) => { setAdding(false); onAdded && onAdded(t); }} />
      )}
    </>
  );
}

function DatixTrustModal({ trust, onClose, onSaved }) {
  const isEdit = !!trust;
  const [name, setName] = useState(trust?.name || '');
  const [shortName, setShortName] = useState(trust?.shortName || '');
  const [contactName, setContactName] = useState(trust?.contactName || '');
  const [contactEmail, setContactEmail] = useState(trust?.contactEmail || '');
  const [notes, setNotes] = useState(trust?.notes || '');
  const [active, setActive] = useState(trust ? !!trust.active : true);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  // Not a <form>: this window can open inside another form (Edit document),
  // and nested forms submit the outer one. Enter is handled here instead.
  async function handleSubmit(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (!name.trim()) { setError("Enter the trust's name."); return; }
    setError('');
    setBusy(true);
    try {
      const data = { name, shortName, contactName, contactEmail, notes, active };
      const saved = isEdit ? await api.updateDatixTrust(trust.id, data) : await api.createDatixTrust(data);
      onSaved(saved);
    } catch (err) {
      setError(err.message || 'Could not save the trust');
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="modal-backdrop" onMouseDown={(e) => { e.stopPropagation(); onClose(); }} style={{ zIndex: 1100 }}>
      <div className="modal" role="dialog" aria-modal="true" onMouseDown={(e) => e.stopPropagation()}
        onKeyDown={(e) => {
          if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') handleSubmit(e);
          if (e.key === 'Escape') { e.stopPropagation(); onClose(); }
        }}>
        <div className="modal-header">
          <h2>{isEdit ? `Edit ${trust.name}` : 'Add an NHS trust'}</h2>
          <button type="button" className="modal-close" onClick={onClose}>✕</button>
        </div>
        {error && <div className="error-banner">{error}</div>}
        <div className="form-grid">
          <div className="form-field form-field-wide">
            <label>Trust name</label>
            <input value={name} onChange={(e) => setName(e.target.value)} required autoFocus
              placeholder="e.g. Leeds Teaching Hospitals NHS Trust" />
          </div>
          <div className="form-field">
            <label>Short name (optional)</label>
            <input value={shortName} onChange={(e) => setShortName(e.target.value)} placeholder="e.g. LTHT" />
          </div>
          {isEdit && (
            <div className="form-field">
              <label>Status</label>
              <select value={active ? 'active' : 'archived'} onChange={(e) => setActive(e.target.value === 'active')}>
                <option value="active">Active</option>
                <option value="archived">Archived (hidden from new uploads)</option>
              </select>
            </div>
          )}
          <div className="form-field">
            <label>Datix contact name (optional)</label>
            <input value={contactName} onChange={(e) => setContactName(e.target.value)} />
          </div>
          <div className="form-field">
            <label>Contact email (optional)</label>
            <input type="email" value={contactEmail} onChange={(e) => setContactEmail(e.target.value)} placeholder="name@nhs.net" />
          </div>
          <div className="form-field form-field-wide">
            <label>Notes (optional)</label>
            <textarea rows={2} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="e.g. Datix team, how they send documents" />
          </div>
        </div>
        <div className="modal-footer">
          <div />
          <div className="modal-footer-right">
            <button type="button" className="btn btn-ghost" onClick={onClose} disabled={busy}>Cancel</button>
            <button type="button" className="btn btn-primary" disabled={busy} onClick={handleSubmit}>{busy ? 'Saving…' : isEdit ? 'Save' : 'Add trust'}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function DatixEditModal({ doc, incidentRefs, trusts, onTrustAdded, onClose, onSaved }) {
  const [fileName, setFileName] = useState(doc.fileName || '');
  const [datixRef, setDatixRef] = useState(doc.datixRef || '');
  const [trustId, setTrustId] = useState(doc.trustId ? String(doc.trustId) : '');
  const [incidentRef, setIncidentRef] = useState(doc.incidentRef || '');
  const [notes, setNotes] = useState(doc.notes || '');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    setBusy(true);
    try {
      await api.updateDatix(doc.id, { fileName, datixRef, trustId, incidentRef, notes });
      onSaved();
    } catch (err) {
      setError(err.message || 'Could not save');
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="modal-backdrop" onMouseDown={onClose}>
      <form className="modal" onMouseDown={(e) => e.stopPropagation()} onSubmit={handleSubmit}>
        <div className="modal-header">
          <h2>Edit Datix document</h2>
          <button type="button" className="modal-close" onClick={onClose}>✕</button>
        </div>
        {error && <div className="error-banner">{error}</div>}
        <div className="form-grid">
          <div className="form-field form-field-wide">
            <label>File name</label>
            <input value={fileName} onChange={(e) => setFileName(e.target.value)} required />
          </div>
          <div className="form-field">
            <label>Datix reference</label>
            <input value={datixRef} onChange={(e) => setDatixRef(e.target.value)} />
          </div>
          <div className="form-field">
            <label>NHS trust</label>
            <DatixTrustSelect value={trustId} onChange={setTrustId} trusts={trusts} keepId={doc.trustId}
              onAdded={(t) => { onTrustAdded && onTrustAdded(); setTrustId(String(t.id)); }} />
          </div>
          <div className="form-field form-field-wide">
            <label>Linked Dynamo incident</label>
            <input list="datix-edit-incident-refs" value={incidentRef} onChange={(e) => setIncidentRef(e.target.value)} placeholder="Leave blank for none" />
            <datalist id="datix-edit-incident-refs">{incidentRefs.map((r) => <option key={r} value={r} />)}</datalist>
          </div>
          <div className="form-field form-field-wide">
            <label>Notes</label>
            <textarea rows={3} value={notes} onChange={(e) => setNotes(e.target.value)} />
          </div>
        </div>
        <div className="modal-footer">
          <div />
          <div className="modal-footer-right">
            <button type="button" className="btn btn-ghost" onClick={onClose} disabled={busy}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>{busy ? 'Saving…' : 'Save'}</button>
          </div>
        </div>
      </form>
    </div>
  );
}

function Staff() {
  const { user: me } = useAuth();
  const [staff, setStaff] = useState([]);
  const [removed, setRemoved] = useState([]);
  const [tab, setTab] = useState('current');
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(null); // staff object, 'new', or null

  function load() {
    setLoading(true);
    api.listRemovedStaff().then(setRemoved).catch(() => {});
    return api.listStaff().then(setStaff).finally(() => setLoading(false));
  }

  async function handleRestore(s) {
    if (!confirm(`Restore ${s.name}? Their account becomes active again and they can sign in with their existing password and two-factor sign-in.`)) return;
    try {
      await api.restoreStaff(s.id);
      load();
    } catch (err) {
      alert(err.message || 'Failed to restore staff member');
    }
  }

  useEffect(() => {
    load();
  }, []);

  async function handleDelete(e, s) {
    e.stopPropagation();
    if (!confirm(`Remove ${s.name}? They'll be signed out straight away and won't be able to sign in. They'll move to the Removed tab, where they can be restored.`)) return;
    try {
      await api.deleteStaff(s.id);
      load();
    } catch (err) {
      alert(err.message || 'Failed to remove staff member');
    }
  }

  async function handleMfaReset(e, s) {
    e.stopPropagation();
    if (!confirm(`Reset two-factor sign-in for ${s.name}? They'll be signed out and must set it up again (for example on a new phone) when they next sign in.`)) return;
    try {
      await api.resetStaffMfa(s.id);
      load();
    } catch (err) {
      alert(err.message || 'Failed to reset two-factor sign-in');
    }
  }

  return (
    <div>
      <div className="page-header">
        <h1>Staff</h1>
        <button className="btn btn-primary" onClick={() => setEditing('new')}>+ Add staff</button>
      </div>

      <div className="tabs">
        <button className={'tab-btn' + (tab === 'current' ? ' active' : '')} onClick={() => setTab('current')}>
          Current staff ({staff.length})
        </button>
        <button className={'tab-btn' + (tab === 'removed' ? ' active' : '')} onClick={() => setTab('removed')}>
          Removed staff ({removed.length})
        </button>
      </div>

      {tab === 'removed' ? (
        <div className="card table-card">
          {removed.length === 0 ? (
            <div className="empty">No removed staff members.</div>
          ) : (
            <table className="table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Removed</th>
                  <th>Removed by</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                {removed.map((s) => (
                  <tr key={s.id}>
                    <td>{s.name}</td>
                    <td>{s.anonymisedAt ? '—' : s.email}</td>
                    <td>{s.role}</td>
                    <td>{new Date(s.removedAt || s.anonymisedAt).toLocaleDateString('en-GB')}</td>
                    <td>{s.anonymisedAt ? <span className="badge badge-grey">Anonymised</span> : (s.removedByName || '—')}</td>
                    <td className="actions-cell">
                      {!s.anonymisedAt && (s.role !== 'ADMIN' || me?.role === 'ADMIN') && (
                        <button type="button" className="btn btn-ghost btn-sm" onClick={() => handleRestore(s)}>Restore</button>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
          <div className="muted" style={{ fontSize: 12, padding: '10px 16px' }}>
            Removed staff can't sign in. Their name stays on the records they worked on. They're anonymised automatically after the leaver retention period set on the data protection page (/gdpr), and anonymised accounts can't be restored.
          </div>
        </div>
      ) : (
      <div className="card table-card">
        {loading ? (
          <div className="empty">Loading…</div>
        ) : staff.length === 0 ? (
          <div className="empty">No staff added yet.</div>
        ) : (
          <table className="table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Role</th>
                <th>Status</th>
                <th>Two-factor</th>
                <th>Datix</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {staff.map((s) => (
                <tr key={s.id} className="row-clickable" onClick={() => setEditing(s)}>
                  <td>{s.name}</td>
                  <td>{s.email}</td>
                  <td>{s.phone || '—'}</td>
                  <td>{s.role}</td>
                  <td>
                    <span className={'badge ' + (s.active ? 'badge-green' : 'badge-grey')}>
                      {s.active ? 'Active' : 'Inactive'}
                    </span>
                  </td>
                  <td>
                    <span className={'badge ' + (s.mfaEnabled ? 'badge-green' : 'badge-grey')}>
                      {s.mfaEnabled ? 'On' : 'Not set up'}
                    </span>
                  </td>
                  <td>
                    {s.datixAccess
                      ? <span className="badge badge-blue" title="Can open Datix documents">🔓 {s.datixRole || 'Access'}</span>
                      : <span className="muted">—</span>}
                  </td>
                  <td className="actions-cell">
                    {s.mfaEnabled && s.id !== me?.id && (s.role !== 'ADMIN' || me?.role === 'ADMIN') && (
                      <button type="button" className="btn btn-ghost btn-sm" onClick={(e) => handleMfaReset(e, s)}>
                        Reset 2FA
                      </button>
                    )}
                    <button
                      type="button"
                      className="btn btn-ghost btn-sm"
                      onClick={(e) => handleDelete(e, s)}
                    >
                      Remove
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      )}

      {editing && (
        <StaffModal
          staff={editing === 'new' ? null : editing}
          onClose={() => setEditing(null)}
          onSaved={() => { setEditing(null); load(); }}
        />
      )}
    </div>
  );
}



function TwoFactorSettingsCard() {
  const [status, setStatus] = useState(null);
  const [code, setCode] = useState('');
  const [codes, setCodes] = useState(null);
  const [settingUp, setSettingUp] = useState(false);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  function load() {
    api.getMyMfa().then(setStatus).catch(() => {});
  }
  useEffect(load, []);

  async function handleRenew(e) {
    e.preventDefault();
    setError('');
    setBusy(true);
    try {
      const res = await api.renewRecoveryCodes(code.replace(/\s/g, ''));
      setCodes(res.recoveryCodes);
      setCode('');
      load();
    } catch (err) {
      setError(err.message || 'Could not issue new codes');
    } finally {
      setBusy(false);
    }
  }

  if (!status) return null;
  return (
    <div className="card" style={{ maxWidth: 560, marginTop: 20 }}>
      <div className="settings-section-title">Two-factor sign-in</div>
      {error && <div className="error-banner">{error}</div>}
      {codes ? (
        <RecoveryCodesView codes={codes} onContinue={() => setCodes(null)} continueLabel="Done" />
      ) : status.enabled ? (
        <>
          <p style={{ fontSize: 14 }}>
            <span className="badge badge-green">On</span>{' '}
            since {new Date(status.enabledAt).toLocaleDateString('en-GB')}. You have{' '}
            <strong>{status.recoveryCodesLeft}</strong> unused recovery code{status.recoveryCodesLeft === 1 ? '' : 's'}.
          </p>
          <form onSubmit={handleRenew} className="form-grid">
            <div className="form-field">
              <label>Get new recovery codes (old ones stop working)</label>
              <input inputMode="numeric" autoComplete="one-time-code" maxLength={7} value={code}
                onChange={(e) => setCode(e.target.value)} placeholder="Code from your app" required />
            </div>
            <div className="form-field" style={{ justifyContent: 'flex-end' }}>
              <button type="submit" className="btn btn-primary" disabled={busy || code.replace(/\s/g, '').length !== 6}>
                {busy ? 'Checking…' : 'Get new codes'}
              </button>
            </div>
          </form>
          <p className="muted" style={{ fontSize: 13 }}>New phone? Ask an admin to reset your two-factor sign-in on the Staff page, then set it up again at your next sign-in.</p>
        </>
      ) : settingUp ? (
        <MfaSetupPanel onEnabled={(res) => { setSettingUp(false); setCodes(res.recoveryCodes); }} />
      ) : (
        <>
          <p style={{ fontSize: 14 }}>Not set up. Add a code from an authenticator app to your sign-in.</p>
          <button type="button" className="btn btn-primary" onClick={() => setSettingUp(true)}>Set up two-factor sign-in</button>
        </>
      )}
    </div>
  );
}

      api.getSettings().then((s) => {
        setDaysToRespond(s.daysToRespond);
        setHoursToAllocate(s.hoursToAllocate);
        if (s.candourTargetDays) setCandourTargetDays(s.candourTargetDays);
      }).catch(() => {});
      api.listStaff().then(setStaffList).catch(() => {});

  function toggleStaffSelected(id) {
    setSelectedStaffIds((prev) =>
      prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]
    );
  }

  async function handleResetPasswords(e) {
    e.preventDefault();
    setResetError('');
    setResetResults(null);
    if (selectedStaffIds.length === 0) {
      setResetError('Select at least one staff member');
      return;
    }
    if (!confirm(`Reset the password for ${selectedStaffIds.length} selected staff member${selectedStaffIds.length === 1 ? '' : 's'}? Their current password will stop working immediately.`)) {
      return;
    }
    setResetBusy(true);
    try {
      const { results } = await api.resetStaffPasswords(selectedStaffIds);
      setResetResults(results);
      setSelectedStaffIds([]);
    } catch (err) {
      setResetError(err.message || 'Failed to reset passwords');
    } finally {
      setResetBusy(false);
    }
  }

  async function handleSlaSubmit(e) {
    e.preventDefault();
    setSlaError('');
    setSlaSuccess('');
    setSlaBusy(true);
    try {
      const saved = await api.updateSettings({
        daysToRespond: Number(daysToRespond),
        hoursToAllocate: Number(hoursToAllocate),
        candourTargetDays: Number(candourTargetDays),
      });
      setDaysToRespond(saved.daysToRespond);
      setHoursToAllocate(saved.hoursToAllocate);
      if (saved.candourTargetDays) setCandourTargetDays(saved.candourTargetDays);

    } catch (err) {
      setSlaError(err.message || 'Failed to save setting');
    } finally {
      setSlaBusy(false);
    }
  }

  async function handleSendDigest() {
    setDigestError('');
    setDigestResult(null);
    setDigestBusy(true);
    try {
      const result = await api.runDigest();
      setDigestResult(result);
    } catch (err) {
      setDigestError(err.message || 'Failed to send digest');
    } finally {
      setDigestBusy(false);
    }
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    setSuccess('');

    if (newPassword && newPassword !== confirmPassword) {
      setError('New password and confirmation do not match');
      return;
    }
    if (newPassword && !currentPassword) {
      setError('Enter your current password to set a new one');
      return;
    }

    setBusy(true);
    try {
      const payload = { name, email, phone };
      if (newPassword) {
        payload.currentPassword = currentPassword;
        payload.newPassword = newPassword;
      }
      await api.updateMe(payload);
      await refreshUser();
      setCurrentPassword('');
      setNewPassword('');
      setConfirmPassword('');
      setSuccess('Your details have been saved.');
    } catch (err) {
      setError(err.message || 'Failed to save changes');
    } finally {
      setBusy(false);
    }
  }

  return (
    <div>
      <div className="page-header">
        <h1>Settings</h1>
      </div>

      <div className="card" style={{ maxWidth: 560, marginBottom: 20 }}>
        <div className="settings-section-title">User guide</div>
        <p className="muted" style={{ marginTop: -4, marginBottom: 12 }}>
          How to report and manage incidents, record duty of candour, RIDDOR and CQC steps, close incidents,
          and use fleet, staff and admin tools. Includes a quick reference of every deadline.
        </p>
        <a className="btn btn-primary" href="/guide" target="_blank" rel="noopener" style={{ textDecoration: 'none', display: 'inline-block' }}>
          Open user guide
        </a>
      </div>

      <div className="card" style={{ maxWidth: 560 }}>
        <form onSubmit={handleSubmit}>
          {error && <div className="error-banner">{error}</div>}
          {success && <div className="success-banner">{success}</div>}

          <div className="settings-section-title">My details</div>
          <div className="form-grid">
            <div className="form-field">
              <label>Full name</label>
              <input value={name} onChange={(e) => setName(e.target.value)} required />
            </div>
            <div className="form-field">
              <label>Email</label>
              <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required />
            </div>
            <div className="form-field form-field-wide">
              <label>Phone</label>
              <input value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="e.g. 07700 900000" />
            </div>
          </div>

          <div className="settings-section-title settings-section-spaced">Change password</div>
          <div className="form-grid">
            <div className="form-field form-field-wide">
              <label>Current password</label>
              <input

            </div>
            <div className="form-field">
              <label>New password</label>
              <input type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} placeholder="At least 12 characters (leave blank to keep current)" />
            </div>
            <div className="form-field">

          <div className="settings-footer">
            <button type="submit" className="btn btn-primary" disabled={busy}>
              {busy ? 'Saving…' : 'Save changes'}

          </div>
        </form>
      </div>

      <TwoFactorSettingsCard />

      {isAdmin && (
        <div className="card" style={{ maxWidth: 560, marginTop: 20 }}>

            <div className="form-grid">

                </select>
              </div>
              <div className="form-field">
                <label>Duty of candour target</label>
                <select value={candourTargetDays} onChange={(e) => setCandourTargetDays(Number(e.target.value))}>

                </select>
              </div>
            </div>
            <p className="muted" style={{ marginTop: 4 }}>
              Incidents are flagged amber within 24 hours of this deadline, and red once overdue. Maximum 5 days.

            <p className="muted" style={{ marginTop: 4 }}>
              Duty of candour target: once an incident is recorded as a notifiable safety incident, the person must be told

              reasonably practicable”, so this is your internal target.

            <div className="settings-footer">
              <button type="submit" className="btn btn-primary" disabled={slaBusy}>

      {isAdmin && (
        <div className="card" style={{ maxWidth: 560, marginTop: 20 }}>
          {digestError && <div className="error-banner">{digestError}</div>}

            <div className="success-banner">

          <p className="muted" style={{ marginTop: -4, marginBottom: 12 }}>

          </p>
          <div className="settings-footer">
            <button type="button" className="btn btn-primary" onClick={handleSendDigest} disabled={digestBusy}>

        </div>
      )}

      {isAdmin && (
        <div className="card" style={{ maxWidth: 560, marginTop: 20 }}>
          <form onSubmit={handleResetPasswords}>
            {resetError && <div className="error-banner">{resetError}</div>}

            <div className="settings-section-title">Password reset</div>
            <p className="muted" style={{ marginTop: -4, marginBottom: 12 }}>
              Select staff members to reset their password. A new temporary password is generated
              for each and shown below — pass it on to them so they can sign in and change it.

            {staffList.length === 0 ? (
              <div className="empty">No staff to reset.</div>
            ) : (
              <div className="checklist">
                {staffList.map((s) => (
                  <div key={s.id} className="checklist-row">

            <div className="settings-footer">

          </form>

          {resetResults && resetResults.length > 0 && (
            <div style={{ marginTop: 16 }}>
              <div className="success-banner">

              </div>
              <table className="table">

        </div>
      )}
    </div>
  );
}

function fmtDeadline(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// One badge for a deadline state from incident.compliance (see
// computeCompliance in index.tsx).
function deadlineBadge(state, labels) {
  if (!state) return null;
  const cls = {
    RED: 'badge-red', AMBER: 'badge-amber', GREEN: 'badge-blue', DONE: 'badge-green',
    DECISION_NEEDED: 'badge-amber', AWAITING_FINDINGS: 'badge-blue', NOT_NOTIFIABLE: 'badge-grey',
  }[state] || 'badge-grey';
  const defaults = {
    RED: 'Overdue', AMBER: 'Due soon', GREEN: 'On track', DONE: 'Done',
    DECISION_NEEDED: 'Decision needed', AWAITING_FINDINGS: 'Findings to share', NOT_NOTIFIABLE: 'Not notifiable',
  };
  return <span className={'badge ' + cls}>{(labels && labels[state]) || defaults[state] || state}</span>;
}

// Compact badges for lists: only items that still need action.
function complianceBadges(i) {
  const c = i.compliance || {};
  const out = [];
  const needs = (s) => s && !['DONE', 'NOT_NOTIFIABLE'].includes(s);
  if (needs(c.candour?.state)) {
    const red = c.candour.state === 'RED';
    out.push(<span key="doc" className={'badge ' + (red ? 'badge-red' : 'badge-amber')} style={{ marginRight: 6 }}>
      Candour{c.candour.state === 'DECISION_NEEDED' ? ': decide' : red ? ': overdue' : ''}</span>);
  }
  if (c.riddor && c.riddor.state !== 'DONE') {
    out.push(<span key="riddor" className={'badge ' + (c.riddor.state === 'RED' ? 'badge-red' : 'badge-amber')} style={{ marginRight: 6 }}>
      RIDDOR{c.riddor.state === 'RED' ? ': overdue' : ': to submit'}</span>);
  }
  if (c.cqc && c.cqc.state !== 'DONE') {
    out.push(<span key="cqc" className={'badge ' + (c.cqc.state === 'RED' ? 'badge-red' : 'badge-amber')} style={{ marginRight: 6 }}>
      CQC{c.cqc.state === 'RED' ? ': overdue' : ': to notify'}</span>);
  }
  return out;
}

function hasComplianceAction(i) {
  return complianceBadges(i).length > 0;
}

function severityBadgeClass(severity) {
  if (severity === 'CRITICAL' || severity === 'HIGH') return 'badge-red';
  if (severity === 'MEDIUM') return 'badge-amber';
  return 'badge-grey';
}

// Risk matrix — Probability x Impact, used by admins when reviewing an
// incident (see IncidentDetailModal.jsx). Picking a likelihood and an
// impact suggests a severity; the admin can still override the Severity
// dropdown directly if their judgement differs from the matrix.
const RISK_LIKELIHOODS = ['RARE', 'UNLIKELY', 'MODERATE', 'LIKELY', 'VERY_LIKELY'];
const RISK_LIKELIHOOD_LABELS = {
  RARE: 'Rare',
  UNLIKELY: 'Unlikely',
  MODERATE: 'Moderate',
  LIKELY: 'Likely',
  VERY_LIKELY: 'Very likely',
};
const RISK_IMPACTS = ['TRIVIAL', 'MINOR', 'MODERATE', 'MAJOR', 'EXTREME'];
const RISK_IMPACT_LABELS = {
  TRIVIAL: 'Trivial',
  MINOR: 'Minor',
  MODERATE: 'Moderate',
  MAJOR: 'Major',
  EXTREME: 'Extreme',
};
// One row per likelihood (in RISK_LIKELIHOODS order), one value per impact
// (in RISK_IMPACTS order) — matches the organisation's reference 5x5 risk table.
const RISK_MATRIX = {
  RARE: ['LOW', 'LOW', 'LOW', 'MEDIUM', 'MEDIUM'],
  UNLIKELY: ['LOW', 'LOW', 'MEDIUM', 'MEDIUM', 'MEDIUM'],
  MODERATE: ['LOW', 'MEDIUM', 'MEDIUM', 'MEDIUM', 'HIGH'],
  LIKELY: ['MEDIUM', 'MEDIUM', 'MEDIUM', 'HIGH', 'HIGH'],
  VERY_LIKELY: ['MEDIUM', 'MEDIUM', 'HIGH', 'HIGH', 'HIGH'],
};
const RISK_LEVEL_CLASS = { LOW: 'risk-cell-low', MEDIUM: 'risk-cell-medium', HIGH: 'risk-cell-high' };

function riskLevelFor(likelihood, impact) {
  if (!likelihood || !impact) return null;
  const row = RISK_MATRIX[likelihood];
  const col = RISK_IMPACTS.indexOf(impact);
  if (!row || col < 0) return null;
  return row[col];
}

function RiskMatrix({ likelihood, impact }) {
  return (
    <div className="risk-matrix-wrap">
      <table className="risk-matrix">
        <thead>
          <tr>
            <th className="risk-matrix-corner" colSpan={2} rowSpan={2}></th>
            <th className="risk-matrix-impact-header" colSpan={RISK_IMPACTS.length}>Impact</th>
          </tr>
          <tr>
            {RISK_IMPACTS.map((imp) => (
              <th key={imp} className={'risk-matrix-col-label' + (imp === impact ? ' risk-matrix-active' : '')}>
                {RISK_IMPACT_LABELS[imp]}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {RISK_LIKELIHOODS.map((lik, rowIdx) => (
            <tr key={lik}>
              {rowIdx === 0 && (
                <th className="risk-matrix-row-header" rowSpan={RISK_LIKELIHOODS.length}>Probability</th>
              )}
              <th className={'risk-matrix-row-label' + (lik === likelihood ? ' risk-matrix-active' : '')}>
                {RISK_LIKELIHOOD_LABELS[lik]}
              </th>
              {RISK_MATRIX[lik].map((level, colIdx) => {
                const imp = RISK_IMPACTS[colIdx];
                const isSelected = lik === likelihood && imp === impact;
                return (
                  <td
                    key={imp}
                    className={'risk-cell ' + RISK_LEVEL_CLASS[level] + (isSelected ? ' risk-cell-selected' : '')}
                  >
                    {level.charAt(0) + level.slice(1).toLowerCase()}
                  </td>
                );
              })}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

const EMPTY_FILTERS = { status: '', severity: '', category: '', managerId: '', from: '', to: '', riddor: false, cqc: false, unallocated: false, regAction: false, q: '' };

function Incidents() {
  const { user } = useAuth();
  const [opening, setOpening] = useState(null);
  const [openError, setOpenError] = useState('');

  // Opening an incident: the assigned investigator and the responsible
  // manager go straight in (still recorded in the audit trail); everyone
  // else is asked for a reason.
  function opensWithoutReason(i) {
    const n = (v) => String(v || '').toLowerCase().replace(/\s+/g, ' ').trim();
    const investigator = !!n(i.investigatorName) && n(i.investigatorName) === n(user?.name);
    const manager = !!i.responsibleManagerId && user?.id != null && Number(i.responsibleManagerId) === Number(user.id);
    return investigator || manager;
  }
  async function requestOpen(i) {
    setOpenError('');
    if (opensWithoutReason(i)) {
      try {
        setViewing(await api.openIncident(i.id, ''));
        return;
      } catch (err) {
        if (!err.message || !/reason/i.test(err.message)) { setOpenError(err.message || 'Could not open incident'); return; }
      }
    }
    setOpening(i);
  }
  const isAdmin = isMgrOrAdmin(user?.role);
  const [incidents, setIncidents] = useState([]);
  const [managers, setManagers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [creating, setCreating] = useState(false);
  const [viewing, setViewing] = useState(null);
  const [showQr, setShowQr] = useState(false);
  const [filters, setFilters] = useState(EMPTY_FILTERS);
  const [exporting, setExporting] = useState(false);
  const [exportError, setExportError] = useState('');

  function load() {
    setLoading(true);
    return api.listIncidents().then(setIncidents).finally(() => setLoading(false));
  }

  useEffect(() => {
    load();
    if (isAdmin) {
      api.listStaff().then((rows) => setManagers(rows.filter((s) => s.role === 'ADMIN' || s.role === 'MANAGER'))).catch(() => {});
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const reportUrl = typeof window !== 'undefined' ? `${window.location.origin}/report` : '';
  const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(reportUrl)}`;

  const filtered = incidents.filter((i) => {
    if (filters.status && i.status !== filters.status) return false;
    if (filters.severity && i.severity !== filters.severity) return false;
    if (filters.category && i.category !== filters.category) return false;
    if (filters.managerId && String(i.responsibleManagerId || '') !== filters.managerId) return false;
    if (filters.from && new Date(i.occurredAt) < new Date(filters.from)) return false;
    if (filters.to && new Date(i.occurredAt) > new Date(`${filters.to}T23:59:59`)) return false;
    if (filters.riddor && !i.riddorReportable) return false;
    if (filters.cqc && !i.cqcNotifiable) return false;
    if (filters.unallocated && i.allocationStatus !== 'RED') return false;
    if (filters.regAction && !hasComplianceAction(i)) return false;
    if (filters.q) {
      const q = filters.q.trim().toLowerCase();

                  {isAdmin && <td>{i.isAnonymous ? 'Anonymous' : (i.reporterName || i.notifiedBy || '—')}</td>}

      </div>

      {creating && (
        <IncidentModal
          onClose={() => setCreating(false)}
          onSaved={() => { setCreating(false); load(); }}

      )}

      {opening && (
        <OpenReasonModal
          incident={opening}
          onClose={() => setOpening(null)}
          onOpened={(full) => { setOpening(null); setViewing(full); }}

      {openError && (
        <div className="error-banner" style={{ position: 'fixed', bottom: 16, right: 16, zIndex: 2000, maxWidth: 420 }}
          onClick={() => setOpenError('')}>{openError}</div>

      {viewing && (
        <IncidentDetailModal
          incident={viewing}
          onClose={() => setViewing(null)}
          onSaved={() => { setViewing(null); load(); }}
        />
